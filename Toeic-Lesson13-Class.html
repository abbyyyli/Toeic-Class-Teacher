<script>const slides=[{"type":"overview","title":"Lesson 13｜閱讀 131–158","subtitle":"Mode A · 多益試題 · 28 題","content":"\u003cdiv class=\"hero-grid\"\u003e\u003cdiv class=\"hero-card\"\u003e\u003cb\u003e28\u003c/b\u003e\u003cspan\u003e題依原題號\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"hero-card\"\u003e\u003cb\u003e9\u003c/b\u003e\u003cspan\u003e組完整文章\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"hero-card\"\u003e\u003cb\u003ePart 6–7\u003c/b\u003e\u003cspan\u003e先讀文章，再做題\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"g-formula\"\u003e作答流程：先判文章類型 → 讀題幹 → 回原文找證據 → 排除干擾選項\u003c/div\u003e\u003cdiv class=\"g-note\"\u003e按左右方向鍵換頁；按 Z 顯示／隱藏中文；空白鍵揭曉／收回答案。題目頁也可以展開「查看完整文章」。\u003c/div\u003e"},{"type":"overview","title":"閱讀時先畫四格","subtitle":"文章、人物、時間、證據","content":"\u003cdiv class=\"step-grid\"\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e1\u003c/b\u003e\u003cspan\u003e認出文體及讀者\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e2\u003c/b\u003e\u003cspan\u003e圈出問題的限制\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e3\u003c/b\u003e\u003cspan\u003e回文章定位句子\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e4\u003c/b\u003e\u003cspan\u003e逐項排除人名、時間與範圍錯置\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e"},{"type":"passage","title":"Customer Relationship Marketing","subtitle":"Questions 131–134","content":"\u003cdiv class=\"slide-article\" lang=\"en\"\u003e---131--- Customers are continually bombarded with purchasing alternatives in every aspect of their lives. Customers demand ---132--- and more from their purchases and their suppliers. ---133---, for companies, marketing must refocus away from selling products and toward creating relationships. Nowadays companies direct their attention ---134--- creating and maintaining an ongoing customer relationship.\u003c/div\u003e\u003cdiv class=\"q-zh zh-target\"\u003e如今人們生活在充滿選擇的時代。顧客在生活各面向不斷接觸各種購買選項；他們對購買的商品及供應商要求越來越多。因此企業行銷須從賣產品轉向建立關係，如今把注意力放在建立和維持長期顧客關係。\u003c/div\u003e"},{"type":"question","num":131,"title":"從銷售產品轉向顧客關係","sentence":"---131--- Customers are continually bombarded with purchasing alternatives in every aspect of their lives.","options":["Today more and more students choose to study abroad.","Nowadays people are used to juggling different projects.","Now people live in an age of choice.","Managers always want to recruit the best workers."],"answer":2,"zh":"如今人們生活在充滿選擇的時代；顧客在生活各方面不斷接觸各種購買選項。","rule":"整句插入；開場要能統領後文 purchasing alternatives。","explanation":"C 的 age of choice 與後一句購買選擇完全對應，並能引出顧客需求與行銷轉向。","vocab":["alternative (n. 選項；purchasing alternatives；Consumers have many alternatives.)","bombard (v. 使應接不暇；be bombarded with ads；People are bombarded with ads.)"],"article":"\u003cdiv class=\"slide-article\" lang=\"en\"\u003e---131--- Customers are continually bombarded with purchasing alternatives in every aspect of their lives. Customers demand ---132--- and more from their purchases and their suppliers. ---133---, for companies, marketing must refocus away from selling products and toward creating relationships. Nowadays companies direct their attention ---134--- creating and maintaining an ongoing customer relationship.\u003c/div\u003e","star":true},{"type":"question","num":132,"title":"從銷售產品轉向顧客關係","sentence":"Customers demand ---132--- and more from their purchases and their suppliers.","options":["less","more","most","worse"],"answer":1,"zh":"顧客對購買的商品及供應商要求越來越多。","rule":"比較級重複 more and more 表程度持續增加。","explanation":"more and more 是慣用的漸增表達，修飾 demand 的內容。","vocab":["demand (v. 要求；demand more；Customers demand more.)","supplier (n. 供應商；reliable supplier；We chose a reliable supplier.)"],"article":"\u003cdiv class=\"slide-article\" lang=\"en\"\u003e---131--- Customers are continually bombarded with purchasing alternatives in every aspect of their lives. Customers demand ---132--- and more from their purchases and their suppliers. ---133---, for companies, marketing must refocus away from sellin
