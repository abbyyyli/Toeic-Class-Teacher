<script>const slides=[{"type":"overview","title":"Lesson 13｜122–142","subtitle":"Mode A · Part 5–6 · 21 題","content":"<div class=\"hero-grid\"><div class=\"hero-card\"><b>9</b><span>題 Part 5</span></div><div class=\"hero-card\"><b>12</b><span>題 Part 6</span></div><div class=\"hero-card\"><b>3</b><span>組完整文章</span></div></div><div class=\"g-formula\">Part 5 先看空格；Part 6 先讀文章。</div>"},{"type":"overview","title":"Part 5｜Questions 122–130","subtitle":"先看空格左右，再確認詞性、搭配與語意","content":"<div class=\"hero-grid\"><div class=\"hero-card\"><b>9</b><span>題單句填空</span></div><div class=\"hero-card\"><b>4 步</b><span>左右 → 詞性 → 搭配 → 語意</span></div></div><div class=\"g-formula\">空格證據比逐字翻譯更快。</div>"},{"type":"question","num":122,"title":"Part 5｜Questions 122–130","sentence":"The world population is expected to grow ______ 7.6 billion to 9.8 billion people by 2050.","options":["from","between","to","since"],"answer":0,"zh":"預計到了 2050 年，世界人口將從 76 億成長至 98 億。","rule":"grow from A to B；起點 from、終點 to。","explanation":"from 與 to 形成起點到終點的標準結構。","vocab":["population（n. 人口；The population is growing.）","expect（v. 預期；Sales are expected to rise.）","billion（num./n. 十億；Two billion people use the service.）"],"article":"","star":true},{"type":"question","num":123,"title":"Part 5｜Questions 122–130","sentence":"A good director should treat employees with ______ and support their ideas.","options":["respected","respecting","respect","respectful"],"answer":2,"zh":"一位優秀的主管應該尊重地對待員工，並支持他們的想法。","rule":"treat someone with respect；介系詞後用名詞。","explanation":"respect 是名詞並完成自然搭配 treat employees with respect。","vocab":["treat（v. 對待；The firm treats staff fairly.）","respect（n./v. 尊重；We respect different opinions.）","respectful（adj. 尊重人的；He used a respectful tone.）"],"article":"","star":false},{"type":"question","num":124,"title":"Part 5｜Questions 122–130","sentence":"Employees will not feel part of the brand ______ they understand it and believe in it.","options":["however","unless","not only","therefore"],"answer":1,"zh":"除非員工了解並相信這個品牌，否則不會覺得自己是品牌的一分子。","rule":"unless 引導否定條件，等於 if…not。","explanation":"unless 精確表達「若不符合條件，就不會發生」。","vocab":["brand（n. 品牌；The company updated its brand.）","unless（conj. 除非；We will leave unless it rains.）","believe in（phr.v. 信任；認同；We believe in the mission.）"],"article":"","star":true},{"type":"question","num":125,"title":"Part 5｜Questions 122–130","sentence":"All team members are encouraged to ask questions, interact, and discuss the ______ of the team during the meeting.","options":["subjective","objections","subjects","objectives"],"answer":3,"zh":"所有團隊成員都受到鼓勵，在會議期間提出問題、互動並討論團隊目標。","rule":"objectives＝目標；discuss team objectives。","explanation":"objectives 指團隊目標，最符合會議合作情境。","vocab":["interact（v. 互動；Staff interact with customers.）","objective（n. 目標；We achieved the objective.）","objection（n. 異議；She raised an objection.）"],"article":"","star":false},{"type":"question","num":126,"title":"Part 5｜Questions 122–130","sentence":"Performance measurement and reward systems ______ a company’s culture in a powerful way.","options":["sympathize","symbolize","synchronize","syllabify"],"answer":1,"zh":"績效衡量與獎勵制度能以強而有力的方式象徵公司的文化。","rule":"symbolize＝象徵；相近拼字辨識。","explanation":"symbolize 可直接接受詞 culture，意為象徵。","vocab":["performance（n. 績效；The system measures performance.）","reward system（n. 獎勵制度；They introduced a reward system.）","symbolize（v. 象徵；The logo symbolizes trust.）"],"article":"","star":false},{"type":"question","num":127,"title":"Part 5｜Questions 122–130","sentence":"The New-Tech Forum brings you more topics, more insights, and more case studies ______ before, so don’t miss out and secure your place today.","options":["since","than","as","while"],"answer":1,"zh":"New-Tech Forum 為您帶來比以往更多的主題、見解與個案研究，所以別錯過，立即保留名額。","rule":"more…than before 比以前更多。","explanation":"than 與 more 呼應，形成標準比較結構。","vocab":["forum（n. 論壇；They joined an online forum.）","insight（n. 洞見；The report offers useful insights.）","secure（v. 取得；確保；Register to secure your place.）"],"article":"","star":true},{"type":"question","num":128,"title":"Part 5｜Questions 122–130","sentence":"They are increasing the ______ of soda because of greater demand during the summer.","options":["products","producing","production","produce"],"answer":2,"zh":"由於夏季需求增加，他們正在提高汽水的產量。","rule":"the production of soda；名詞 production 表生產/產量。","explanation":"production 是合適名詞，完整搭配 the production of soda。","vocab":["production（n. 生產；產量；The factory increased production.）","demand（n. 需求；Demand for soda rose.）","soda（n. 汽水；He bought a can of soda.）"],"article":"","star":false},{"type":"question","num":129,"title":"Part 5｜Questions 122–130","sentence":"______ communication skills are necessary to work well in a team environment.","options":["Effectively","Effective","Effect","Effectiveness"],"answer":1,"zh":"若想在團隊環境中順利合作，有效的溝通技巧是必要的。","rule":"形容詞 Effective 修飾 communication skills。","explanation":"Effective 是形容詞，直接修飾 communication skills。","vocab":["effective（adj. 有效的；We need an effective strategy.）","effectively（adv. 有效地；She communicates effectively.）","necessary（adj. 必要的；Training is necessary.）"],"article":"","star":true},{"type":"question","num":130,"title":"Part 5｜Questions 122–130","sentence":"Best-Tech is seeking highly qualified candidates with a commitment to the core ______ of the organization: Professionalism and Integrity.","options":["values","value","valuable","valuate"],"answer":0,"zh":"Best-Tech 正在尋找條件優秀，並認同該組織核心價值觀——專業精神與誠信——的候選人。","rule":"core values；冒號後列出 Professionalism 與 Integrity 兩項。","explanation":"values 是名詞複數，與兩項列舉和 core values 固定搭配一致。","vocab":["qualified（adj. 合格的；She is highly qualified.）","commitment（n. 承諾；投入；We have a commitment to quality.）","professionalism（n. 專業精神；Staff demonstrated professionalism.）"],"article":"","star":true},{"type":"overview","title":"閱讀時先畫四格","subtitle":"文章、人物、時間、證據","content":"<div class=\"step-grid\"><div class=\"step\"><b>1</b><span>認出文體及讀者</span></div><div class=\"step\"><b>2</b><span>圈出問題的限制</span></div><div class=\"step\"><b>3</b><span>回文章定位句子</span></div><div class=\"step\"><b>4</b><span>逐項排除人名、時間與範圍錯置</span></div></div>"},{"type":"passage","title":"Customer Relationship Marketing","subtitle":"Questions 131–134","content":"<div class=\"slide-article\" lang=\"en\">---131--- Customers are continually bombarded with purchasing alternatives in every aspect of their lives. Customers demand ---132--- and more from their purchases and their suppliers. ---133---, for companies, marketing must refocus away from selling products and toward creating relationships. Nowadays companies direct their attention ---134--- creating and maintaining an ongoing customer relationship.</div><div class=\"q-zh zh-target\">如今人們生活在充滿選擇的時代。顧客在生活各面向不斷接觸各種購買選項；他們對購買的商品及供應商要求越來越多。因此企業行銷須從賣產品轉向建立關係，如今把注意力放在建立和維持長期顧客關係。</div>"},{"type":"question","num":131,"title":"從銷售產品轉向顧客關係","sentence":"---131--- Customers are continually bombarded with purchasing alternatives in every aspect of their lives.","options":["Today more and more students choose to study abroad.","Nowadays people are used to juggling different projects.","Now people live in an age of choice.","Managers always want to recruit the best workers."],"answer":2,"zh":"如今人們生活在充滿選擇的時代；顧客在生活各方面不斷接觸各種購買選項。","rule":"整句插入；開場要能統領後文 purchasing alternatives。","explanation":"C 的 age of choice 與後一句購買選擇完全對應，並能引出顧客需求與行銷轉向。","vocab":["alternative (n. 選項；purchasing alternatives；Consumers have many alternatives.)","bombard (v. 使應接不暇；be bombarded with ads；People are bombarded with ads.)"],"article":"<div class=\"slide-article\" lang=\"en\">---131--- Customers are continually bombarded with purchasing alternatives in every aspect of their lives. Customers demand ---132--- and more from their purchases and their suppliers. ---133---, for companies, marketing must refocus away from selling products and toward creating relationships. Nowadays companies direct their attention ---134--- creating and maintaining an ongoing customer relationship.</div>","star":true},{"type":"question","num":132,"title":"從銷售產品轉向顧客關係","sentence":"Customers demand ---132--- and more from their purchases and their suppliers.","options":["less","more","most","worse"],"answer":1,"zh":"顧客對購買的商品及供應商要求越來越多。","rule":"比較級重複 more and more 表程度持續增加。","explanation":"more and more 是慣用的漸增表達，修飾 demand 的內容。","vocab":["demand (v. 要求；demand more；Customers demand more.)","supplier (n. 供應商；reliable supplier；We chose a reliable supplier.)"],"article":"<div class=\"slide-article\" lang=\"en\">---131--- Customers are continually bombarded with purchasing alternatives in every aspect of their lives. Customers demand ---132--- and more from their purchases and their suppliers. ---133---, for companies, marketing must refocus away from selling products and toward creating relationships. Nowadays companies direct their attention ---134--- creating and maintaining an ongoing customer relationship.</div>","star":false},{"type":"question","num":133,"title":"從銷售產品轉向顧客關係","sentence":"---133---, for companies, marketing must refocus away from selling products and toward creating relationships.","options":["Therefore","While","However","If"],"answer":0,"zh":"因此，對企業而言，行銷必須由銷售產品轉向建立關係。","rule":"前兩句是原因，後句是企業必須改變行銷策略的結果。","explanation":"Therefore 可作連接副詞，以逗號與後句隔開，表「因此」。","vocab":["refocus (v. 重新聚焦；refocus marketing；We refocused marketing.)","relationship (n. 關係；customer relationship；We build customer relationships.)"],"article":"<div class=\"slide-article\" lang=\"en\">---131--- Customers are continually bombarded with purchasing alternatives in every aspect of their lives. Customers demand ---132--- and more from their purchases and their suppliers. ---133---, for companies, marketing must refocus away from selling products and toward creating relationships. Nowadays companies direct their attention ---134--- creating and maintaining an ongoing customer relationship.</div>","star":true},{"type":"question","num":134,"title":"從銷售產品轉向顧客關係","sentence":"Nowadays companies direct their attention ---134--- creating and maintaining an let current=0,revealed=false,zhVisible=false;const TOTAL=slides.length;

function reveal(){let s=slides[current];if(s.type!=='question')return;revealed=!revealed;s.options.forEach((_,i)=>{let el=document.getElementById('opt-'+i);el.classList.toggle('correct',revealed&&i===s.answer);el.classList.toggle('dimmed',revealed&&i!==s.answer)});document.getElementById('key-reveal').classList.toggle('show',revealed);document.getElementById('reveal-btn').textContent=revealed?'隱藏答案 ▲':'揭曉答案 ▼'}
