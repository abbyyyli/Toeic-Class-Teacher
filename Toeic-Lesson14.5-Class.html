<script>const slides=[{"type": "overview", "title": "Lesson 14.5｜閱讀 159–180", "subtitle": "Mode A · 多益試題 · 22 題", "content": "<div class=\"hero-grid\"><div class=\"hero-card\"><b>22</b><span>題依原題號</span></div><div class=\"hero-card\"><b>6</b><span>組完整文章</span></div><div class=\"hero-card\"><b>Part 7</b><span>先讀文章，再做題</span></div></div><div class=\"g-formula\">作答流程：先判文章類型 → 讀題幹 → 回原文找證據 → 排除干擾選項</div><div class=\"g-note\">按左右方向鍵換頁；按 Z 顯示／隱藏中文；空白鍵揭曉／收回答案。題目頁也可以展開「查看完整文章」。</div>"}, {"type": "overview", "title": "閱讀時先畫四格", "subtitle": "文章、人物、時間、證據", "content": "<div class=\"step-grid\"><div class=\"step\"><b>1</b><span>認出文體及讀者</span></div><div class=\"step\"><b>2</b><span>圈出問題的限制</span></div><div class=\"step\"><b>3</b><span>回文章定位句子</span></div><div class=\"step\"><b>4</b><span>逐項排除人名、時間與範圍錯置</span></div></div>"}, {"type": "passage", "title": "Job Recommendations from Job-Link", "subtitle": "Questions 159–161", "content": "<div class=\"slide-article\" lang=\"en\">Make your job search easier.\nGet Job Recommendations from Job-Link!\n\nOur job matching tool targets jobs that match keywords in your resume, the jobs you view and ultimately the jobs you apply for. The more you use Job-Link.com the better the job matches become.\n\nUpload your resume!\nUploading your resume is the easiest and fastest way to start getting Job Recommendations.\n\nFind a job and apply!\nIf you don’t have an account and wish to stay “anonymous,” you need to apply to at least one position before we can recommend any jobs to you. If you have applied before then you can try to log in again and get your recommendations.\n\nNew users?\nVisit our website http://www.Job-Link.com today and register with us.</div><div class=\"article-translation zh-target\"><div class=\"article-translation-title\">完整中文翻譯</div><p>讓您的求職更輕鬆。</p><p>從 Job-Link 取得工作推薦！</p><p>我們的職缺配對工具會依據您履歷中的關鍵字、您瀏覽過的職缺，以及您最後應徵的職缺，找出相符的工作。</p><p>您越常使用 Job-Link.com，職缺配對就會越準確。</p><p>上傳您的履歷！</p><p>上傳履歷是開始取得工作推薦最簡單、最快速的方法。</p><p>找到工作並應徵！</p><p>如果您沒有帳號，而且希望保持「匿名」，您需要先應徵至少一個職位，我們才能為您推薦工作。</p><p>如果您以前應徵過，可以再次登入，取得您的工作推薦。</p><p>您是新用戶嗎？</p><p>今天就造訪我們的網站 http://www.Job-Link.com 並完成註冊。</p></div>"}, {"type": "question", "num": 159, "title": "Job-Link 履歷配對服務", "sentence": "What is true about Job-Link?", "options": ["It has branch offices all over the world.", "It is an online job bank.", "It has been operated for over a decade.", "Its headquarters is in Singapore."], "answer": 1, "zh": "關於 Job-Link，下列何者正確？", "rule": "文中網站依履歷和瀏覽紀錄配對職位，並讓用戶上傳履歷、線上申請。", "explanation": "B 是多句資料共同支持的性質，不必文章逐字寫 job bank。", "vocab": ["job bank (n. 求職網站；online job bank；Job-Link is an online job bank.)", "resume (n. 履歷；upload a resume；She uploaded her resume.)"], "article": "<div class=\"slide-article\" lang=\"en\">Make your job search easier.\nGet Job Recommendations from Job-Link!\n\nOur job matching tool targets jobs that match keywords in your resume, the jobs you view and ultimately the jobs you apply for. The more you use Job-Link.com the better the job matches become.\n\nUpload your resume!\nUploading your resume is the easiest and fastest way to start getting Job Recommendations.\n\nFind a job and apply!\nIf you don’t have an account and wish to stay “anonymous,” you need to apply to at least one position before we can recommend any jobs to you. If you have applied before then you can try to log in again and get your recommendations.\n\nNew users?\nVisit our website http://www.Job-Link.com today and register with us.</div>", "star": false}, {"type": "question", "num": 160, "title": "Job-Link 履歷配對服務", "sentence": "The word “anonymous” in paragraph 3 line 1 is closest in meaning to", "options": ["annoyed", "open", "incognito", "clever"], "answer": 2, "zh": "第三段第一行的 anonymous，意思最接近哪一個？", "rule": "前文 If you don’t have an account and wish to stay anonymous 表不公開帳號身份。", "explanation": "C 在語意上最貼近 anonymous。", "vocab": ["anonymous (adj. 匿名的；remain anonymous；The writer remained anonymous.)", "incognito (adj./adv. 隱姓埋名；travel incognito；The actor traveled incognito.)"], "article": "<div class=\"slide-article\" lang=\"en\">Make your job search easier.\nGet Job Recommendations from Job-Link!\n\nOur job matching tool targets jobs that match keywords in your resume, the jobs you view and ultimately the jobs you apply for. The more you use Job-Link.com the better the job matches become.\n\nUpload your resume!\nUploading your resume is the easiest and fastest way to start getting Job Recommendations.\n\nFind a job and apply!\nIf you don’t have an account and wish to stay “anonymous,” you need to apply to at least one position before we can recommend any jobs to you. If you have applied before then you can try to log in again and get your recommendations.\n\nNew users?\nVisit our website http://www.Job-Link.com today and register with us.</div>", "star": false}, {"type": "question", "num": 161, "title": "Job-Link 履歷配對服務", "sentence": "What should users do if they want to get Job recommendations?", "options": ["Upload their resumes", "Download application forms from the website", "Send an e-mail to Job-Link", "Apply for a position"], "answer": 0, "zh": "使用者如果想取得工作推薦，應該怎麼做？", "rule": "「Upload your resume!」下句稱這是開始得到 Job Recommendations 最容易、最快的方式；D 只限無帳號且想匿名的用戶。", "explanation": "A 是普遍、直接推薦的做法。", "vocab": ["recommendation (n. 推薦；job recommendations；The site gives job recommendations.)", "upload (v. 上傳；upload a resume；Upload your resume first.)"], "article": "<div class=\"slide-article\" lang=\"en\">Make your job search easier.\nGet Job Recommendations from Job-Link!\n\nOur job matching tool targets jobs that match keywords in your resume, the jobs you view and ultimately the jobs you apply for. The more you use Job-Link.com the better the job matches become.\n\nUpload your resume!\nUploading your resume is the easiest and fastest way to start getting Job Recommendations.\n\nFind a job and apply!\nIf you don’t have an account and wish to stay “anonymous,” you need to apply to at least one position before we can recommend any jobs to you. If you have applied before then you can try to log in again and get your recommendations.\n\nNew users?\nVisit our website http://www.Job-Link.com today and register with us.</div>", "star": true}, {"type": "focus", "title": "Language Focus｜Online Job Search", "subtitle": "Questions 159–161 · Vocabulary, Collocations & Patterns", "content": "<div class=\"focus-grid\"><div class=\"focus-card\"><div class=\"focus-word\">resume<span class=\"focus-pos\">noun</span></div><div class=\"focus-zh\">履歷</div><div class=\"focus-collocation\">upload a resume</div><div class=\"focus-example\">Please upload your resume before you apply.</div></div><div class=\"focus-card\"><div class=\"focus-word\">matching<span class=\"focus-pos\">adjective</span></div><div class=\"focus-zh\">配對的</div><div class=\"focus-collocation\">a job matching tool</div><div class=\"focus-example\">The matching tool finds jobs for you.</div></div><div class=\"focus-card\"><div class=\"focus-word\">anonymous<span class=\"focus-pos\">adjective</span></div><div class=\"focus-zh\">匿名的</div><div class=\"focus-collocation\">stay anonymous</div><div class=\"focus-example\">Some users prefer to stay anonymous.</div></div><div class=\"focus-card\"><div class=\"focus-word\">recommendation<span class=\"focus-pos\">noun</span></div><div class=\"focus-zh\">推薦</div><div class=\"focus-collocation\">job recommendations</div><div class=\"focus-example\">The site sends job recommendations every day.</div></div><div class=\"focus-card\"><div class=\"focus-word\">apply for<span class=\"focus-pos\">phrasal verb</span></div><div class=\"focus-zh\">應徵；申請</div><div class=\"focus-collocation\">apply for a position</div><div class=\"focus-example\">She applied for a position at a bank.</div></div><div class=\"focus-card\"><div class=\"focus-word\">register<span class=\"focus-pos\">verb</span></div><div class=\"focus-zh\">註冊</div><div class=\"focus-collocation\">register with a website</div><div class=\"focus-example\">Register with us to save your searches.</div></div></div><div class=\"pattern-strip\"><div class=\"pattern-item\"><div class=\"pattern-formula\">The more ..., the better ...</div><div class=\"pattern-note\">越……就越……</div><div class=\"pattern-example\">The more you practice, the better you speak.</div></div><div class=\"pattern-item\"><div class=\"pattern-formula\">apply to / for a position</div><div class=\"pattern-note\">應徵職位</div><div class=\"pattern-example\">He applied to three companies last week.</div></div></div>"}, {"type": "practice", "title": "Quick Practice｜Job Search Language", "subtitle": "Questions 159–161 · Complete each new sentence", "items": [["Please ___ your resume before you apply.", "upload", "upload a resume", "應徵前請先上傳你的履歷。"], ["The more you read, the ___ your English becomes.", "better", "The more ..., the better ...", "你讀得越多，英文就會越好。"], ["The writer wanted to stay ___, so she used a different name.", "anonymous", "stay anonymous", "這位作者想保持匿名，所以用了另一個名字。"], ["He has applied ___ five positions this month.", "for", "apply for a position", "他這個月已經應徵了五個職位。"]]}, {"type": "passage", "title": "Secret Garden Condominium Complex", "subtitle": "Questions 162–164", "content": "<div class=\"slide-article\" lang=\"en\">Secret Garden Condominium Complex\n\nLess than a half hour by train to the Square, Secret Garden is known for its architecture. – [1] – It is short on condos, but long on single-family houses ranging from the mundane to the magnificent. Secret Garden is a neighborhood with yards large enough to play catch and with neighbors friendly enough to join you.\n\nUpside\nSecret Garden truly is a village within the city, as its promoters say. It’s wrapped by a forest preserve, golf courses, and a country club. Side streets are quiet and tree-lined. – [2] –\n\nDownside\nIf you want a convenience store on every corner and an array of nightclubs, Secret Garden isn’t for you. – [3] – Though the west side of Secret Garden is dotted with pubs, the neighborhood’s east side is dry. This is primarily a residential neighborhood, which means single people might find other Madison neighborhoods more vibrant. – [4] –</div><div class=\"article-translation zh-target\"><div class=\"article-translation-title\">完整中文翻譯</div><p>Secret Garden 公寓住宅區</p><p>Secret Garden 搭火車到廣場不到半小時，以建築風格聞名。</p><p>這裡公寓不多，獨棟住宅卻很多，從平凡到氣派的房子都有。</p><p>Secret Garden 是一個庭院大到可以玩傳接球、鄰居友善到會加入你一起玩的社區。</p><p>優點</p><p>正如推廣者所說，Secret Garden 真的是城市裡的村莊。</p><p>它被森林保護區、高爾夫球場和鄉村俱樂部環繞。</p><p>巷道安靜，兩旁綠樹成蔭。</p><p>缺點</p><p>如果你希望每個街角都有便利商店，還有各式各樣的夜店，Secret Garden 並不適合你。</p><p>雖然 Secret Garden 西側散布著一些酒吧，社區東側卻沒有賣酒的地方。</p><p>這裡主要是住宅區，因此單身人士可能會覺得 Madison 的其他社區更熱鬧。</p></div>"}, {"type": "question", "num": 162, "title": "Secret Garden Condominium Complex", "sentence": "What is the main purpose of this article?", "options": ["To invite customers to visit a garden", "To inform colleagues not to reveal a secret", "To introduce an apartment complex", "To follow up on an order"], "answer": 2, "zh": "這篇文章的主要目的是什麼？", "rule": "標題 Secret Garden Condominium Complex；正文分位置、住宅特色、優缺點。", "explanation": "C 最能涵蓋地理、住房與優缺點描述。", "vocab": ["complex (n. 建築群；condominium complex；They live in a condominium complex.)", "neighborhood (n. 社區；quiet neighborhood；It is a quiet neighborhood.)"], "article": "<div class=\"slide-article\" lang=\"en\">Secret Garden Condominium Complex\n\nLess than a half hour by train to the Square, Secret Garden is known for its architecture. – [1] – It is short on condos, but long on single-family houses ranging from the mundane to the magnificent. Secret Garden is a neighborhood with yards large enough to play catch and with neighbors friendly enough to join you.\n\nUpside\nSecret Garden truly is a village within the city, as its promoters say. It’s wrapped by a forest preserve, golf courses, and a country club. Side streets are quiet and tree-lined. – [2] –\n\nDownside\nIf you want a convenience store on every corner and an array of nightclubs, Secret Garden isn’t for you. – [3] – Though the west side of Secret Garden is dotted with pubs, the neighborhood’s east side is dry. This is primarily a residential neighborhood, which means single people might find other Madison neighborhoods more vibrant. – [4] –</div>", "star": false}, {"type": "question", "num": 163, "title": "Secret Garden Condominium Complex", "sentence": "What is an upside of Secret Garden?", "options": ["It truly is a quiet place to live in.", "It is close to shopping malls.", "It is right next to the main station.", "It has a large swimming pool."], "answer": 0, "zh": "Secret Garden 的優點之一是什麼？", "rule": "Upside 段落 Side streets are quiet and tree-lined 是明文。", "explanation": "A 是 Side streets are quiet 的合理概括。", "vocab": ["quiet (adj. 安靜的；quiet streets；The streets are quiet.)", "tree-lined (adj. 兩旁有樹的；tree-lined street；We walked along a tree-lined street.)"], "article": "<div class=\"slide-article\" lang=\"en\">Secret Garden Condominium Complex\n\nLess than a half hour by train to the Square, Secret Garden is known for its architecture. – [1] – It is short on condos, but long on single-family houses ranging from the mundane to the magnificent. Secret Garden is a neighborhood with yards large enough to play catch and with neighbors friendly enough to join you.\n\nUpside\nSecret Garden truly is a village within the city, as its promoters say. It’s wrapped by a forest preserve, golf courses, and a country club. Side streets are quiet and tree-lined. – [2] –\n\nDownside\nIf you want a convenience store on every corner and an array of nightclubs, Secret Garden isn’t for you. – [3] – Though the west side of Secret Garden is dotted with pubs, the neighborhood’s east side is dry. This is primarily a residential neighborhood, which means single people might find other Madison neighborhoods more vibrant. – [4] –</div>", "star": false}, {"type": "question", "num": 164, "title": "Secret Garden Condominium Complex", "sentence": "In which of the positions marked [1], [2], [3], and [4] does Questions 168–171", "content": "<div class=\"slide-article\" lang=\"en\">Student Expo 2019\n\nJuly 2nd – July 5th\n10:00 a.m. – 5:00 p.m.\nThe Green Hotel, Spring County\n\n“The Student Expo” is Spring County’s largest exhibition that is specifically designed to provide both current and prospective students with the necessary tools to succeed in tertiary education and beyond.\n\n“The Student Expo” has evolved to encompass a breadth of information to facilitate a successful, fulfilling and stress-free student experience, including Advanced Education, Transportation, Accommodation, Finance, and Gadgets.\n\nTickets are USD$20 each, and available from http://www.student-expo.com\n\nPlease e-mail info@student-expo.com, should you have any further queries.</div><div class=\"article-translation zh-target\"><div class=\"article-translation-title\">完整中文翻譯</div><p>2019 學生博覽會</p><p>7 月 2 日至 7 月 5 日，上午 10 點至下午 5 點，Spring County 的 The Green Hotel</p><p>「學生博覽會」是 Spring County 規模最大的展覽，專為在學學生與未來的學生設計，提供他們在大專教育及往後取得成功所需的工具。</p><p>「學生博覽會」已逐步擴大，涵蓋廣泛的資訊，幫助學生擁有成功、充實且沒有壓力的求學經驗，內容包括進修教育、交通、住宿、財務與電子產品。</p><p>門票每張 20 美元，可在 http://www.student-expo.com 購買。</p><p>如有任何其他疑問，請寄電子郵件至 info@student-expo.com。</p></div>"}, {"type": "question", "num": 168, "title": "Student Expo 2019", "sentence": "How many days will this event last?", "options": ["Two days", "Three days", "Four days", "Five days"], "answer": 2, "zh": "這場活動會持續幾天？", "rule": "含首尾日期", "explanation": "July 2nd – July 5th 列出 2、3、4、5 四個曆日。", "vocab": ["last（v. 持續；last four days；The expo lasts four days.）"], "article": "<div class=\"slide-article\" lang=\"en\">Student Expo 2019\n\nJuly 2nd – July 5th\n10:00 a.m. – 5:00 p.m.\nThe Green Hotel, Spring County\n\n“The Student Expo” is Spring County’s largest exhibition that is specifically designed to provide both current and prospective students with the necessary tools to succeed in tertiary education and beyond.\n\n“The Student Expo” has evolved to encompass a breadth of information to facilita ss-free 排除其他。", "vocab": ["exhibition（n. 展覽；largest exhibition；The expo is a large exhibition.）"], "article": "<div class=\"slide-article\" lang=\"en\">Student Expo 2019\n\nJuly 2nd – July 5th\n10:00 a.m. – 5:00 p.m.\nThe Green Hotel, Spring County\n\n“The Student Expo” is Spring County’s largest exhibition that is specifically designed to provide both current and prospective students with the necessary tools to succeed in tertiary education and beyond.\n\n“The Student Expo” has evolved to encompass a breadth of information to facilitate a successful, fulfilling and stress-free student experience, including Advanced Education, Transportation, Accommodation, Finance, and Gadgets.\n\nTickets are USD$20 each, and available from http://www.student-expo.com\n\nPlease e-mail info@student-expo.com, should you have any further queries.</div>", "star": true}, {"type": "question", "num": 171, "title": "Student Expo 2019", "sentence": "What should students do if they have other questions?", "options": ["Call the customer service department", "Find the information booth", "Contact the event organizer by e-mail", "Write to the dean"], "answer": 2, "zh": "學生如果有其他問題，應該怎麼做？", "rule": "行動資訊定位", "explanation": "Please e-mail info@student-expo.com, should you have any further queries.", "vocab": ["query（n. 詢問；further queries；Send us your queries by email.）"], "article": "<div class=\"slide-article\" lang=\"en\">Student Expo 2019\n\nJuly 2nd – July 5th\n10:00 a.m. – 5:00 p.m.\nThe Green Hotel, Spring County\n\n“The Student Expo” is Spring County’s largest exhibition that is specifically designed to provide both current and prospective students with the necessary tools to succeed in tertiary education and beyond.\n\n“The Student Expo” has evolved to encompass a breadth of information to facilitate a successful, fulfilling and stress-free student experience, including Advanced Education, Transportation, Accommodation, Finance, and Gadgets.\n\nTickets are USD$20 each, and available from http://www.student-expo.com\n\nPlease e-mail info@student-expo.com, should you have any further queries.</div>", "star": false}, {"type": "focus", "title": "Language Focus｜Student Expo", "subtitle": "Questions 168–171 · Vocabulary, Collocations & Patterns", "content": "<div class=\"focus-grid\"><div class=\"focus-card\"><div class=\"focus-word\">exhibition<span class=\"focus-pos\">noun</span></div><div class=\"focus-zh\">展覽</div><div class=\"focus-collocation\">the largest exhibition</div><div class=\"focus-example\">The exhibition lasts four days.</div></div><div class=\"focus-card\"><div class=\"focus-word\">prospective<span class=\"focus-pos\">adjective</span></div><div class=\"focus-zh\">未來可能的</div><div class=\"focus-collocation\">prospective students</div><div class=\"focus-example\">Prospective students can visit the campus.</div></div><div class=\"focus-card\"><div class=\"focus-word\">tertiary<span class=\"focus-pos\">adjective</span></div><div class=\"focus-zh\">大專的；第三級的</div><div class=\"focus-collocation\">tertiary education</div><div class=\"focus-example\">She plans to enter tertiary education.</div></div><div class=\"focus-card\"><div class=\"focus-word\">accommodation<span class=\"focus-pos\">noun</span></div><div class=\"focus-zh\">住宿</div><div class=\"focus-collocation\">student accommodation</div><div class=\"focus-example\">The school helps students find accommodation.</div></div><div class=\"focus-card\"><div class=\"focus-word\">facilitate<span class=\"focus-pos\">verb</span></div><div class=\"focus-zh\">促進；使便利</div><div class=\"focus-collocation\">facilitate learning</div><div class=\"focus-example\">Clear signs facilitate the visit.</div></div><div class=\"focus-card\"><div class=\"focus-word\">query<span class=\"focus-pos\">noun</span></div><div class=\"focus-zh\">疑問</div><div class=\"focus-collocation\">further queries</div><div class=\"focus-example\">Please email us with any queries.</div></div></div><div class=\"pattern-strip\"><div class=\"pattern-item\"><div class=\"pattern-formula\">Should you have + N, ...</div><div class=\"pattern-note\">正式倒裝，等於 If you have + N</div><div class=\"pattern-example\">Should you have any questions, please call us.</div></div><div class=\"pattern-item\"><div class=\"pattern-formula\">provide A with B</div><div class=\"pattern-note\">提供 B 給 A</div><div class=\"pattern-example\">The expo provides students with useful tools.</div></div></div>"}, {"type": "practice", "title": "Quick Practice｜Expo Language", "subtitle": "Questions 168–171 · Complete each new sentence", "items": [["___ you have any questions, please call us.", "Should", "Should you have ...", "如果您有任何問題，請來電。"], ["The fair provides visitors ___ free maps.", "with", "provide A with B", "博覽會提供參觀者免費地圖。"], ["She plans to enter ___ education after high school.", "tertiary", "tertiary education", "她打算高中畢業後接受大專教育。"], ["The school helps students find ___ near campus.", "accommodation", "student accommodation", "學校協助學生在校園附近找住宿。"]]}, {"type": "passage", "title": "Wanted: Software Support Manager", "subtitle": "Questions 172–175", "content": "<div class=\"slide-article\" lang=\"en\">Wanted: Software Support Manager\n\nJob ID:          0572695\nJob type:        Full-time Regular\nWork city/country: Shanghai / China\nPosted:          May 14th, 2019\nJob area:        Consulting and Services\n\nJob description\nThis role assists clients in the selection, implementation, and production support of application packaged solutions. – [1] – They use in-depth consulting skills, business knowledge, and packaged solution expertise to effectively integrate packaged technology into the clients’ business environment in order to achieve client expected business results.\n\nRequirement\n✓ Bachelor’s Degree – [2] –\n✓ At least 3-year experience in software support\n✓ English: fluent\n✓ Japanese: intermediate\n✓ Must be able to run workshops\n✓ A self-starter and self-motivated individual\n✓ Good communication skills\n✓ Collaborative attitude, strong team player\n✓ Ability to work in complex multi-national and multi-language projects\n\nAdvanced Software Corp. is committed to creating a diverse environment and is proud to be an equal opportunity employer. – [3] – All qualified applicants will receive consideration for employment without regard to race, color, religion, gender, or age. – [4] –</div><div class=\"article-translation zh-target\"><div class=\"article-translation-title\">完整中文翻譯</div><p>徵才：軟體支援經理</p><p>職缺編號：0572695／工作類型：全職正式員工／工作地點：中國上海／刊登日期：2019 年 5 月 14 日／職務領域：顧問與服務</p><p>這個職位協助客戶選擇及導入套裝應用軟體方案，並提供上線後的支援。</p><p>擔任此職者運用深入的顧問技巧、商業知識與套裝方案專業，把套裝技術有效整合進客戶的業務環境，以達成客戶期望的業務成果。</p><p>條件：學士學位／至少三年軟體支援經驗／英文流利／日文中級</p><p>必須能主持工作坊／主動積極、自我驅動／良好的溝通能力／樂於合作、具團隊精神／能參與複雜的跨國、多語言專案</p><p>Advanced Software Corp. 致力打造多元的工作環境，並以身為平等就業機會雇主為榮。</p><p>所有符合資格的應徵者都會獲得錄用考量，不論種族、膚色、宗教、性別或年齡。</p></div>"}, {"type": "question", "num": 172, "title": "Software Support Manager 徵才", "sentence": "What is the purpose of this advertisement?", "options": ["To announce a community meeting", "To promote a new company", "To advertise a new service", "To recruit a support manager"], "answer": 3, "zh": "這則廣告的目的是什麼？", "rule": "目的題", "explanation": "標題 Wanted: Software Support Manager；隨後列職責與徵才條件。", "vocab": ["recruit（v. 招募；recruit a manager；The company recruits a manager.）"], "article": "<div class=\"slide-article\" lang=\"en\">Wanted: Software Support Manager\n\nJob ID:          0572695\nJob type:        Full-time Regular\nWork city/country: Shanghai / China\nPosted:          May 14th, 2019\nJob area:        Consulting and Services\n\nJob description\nThis role assists clients in the selection, implementation, and production support of application packaged solutions. – [1] – They use in-depth consulting skills, business knowledge, and packaged solution expertise to effectively integrate packaged technology into the clients’ business environment in order to achieve client expected business results.\n\nRequirement\n✓ Bachelor’s Degree – [2] –\n✓ At least 3-year experience in software support\n✓ English: fluent\n✓ Japanese: intermediate\n✓ Must be able to run workshops\n✓ A self-starter and self-motivated individual\n✓ Good communication skills\n✓ Collaborative attitude, strong team player\n✓ Ability to work in complex multi-national and multi-language projects\n\nAdvanced Software Corp. is committed to creating a diverse environment and is proud to be an equal opportunity employer. – [3] – All qualified applicants will receive consideration for employment without regard to race, color, religion, gender, or age. – [4] –</div>", "star": false}, {"type": "question", "num": 173, "title": "Software Support Manager 徵才", "sentence": "The word “integrate” in paragraph 2 line 3, is closest in meaning to", "options": ["achieve", "present", "manage", "consolidate"], "answer": 3, "zh": "第二段第三行的 integrate，意思最接近哪一個？", "rule": "語境字義", "explanation": "integrate packaged technology into the clients’ business environment 是把技術融入業務環境；consolidate 最接近合併／整合。", "vocab": ["integrate（v. 整合；integrate A into B；Integrate the tool into the workflow.）"], "article": "<div class=\"slide-article\" lang=\"en\">Wanted: Software Support Manager\n\nJob ID:          0572695\nJob type:        Full-time Regular\nWork city/country: Shanghai / China\nPosted:          May 14th, 2019\nJob area:        Consulting and Services\n\nJob description\nThis role assists clients in the selection, implementation, and production support of application packaged solutions. – [1] – They use in-depth consulting skills, business knowledge, and packaged solution expertise to effectively integrate packaged technology into the clients’ business environment in order to achieve client expected business results.\n\nRequirement\n✓ Bachelor’s Degree – [2] –\n✓ At least 3-year experience in software support\n✓ English: fluent\n✓ Japanese: intermediate\n✓ Must be able to run workshops\n✓ A self-starter and self-motivated individual\n✓ Good communication skills\n✓ Collab igion, gender, or age. – [4] –</div>", "star": true}, {"type": "focus", "title": "Language Focus｜Job Advertisement", "subtitle": "Questions 172–175 · Vocabulary, Collocations & Patterns", "content": "<div class=\"focus-grid\"><div class=\"focus-card\"><div class=\"focus-word\">assist<span class=\"focus-pos\">verb</span></div><div class=\"focus-zh\">協助</div><div class=\"focus-collocation\">assist clients in + N</div><div class=\"focus-example\">We assist clients in choosing software.</div></div><div class=\"focus-card\"><div class=\"focus-word\">implementation<span class=\"focus-pos\">noun</span></div><div class=\"focus-zh\">導入；實施</div><div class=\"focus-collocation\">system implementation</div><div class=\"focus-example\">The implementation took six months.</div></div><div class=\"focus-card\"><div class=\"focus-word\">integrate<span class=\"focus-pos\">verb</span></div><div class=\"focus-zh\">整合</div><div class=\"focus-collocation\">integrate A into B</div><div class=\"focus-example\">They integrated the app into their system.</div></div><div class=\"focus-card\"><div class=\"focus-word\">expertise<span class=\"focus-pos\">noun</span></div><div class=\"focus-zh\">專業知識</div><div class=\"focus-collocation\">expertise in software</div><div class=\"focus-example\">She has expertise in data analysis.</div></div><div class=\"focus-card\"><div class=\"focus-word\">self-starter<span class=\"focus-pos\">noun</span></div><div class=\"focus-zh\">主動積極的人</div><div class=\"focus-collocation\">a self-starter</div><div class=\"focus-example\">The job needs a self-starter.</div></div><div class=\"focus-card\"><div class=\"focus-word\">qualified<span class=\"focus-pos\">adjective</span></div><div class=\"focus-zh\">符合資格的</div><div class=\"focus-collocation\">qualified applicants</div><div class=\"focus-example\">All qualified applicants will be contacted.</div></div></div><div class=\"pattern-strip\"><div class=\"pattern-item\"><div class=\"pattern-formula\">assist + 人 + in + N / V-ing</div><div class=\"pattern-note\">協助某人做……</div><div class=\"pattern-example\">Our staff assist customers in finding the right plan.</div></div><div class=\"pattern-item\"><div class=\"pattern-formula\">without regard to + N</div><div class=\"pattern-note\">不論……；不考慮……</div><div class=\"pattern-example\">Everyone is welcome without regard to age.</div></div></div>"}, {"type": "practice", "title": "Quick Practice｜Job Ad Language", "subtitle": "Questions 172–175 · Complete each new sentence", "items": [["Our staff will assist you ___ choosing the right plan.", "in", "assist + 人 + in", "我們的員工會協助您選擇合適的方案。"], ["We plan to integrate the new app ___ our system.", "into", "integrate A into B", "我們打算把新的 app 整合進系統。"], ["We need someone with ___ in data analysis.", "expertise", "expertise in", "我們需要具備資料分析專業的人。"], ["All applicants are welcome, without ___ to age.", "regard", "without regard to", "歡迎所有應徵者，不論年齡。"]]}, {"type": "passage", "title": "Jack Waterman’s Resignation and Ellen Billy’s Reply", "subtitle": "Questions 176–180", "content": "<div class=\"article-name\">Document 1</div><div class=\"slide-article\" lang=\"en\">Dear Ms. Billy,\n\nI would like to inform you that I am resigning from my position as Marketing Specialist for Good Consulting Inc., effective July 1st, 2019.\n\nIt is my pleasure working in your company and I enjoy working with talented colleagues around me but things wouldn’t work out the way I want it to be. That is why I’m leaving my post because of my personal reasons.\n\nThank you for the opportunity for my personal advances as well as the knowledge that you provided me during the last two years. Please let me know if I can do anything to make the transition as smooth as possible.\n\nSincerely,\nJack Waterman</div><div class=\"article-name\">Document 2</div><div class=\"slide-article\" lang=\"en\">From: Ellen Billy\nTo: Jack Waterman &lt;Jack-w@gmail.com&gt;\nDate: June 22nd, 2019\nSubject: Job appreciation letter\n\nDear Jack,\n\nYour enthusiasm and your ability to motivate others have resulted in a significant increase in the company’s productivity and profitability.\n\nOur company appreciates your efforts and the assistance you offer to your co-workers. You have earned the respect of both your superiors and your peers. Please accept my sincerest gratitude for your superior work in the service department.\n\nSincerely,\nEllen Billy</div><div class=\"article-translation zh-target\"><div class=\"article-translation-title\">完整中文翻譯</div><p>親愛的 Billy 女士：</p><p>我想通知您，我將辭去 Good Consulting Inc. 行銷專員一職，自 2019 年 7 月 1 日起生效。</p><p>能在貴公司工作是我的榮幸，我也很喜歡和身邊優秀的同事共事，但事情無法照我希望的方式發展。</p><p>因此，我基於個人因素離開這個職位。</p><p>感謝您在過去兩年給我個人成長的機會，以及您提供給我的知識。</p><p>如果有任何我能做的事，可以讓交接盡量順利，請告訴我。</p><p>謹上，Jack Waterman</p><p>寄件人：Ellen Billy／收件人：Jack Waterman／日期：2019 年 6 月 22 日／主旨：工作感謝信</p><p>親愛的 Jack：</p><p>你的熱忱和激勵他人的能力，使公司的生產力與獲利能力大幅提升。</p><p>公司感謝你的努力，以及你給同事的協助。</p><p>你贏得了上司與同儕的尊重。</p><p>對於你在服務部門的卓越表現，請接受我最誠摯的感謝。</p><p>謹上，Ellen Billy</p></div>"}, {"type": "question", "num": 176, "title": "Jack 離職信與 Ellen 回信", "sentence": "What is Jack Waterman’s current position?", "options": ["Event coordinator", "Marketing manager", "Sales manager", "Marketing specialist"], "answer": 3, "zh": "Jack Waterman 目前的職位是什麼？", "rule": "職稱原句", "explanation": "Jack 第一封明寫 my position as Marketing Specialist；不要把 specialist 升成 manager。", "vocab": ["specialist（n. 專員；marketing specialist；Jack is a marketing specialist.）"], "article": "<div class=\"article-name\">Document 1</div><div class=\"slide-article\" lang=\"en\">Dear Ms. Billy,\n\nI would like to inform you that I am resigning from my position as Marketing Specialist for Good Consulting Inc., effective July 1st, 2019.\n\nIt is my pleasure working in your company and I enjoy working with talented colleagues around me but things wouldn’t work out the way I want it to be. That is why I’m leaving my post because of my personal reasons.\n\nThank you for the opportunity for my personal advances as well as the knowledge that you   el.innerHTML='<div class="q-header"><span class="q-num">Q'+s.num+'</span>'+(s.star?'<span class="q-star">⭐ 重點題</span>':'')+'</div><div class="q-sentence" lang="en">'+esc(s.sentence)+'</div><div class="q-zh zh-target">'+esc(s.zh)+'</div><details class="article-toggle"><summary>查看文章</summary>'+s.article+'</details><div class="q-opts">'+opts+'</div><div class="key-reveal" id="key-reveal"><div class="answer-line">答案 '+String.fromCharCode(65+s.answer)+'：'+esc(s.options[s.answer])+'</div><div class="explain-line">'+esc(s.explanation)+'</div></div>';
 }else if(s.type==='practice'){
  el.innerHTML='<div class="slide-label">Lesson 14.5 · Practice</div><div class="slide-title">'+esc(s.title)+'</div><div class="slide-sub">'+esc(s.subtitle)+'</div><div class="practice-list">'+s.items.map((it,i)=>'<div class="practice-item"><span class="practice-no">'+(i+1)+'</span><div class="practice-main"><div class="practice-prompt">'+esc(it[0]).replaceAll('___','<span class="practice-blank">_____</span>')+'</div><div class="practice-zh zh-target">'+esc(it[3])+'</div></div><div class="practice-answer" id="practice-answer-'+i+'">'+esc(it[1])+'<span class="practice-note">'+esc(it[2])+'</span></div></div>').join('')+'</div>';
 }else{
  el.innerHTML=(s.type==='passage'?'':'<div class="slide-label">Lesson 14.5 · Mode A</div>')+'<div class="slide-title'+(s.type==='passage'?' passage-title':'')+'">'+esc(s.title)+'</div><div class="slide-sub">'+esc(s.subtitle)+'</div>'+s.content;
 }
 applyZh();
 const rb=document.getElementById('reveal-btn');
 rb.textContent=s.type==='practice'?'逐題揭曉（0 / '+s.items.length+'）':'揭曉答案 ▼';
 document.getElementById('slide-area').scrollTop=0;
};
reveal=function(){
 const s=slides[current];
 if(s.type==='practice'){
  if(l145PracticeStep<s.items.length){document.getElementById('practice-answer-'+l145PracticeStep).classList.add('show');l145PracticeStep++;document.getElementById('reveal-btn').textContent=l145PracticeStep<s.items.length?'逐題揭曉（'+l145PracticeStep+' / '+s.items.length+'）':'全部已揭曉｜按一下收回'}
  else{document.querySelectorAll('.practice-answer').forEach(x=>x.classList.remove('show'));l145PracticeStep=0;document.getElementById('reveal-btn').textContent='逐題揭曉（0 / '+s.items.length+'）'}
  return;
 }
 if(s.type!=='question')return;
 revealed=!revealed;s.options.forEach((_,i)=>{const node=document.getElementById('opt-'+i);node.classList.toggle('correct',revealed&&i===s.answer);node.classList.toggle('dimmed',revealed&&i!==s.answer)});document.getElementById('key-reveal').classList.toggle('show',revealed);document.getElementById('reveal-btn').textContent=revealed?'隱藏答案 ▲':'揭曉答案 ▼';
};
navigate=function(dir){current=Math.max(0,Math.min(l145Total-1,current+dir));render()};
jumpTo=function(value){current=Number(value);render()};
jump.innerHTML='';
slides.forEach((s,i)=>{const opt=document.createElement('option');opt.value=i;opt.textContent=s.type==='question'?'Q'+s.num:s.type==='passage'?s.subtitle:s.type==='focus'?'Language Focus · '+s.subtitle.split(' · ')[0]:s.type==='practice'?'Quick Practice · '+s.subtitle.split(' · ')[0]:s.type==='summary'?'答案速查':'導入 '+(i+1);jump.appendChild(opt)});
current=0;render();

</script>
