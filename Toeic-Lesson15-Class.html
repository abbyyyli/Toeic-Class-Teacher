<script>const slides=[{"type":"overview","title":"Lesson 15｜閱讀 181–200","subtitle":"Mode A · 多益試題 · 20 題","content":"\u003cdiv class=\"hero-grid\"\u003e\u003cdiv class=\"hero-card\"\u003e\u003cb\u003e20\u003c/b\u003e\u003cspan\u003e題依原題號\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"hero-card\"\u003e\u003cb\u003e4\u003c/b\u003e\u003cspan\u003e組完整文章\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"hero-card\"\u003e\u003cb\u003ePart 7\u003c/b\u003e\u003cspan\u003e先讀文章，再做題\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"g-formula\"\u003e作答流程：先判文章類型 → 讀題幹 → 回原文找證據 → 排除干擾選項\u003c/div\u003e\u003cdiv class=\"g-note\"\u003e按左右方向鍵換頁；按 Z 顯示／隱藏中文；空白鍵揭曉／收回答案。題目頁也可以展開「查看完整文章」。\u003c/div\u003e"},{"type":"overview","title":"閱讀時先畫四格","subtitle":"文章、人物、時間、證據","content":"\u003cdiv class=\"step-grid\"\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e1\u003c/b\u003e\u003cspan\u003e認出文體及讀者\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e2\u003c/b\u003e\u003cspan\u003e圈出問題的限制\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e3\u003c/b\u003e\u003cspan\u003e回文章定位句子\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"step\"\u003e\u003cb\u003e4\u003c/b\u003e\u003cspan\u003e逐項排除人名、時間與範圍錯置\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e"},{"type":"passage","title":"Restaurant Tasty and a Customer Review","subtitle":"Questions 181–185","content":"\u003cdiv class=\"article-name\"\u003eDocument 1\u003c/div\u003e\u003cdiv class=\"slide-article\" lang=\"en\"\u003eTasty is a fabulously stylish restaurant. Tasty combines a fascinating location with an elaborate restaurant and hotel concept all in the center of Garden City. The restaurant Tasty is stunningly designed with exposed brickwork, low arched ceilings and modern furnishings offering a cozy yet spacious feel. There is also a leafy inner courtyard providing a tranquil setting for al fresco dining. The menu at restaurant Tasty is both innovative and interesting combining Asian and European elements to create a totally new culinary experience. Favorites include grilled lobster, beef steak and chicken. The sushi counter is currently proving to be one of the highlights of restaurant Tasty and foodies in Garden City are flocking here. The set menus for business lunches are a steal at just 8 USD from Monday to Friday where 3 courses of amazing cuisine can be enjoyed. The wine list deserves a mention if not for the huge selection of champagnes available.\u003c/div\u003e\u003cdiv class=\"article-name\"\u003eDocument 2\u003c/div\u003e\u003cdiv class=\"slide-article\" lang=\"en\"\u003eRestaurant Tasty Review: “Good food, not very friendly staff”\n\nReviewed on August 3rd, 2019, by Paul Fidelity\n\nWhen we arrived, we waited at the entrance, 10 minutes maybe. It wasn’t obvious if we could just sit or whether we had to be seated. A waitress just about acknowledged us and indicated we could sit anywhere. Our order was taken fairly promptly and we didn’t have to wait long for our drinks or food. We ordered three starters and the food was really good and the flavors were excellent. What let the place down was the service. The staff just didn’t come across in a very friendly way - for example, no one came to check if the food was ok. I don’t think we would return.\n\nVisited July 2019\nValue: Good\nAtmosphere: Excellent\nService: Fair\nFood: Excellent\u003c/div\u003e\u003cdiv class=\"q-zh zh-target\"\u003e餐廳介紹強調市中心時尚環境、舒適中庭、多元料理與週一至五 8 美元三道菜商務午餐；Paul 的評論則稱食物優秀，但員工不夠友善，到門口約等十分鐘，因此不想再訪。\u003c/div\u003e"},{"type":"question","num":181,"title":"Restaurant Tasty：介紹與顧客評價","sentence":"What does the first article suggest about the restaurant?","options":["It serves traditional Chinese food.","It is poorly decorated.","It really is a trendy restaurant.","It is located in a rural area."],"answer":2,"zh":"第一篇暗示它是一間時髦餐廳。","rule":"整篇特徵概括","explanation":"fabulously stylish、stunningly designed、modern furnishings 都指向 trendy。","vocab":["stylish（adj. 時尚的；stylish resta Service: Fair\nFood: Excellent\u003c/div\u003e","star":false},{"type":"passage","title":"York Tech’s 20th Anniversary Campaign","subtitle":"Questions 186–190","content":"\u003cdiv class=\"article-name\"\u003eDocument 1\u003c/div\u003e\u003cdiv class=\"slide-article\" lang=\"en\"\u003eDear Ms. Hudson,\n\nWe hope that you will join us in celebrating 20 years of York Tech\n\nTake an exciting trip through 20 years of York Tech History and discover interesting facts about the company, technologies, and products.\n\nWe want to sincerely express our thanks to customers like you for the successful working relationships we have enjoyed over the past 20 years. We would like to emphasize our thanks by making donations to the charitable organization Help Children’s Villages. We hope that you will take part in our anniversary campaign and leave a greeting for York Tech. When we receive your greeting through www.york-tech-20.com, we will donate an amount of USD$20 to the charity.\n\nWe look forward to a continuous good working relationship with you.\n\nSincerely,\nJack Ng\nYork Tech.\u003c/div\u003e\u003cdiv class=\"article-name\"\u003eDocument 2\u003c/div\u003e\u003cdiv class=\"slide-article\" lang=\"en\"\u003eYour greeting may contain a maximum of 50 characters. Name and Company are not mandatory fields, but of course we would especially enjoy seeing personal messages. After sending your entry, you will receive an e-mail with a verification link. When you click the link, your entry is posted and our donation is initiated.\n\nNote: Each guest may only participate once, but please feel free to let your colleagues know about this. Thank you very much!\n\nName: Nina Hudson\nCompany: Five-Star Network Inc.\nE-mail: ns@five-star.com\nCell phone: 837-4784-5837\nGreeting: Congratulations to you on this auspicious occasion!\u003c/div\u003e\u003cdiv class=\"article-name\"\u003eDocument 3\u003c/div\u003e\u003cdiv class=\"slide-article\" lang=\"en\"\u003eYork Tech. Celebrates 20th Year Anniversary\n\nYork City, New York – (Business World) – York Tech has reached an exciting milestone as the company celebrates 20 years of delivering innovative technology solutions to enterprise clients.\n\nJerry Bells, York Tech CEO, reflected on the company’s 20th anniversary by saying, “This has been the most exciting 20 years of my life. We started out with a philosophy of listening to our clients, delivering quality products and providing attentive customer service. I believe because of that – York Tech remains viable, strong and growing. A big thank you to the hundreds of valued customers and strategic partners.”\n\nLinda Smith, York Tech CFO, added, “York Tech has weathered troubling market cycles and unimaginable technological influences. Thanks to our leadership team and devoted employees, we’ve been able to grow and thrive. I’m proud to report that our business is solid and that we are looking forward to the next 20 years that lie ahead.”\n\nContact\nEva Kim, 458-838-9999\nevak@york-tech.com\nPR Manager\u003c/div\u003e\u003cdiv class=\"q-zh zh-target\"\u003eYork Tech 邀請客戶 Hudson 參加二十週年網站留言活動；每收到一則且經驗證的祝賀，公司捐二十美元給兒童慈善組織。表單顯示 Nina Hudson 的公司與祝賀文字；新聞稿由 CEO、CFO 分別談公司的穩健成長。\u003c/div\u003e"},{"type":"question","num":186,"title":"York Tech 二十週年：邀請、留言表與新聞","sentence":"What is true about York Tech?","options":["They donate USD$20 to the charity every year.","They want to recruit Ms. Hudson.","They are celebrating the 20th anniversary.","They are a not-for-profit organization."],"answer":2,"zh":"York Tech 正慶祝成立二十週年。","rule":"跨篇活動主題","explanation":"邀請信開頭 celebrating 20 years；新聞稿標題 20th Year Anniversary。","vocab":["anniversary（n. 週年；20th anniversary；York Tech celebrates its 20th anniversary.）"],"article":"\u003cdiv class=\"article-name\"\u003eDocument 1\u003c/div\u003e\u003cdiv class=\"slide-article\" lang=\"en\"\u003eDear Ms. Hudson,\n\nWe hope that you will join us in celebrating 20 years of York Tech\n\nTake an exciting trip through 20 years of York Tech History and  devoted employees, we’ve been able to grow and thrive. I’m proud to report that our business is solid and that we are looking forward to the next 20 years that lie ahead.”\n\nContact\nEva Kim, 458-838-9999\nevak@york-tech.com\nPR Manager\u003c/div\u003e","star":false},{"type":"passage","title":"Enterprise Data Management Solutions Conference","subtitle":"Questions 191–195","content":"\u003cdiv class=\"article-name\"\u003eDocument 1\u003c/div\u003e\u003cdiv class=\"slide-article\" lang=\"en\"\u003eMost businesses suffer from the headache of accomplishing multiple business processes and enterprise-wide content amid a tight schedule. Enterprises from various industries are looking for effective solutions to streamline and simplify a myriad of complex processes involving all types of users and documents.\n\nThe upcoming conference will introduce how Enterprise Data Management Solutions can unify users, documents and processes to drive business automation. Solutions with demonstrations will also be shared to bring profound insights on resolving issues of day-to-day business processes.\n\nEvent Details\nDate: 3 August 2019\nTime: 1:30 p.m.-4:30 p.m.\nVenue: Central Conference Centre (CCC), Rexford, CA\nFee: Complimentary only with e-mail confirmation\nAgenda: Attached\n\nTo register, please visit event website at http://www.edms.com or call 1-800-go-events.\u003c/div\u003e\u003cdiv class=\"article-name\"\u003eDocument 2\u003c/div\u003e\u003cdiv class=\"slide-article\" lang=\"en\"\u003eEnterprise Data Management Solutions Conference\nEvent Agenda\n\nTime | Topic | Speaker\n1:00 p.m. | Registration |\n1:30 p.m. | Welcome speech | Dr. Steven Flinders, Best Data Co.\n1:45 p.m. | Enterprise Data Management for Business Users\nGood Systems – a leading provider in Enterprise Data Management Solutions will introduce how technology can automatically transform any information entering your organization into useful and accessible data. | Ms. Jessie Kim, Good Systems\n2:30 p.m. | Ap function render(){let s=slides[current];revealed=false;document.getElementById('progress-text').textContent=(current+1)+' / '+TOTAL;document.getElementById('progress-bar').style.width=Math.round((current+1)/TOTAL*100)+'%';document.getElementById('prev-btn').disabled=current===0;document.getElementById('next-btn').disabled=current===TOTAL-1;document.getElementById('slide-jump').value=String(current);document.getElementById('slide-type-label').textContent=s.type==='question'?'閱讀練習題':s.type==='passage'?'文章先導':s.type==='summary'?'LESSON SUMMARY':'LESSON OVERVIEW';document.getElementById('reveal-btn').classList.toggle('hidden',s.type!=='question');let el=document.getElementById('slide-content');
if(s.type!=='question'){el.innerHTML=(s.type==='passage'?'':'<div class="slide-label">Lesson 15 · Mode A</div>')+'<div class="slide-title'+(s.type==='passage'?' passage-title':'')+'">'+esc(s.title)+'</div><div class="slide-sub">'+esc(s.subtitle)+'</div>'+s.content}
else{let opts=s.options.map((o,i)=>'<div class="q-opt" id="opt-'+i+'"><span class="q-opt-lbl">'+String.fromCharCode(65+i)+'</span>'+esc(o)+'</div>').join('');let vocab=s.vocab.map(v=>'<div class="vocab-row">'+esc(v)+'</div>').join('');el.innerHTML='<div class="q-header"><span class="q-num">Q'+s.num+'</span>'+(s.star?'<span class="q-star">⭐ 重點題</span>':'')+'</div><div class="q-sentence" lang="en">'+esc(s.sentence)+'</div><div class="q-zh zh-target">'+esc(s.zh)+'</div><details class="article-toggle"><summary>查看文章</summary>'+s.article+'</details><div class="q-opts">'+opts+'</div><div class="key-reveal" id="key-reveal"><div class="answer-line">答案 '+String.fromCharCode(65+s.answer)+'：'+esc(s.options[s.answer])+'</div><div class="explain-line">'+esc(s.explanation)+'</div>'+(vocab?'<details class="vocab-toggle"><summary>關鍵單字</summary>'+vocab+'</details>':'')+'</div>'}applyZh();document.getElementById('reveal-btn').textContent='揭曉答案 ▼';document.getElementById('slide-area').scrollTop=0}
function reveal(){let s=slides[current];if(s.type!=='question')return;revealed=!revealed;s.options.forEach((_,i)=>{let el=document.getElementById('opt-'+i);el.classList.toggle('correct',revealed&&i===s.answer);el.classList.toggle('dimmed',revealed&&i!==s.answer)});document.getElementById('key-reveal').classList.toggle('show',revealed);document.getElementById('reveal-btn').textContent=revealed?'隱藏答案 ▲':'揭曉答案 ▼'}
function navigate(dir){current=Math.max(0,Math.min(TOTAL-1,current+dir));render()}function jumpTo(value){current=Number(value);render()}
let jump=document.getElementById('slide-jump');slides.forEach((s,i)=>{let opt=document.createElement('option');opt.value=i;opt.textContent=s.type==='question'?'Q'+s.num:s.type==='passage'?s.subtitle:s.type==='summary'?'總結':'導入 '+(i+1);jump.appendChild(opt)});
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();navigate(1)}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();navigate(-1)}else if(e.key===' '||e.key==='Enter'){e.preventDefault();reveal()}else if(e.key.toLowerCase()==='z')toggleZh()});render();
</script></body></html>
