<style>

#slide-area{flex:1;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:28px 40px 16px}.slide{width:100%;max-width:940px;animation:fade .2s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.gram-label{font:700 11px Inter;letter-spacing:1.4px;color:var(--amber);margin-bottom:8px;text-transform:uppercase}.gram-title{font:900 29px Inter;margin-bottom:5px}.gram-sub{font-size:15px;color:rgba(255,255,255,.45);margin-bottom:20px}.g-question{font-size:19px;font-weight:700;background:rgba(245,158,11,.12);border-left:3px solid var(--amber);border-radius:0 10px 10px 0;padding:14px 18px;margin-bottom:14px}.g-highlight{background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:12px 15px;margin-bottom:14px}.g-table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:14px}.g-table th,.g-table td{padding:9px 13px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07)}.g-table th{font-size:11px;color:rgba(255,255,255,.35);text-transform:uppercase}.cell-em{font-family:"JetBrains Mono";color:var(--amber);font-weight:700}.snum{font-family:"JetBrains Mono";color:var(--amber);font-weight:800}.g-formula{font-family:"JetBrains Mono";background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.2);border-radius:8px;padding:12px 15px;color:#38BDF8;margin-bottom:14px}.g-ex-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:4px 16px;margin-bottom:14px}.g-ex{padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.08);line-height:1.65}.g-ex:last-child{border:0}.g-ex b{color:var(--amber)}.g-note{background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.2);border-left:3px solid var(--purple);border-radius:0 8px 8px 0;padding:11px 15px;font-size:13px}.g-wrong-right,.trap{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px 14px}.gw,.gr{display:block}.gw{color:#F87171;text-decoration:line-through;margin-bottom:4px}.gr{color:#34D399;font-weight:700}.trap-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
#ask-panel{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:11px;padding:15px 18px;margin-top:15px}.ask-progress{font:500 11px "JetBrains Mono";color:rgba(255,255,255,.35);margin-bottom:8px}.ask-q{font-size:16px;font-weight:700}.ask-a{display:none;margin-top:9px;background:rgba(5,150,105,.15);border-left:3px solid var(--green);padding:9px 13px;color:#34D399;font-weight:700}.ask-a.show{display:block}
.q-header{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}.q-num{font:800 13px Inter;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:6px}.q-type{font-size:12px;font-weight:700;background:rgba(14,165,233,.15);color:#38BDF8;padding:4px 11px;border-radius:6px}.q-star{font-size:12px;font-weight:700;background:rgba(245,158,11,.15);color:var(--amber);padding:4px 10px;border-radius:6px}.q-sentence{font-size:18px;line-height:1.9;background:rgba(255,255,255,.05);border-left:3px solid rgba(255,255,255,.2);border-radius:0 10px 10px 0;padding:13px 17px;margin-bottom:5px}.q-sentence .blank{background:rgba(245,158,11,.18);color:var(--amber);font-weight:700;padding:0 6px;border-radius:4px}.q-zh{font-size:12px;color:rgba(255,255,255,.38);margin-bottom:15px}.zh-hidden{display:none!important}.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.q-opt{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 15px;font-size:14px}.q-opt-label{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font:700 12px Inter}.q-opt.correct{background:rgba(5,150,105,.16);border-color:var(--green)}.q-opt.correct .q-opt-label{background:var(--green)}.q-opt.dim{opacity:.28}.answer-box{display:none;background:rgba(245,158,11,.08);border-left:3px solid var(--amber);border-radius:0 9px 9px 0;padding:11px 16px;font-size:13px;margin-top:12px}.answer-box.show{display:block}.answer-box strong{color:var(--amber);font-size:14px}.answer-detail{display:block;margin-top:5px;color:rgba(255,255,255,.7)}

<script>
const GRAMMAR=[{"type":"grammar","title":"TOEIC Reading Part 5 是什麼？","subtitle":"不會全部單字，也能靠結構找到答案","content":"<div class='g-highlight'>今天的目標不是背答案，而是學會一套能重複使用的解題方法。</div><div class='g-ex-box'><div class='g-ex'><b>Part 5</b> 是單句克漏字：每題一個句子、四個選項。</div><div class='g-ex'>不必先翻譯整句；先看空格前後的<b>句型、詞性、時態與固定搭配</b>。</div><div class='g-ex'>結構判斷完成後，最後才用句意確認。</div></div>","ask":[["看到不會的單字時，第一步應該做什麼？","先看空格前後的結構與詞性，不要立刻逐字翻譯。"]]},{"type":"grammar","title":"Part 5 最常考的五種能力","subtitle":"前三項是初學者最重要的基本功","content":"<table class='g-table'><tr><th>能力</th><th>判斷重點</th></tr><tr><td class='cell-em'>01 詞性判斷</td><td>空格需要名詞、動詞、形容詞或副詞？</td></tr><tr><td class='cell-em'>02 動詞形式</td><td>原形、過去式、過去分詞或 V-ing？</td></tr><tr><td class='cell-em'>03 時態</td><td>現在、過去或未來？時間線索在哪裡？</td></tr><tr><td class='cell-em'>04 固定搭配</td><td>介系詞、片語動詞與慣用結構</td></tr><tr><td class='cell-em'>05 句意判斷</td><td>結構都可行時，用上下文選合理意思</td></tr></table><div class='g-note'>詞性、動詞形式、時態先站穩，Part 5 多數文法題就會有方向。</div>","ask":[["五種能力中，做題時最先用哪幾項？","先看句型與詞性，再判斷動詞形式、時態和搭配。"]]},{"type":"grammar","title":"Part 5 解題流程","subtitle":"先結構，後意思","content":"<table class='g-table'><tr><th>Step</th><th>要問自己的問題</th></tr><tr><td class='snum'>1</td><td>空格前後是什麼？句子缺哪個成分？</td></tr><tr><td class='snum'>2</td><td>需要哪一種詞性或動詞形式？</td></tr><tr><td class='snum'>3</td><td>有沒有時間關鍵字或主詞單複數線索？</td></tr><tr><td class='snum'>4</td><td>是不是固定搭配或片語？</td></tr><tr><td class='snum'>5</td><td>最後才把答案放回句子檢查意思。</td></tr></table><div class='g-wrong-right'><span class='gw'>逐字翻譯 → 遇到生字就停住 → 猜答案</span><span class='gr'>句型 → 詞性 → 時態／搭配 → 句意確認</span></div>","ask":[["為什麼不要一開始就翻譯整句？","因為許多題只靠空格前後的結構就能排除大部分選項。"]]},{"type":"grammar","title":"示範一：先判斷詞性","subtitle":"名詞前通常需要形容詞修飾","content":"<div class='g-question'>The company needs an ______ manager.</div><div class='g-ex-box'><div class='g-ex'>(A) experience　(B) experienced　(C) experiencing　(D) experiences</div></div><div class='g-formula'>an + 形容詞 + 名詞 manager</div><div class='g-note'>空格後是名詞 manager，所以先找形容詞。<b>experienced</b> 表示「有經驗的」，答案 B。</div>","ask":[["空格後面是什麼詞？","manager，是名詞。"],["名詞前需要什麼詞性？","形容詞，所以選 experienced。"]]},{"type":"grammar","title":"示範二：找時間關鍵字","subtitle":"看到 tomorrow，先鎖定未來式","content":"<div class='g-question'>The meeting ______ tomorrow.</div><div class='g-ex-box'><div class='g-ex'>(A) begin　(B) began　(C) will begin　(D) beginning</div></div><div class='g-formula'>tomorrow → will + 原形動詞</div><div class='g-note'>yesterday / last week → 過去；tomorrow / next week → 未來；now / currently → 現在進行。</div>","ask":[["tomorrow 對應哪一個時態？","未來式，所以選 will begin。"]]},{"type":"grammar","title":"示範三：辨認固定搭配","subtitle":"片語要整組記，不要拆開猜","content":"<div class='g-question'>Please ______ the application form.</div><div class='g-ex-box'><div class='g-ex'>(A) fill out　(B) fill on　(C) fill over　(D) fill under</div></div><div class='g-formula'>fill out + a form = 填寫表格</div><div class='g-note'>看到 application form，要直接連想到 <b>fill out a form</b>。這是固定搭配題，答案 A。</div>","ask":[["「填寫表格」的固定說法是什麼？","fill out a form。"]]},{"type":"grammar","title":"五大句型總覽","subtitle":"先問：動詞後面還需不需要接東西？","content":"<table class='g-table'><tr><th>句型</th><th>功能</th><th>例句</th></tr><tr><td class='cell-em'>S + V</td><td>不及物動詞，句子已完整</td><td>Prices rose.</td></tr><tr><td class='cell-em'>S + V + O</td><td>及物動詞，後面需要受詞</td><td>She bought a ticket.</td></tr><tr><td class='cell-em'>S + V + SC</td><td>補充說明主詞</td><td>He seems tired.</td></tr><tr><td class='cell-em'>S + V + O + C</td><td>補充說明受詞</td><td>Keep the door open.</td></tr><tr><td class='cell-em'>S + V + O + O</td><td>給誰＋給什麼</td><td>She sent me an email.</td></tr></table>","ask":[["判斷句型時，最核心的問題是什麼？","動詞後面還需要什麼成分，句子才完整？"]]},{"type":"grammar","title":"句型一：S + V","subtitle":"不及物動詞後面不直接接受詞","content":"<div class='g-formula'><b>S</b> + <b>V</b></div><div class='g-ex-box'><div class='g-ex'>I <b>sleep</b>. — 不能問「睡什麼」，句子已完整。</div><div class='g-ex'>The price <b>rose</b>. — price 自己上升。</div><div class='g-ex'>He <b>arrived</b> at the airport. — at the airport 是介系詞片語，不是受詞。</div></div><div class='g-note'>不及物動詞後可接介系詞片語，但不能直接接名詞受詞。</div>","ask":[["He arrived at the airport 的 at the airport 是受詞嗎？","不是；arrive 是不及物動詞，at the airport 是地點補充。"]]},{"type":"grammar","title":"句型二：S + V + O","subtitle":"及物動詞後面需要受詞","content":"<div class='g-formula'><b>S</b> + <b>V</b> + <b>O</b></div><div class='g-ex-box'><div class='g-ex'>I <b>like English</b>. — 喜歡「什麼」？English 是受詞。</div><div class='g-ex'>She <b>bought a ticket</b>. — 買「什麼」？a ticket 是受詞。</div><div class='g-ex'>We <b>discussed the problem</b>. — discuss 直接接受詞，不加 about。</div></div>","ask":[["She bought a ticket 中的受詞是什麼？","a ticket。"],["discuss the problem 前要加 about 嗎？","不用；discuss 是及物動詞。"]]},{"type":"grammar","title":"句型三：S + V + SC","subtitle":"主詞補語描述主詞是誰或怎麼樣","content":"<div class='g-formula'><b>S</b> + <b>V</b> + <b>SC</b></div><div class='g-ex-box'><div class='g-ex'>Mary is <b>a teacher</b>. → Mary = a teacher</div><div class='g-ex'>The room looks <b>clean</b>. → clean 描述 room</div><div class='g-ex'>He seems <b>tired</b>. → tired 描述 He</div></div><div class='g-note'>常見連綴動詞：be, become, seem, look, feel, sound, smell, taste, remain, stay。</div>","ask":[["He seems tired 的 tired 描述誰？","描述主詞 He，所以是主詞補語 SC。"]]},{"type":"grammar","title":"句型四：S + V + O + C","subtitle":"受詞補語描述受詞的狀態","content":"<div class='g-formula'><b>S</b> + <b>V</b> + <b>O</b> + <b>C</b></div><div class='g-ex-box'><div class='g-ex'>The news made him <b>nervous</b>. → him is nervous</div><div class='g-ex'>Please keep the door <b>open</b>. → the door is open</div><div class='g-ex'>I found the test <b>difficult</b>. → the test is difficult</div></div><div class='g-note'>判斷法：如果可以說「O is / becomes C」，C 就是受詞補語。常見動詞：make, keep, find, call, name, elect, consider, appoint。</div>","ask":[["Please keep the door open 中，open 描述誰？","描述受詞 the door，所以是受詞補語。"]]},{"type":"grammar","title":"句型五：S + V + O + O","subtitle":"給誰＋給什麼的雙受詞結構","content":"<div class='g-formula'><b>S</b> + <b>V</b> + <b>O₁（給誰）</b> + <b>O₂（給什麼）</b></div><div class='g-ex-box'><div class='g-ex'>She sent <b>her boss</b> <b>an email</b>.</div><div class='g-ex'>= She sent <b>an email</b> to <b>her boss</b>.</div></div><div class='g-note'>常見雙受詞動詞：give, send, tell, show, lend, offer, bring, teach, ask。</div>","ask":[["She sent her boss an email：給誰？給什麼？","her boss 是 O₁；an email 是 O₂。"]]},{"type":"grammar","title":"及物／不及物動詞快速判斷","subtitle":"看名詞能不能直接接在動詞後面","content":"<table class='g-table'><tr><th>及物：直接接受詞</th><th>不及物：需介系詞</th></tr><tr><td class='cell-em'>discuss the issue</td><td class='cell-em'>arrive at the airport</td></tr><tr><td class='cell-em'>attend a meeting</td><td class='cell-em'>listen to music</td></tr><tr><td class='cell-em'>contact the customer</td><td class='cell-em'>wait for a customer</td></tr><tr><td class='cell-em'>answer the question</td><td class='cell-em'>agree with someone</td></tr></table><div class='g-highlight'>問自己：「動詞後面的名詞是受詞，還是介系詞片語裡的名詞？」</div>","ask":[["arrive the airport 為什麼不對？","arrive 是不及物動詞，要說 arrive at the airport。"],["contact with the customer 為什麼不對？","contact 是及物動詞，直接說 contact the customer。"]]},{"type":"grammar","title":"TOEIC 高頻動詞陷阱","subtitle":"多一個或少一個介系詞，答案就不同","content":"<div class='trap-grid'><div class='trap'><span class='gw'>discuss about the issue</span><span class='gr'>discuss the issue</span></div><div class='trap'><span class='gw'>arrive the airport</span><span class='gr'>arrive at the airport</span></div><div class='trap'><span class='gw'>attend to a meeting</span><span class='gr'>attend a meeting</span></div><div class='trap'><span class='gw'>contact with the customer</span><span class='gr'>contact the customer</span></div><div class='trap'><span class='gw'>listen music</span><span class='gr'>listen to music</span></div><div class='trap'><span class='gw'>answer to the question</span><span class='gr'>answer the question</span></div></div>","ask":[["哪三個動詞可以直接接受詞，不加介系詞？","discuss、attend、contact、answer 都可直接接受詞。"]]},{"type":"grammar","title":"進入 101–120 前的作答節奏","subtitle":"每題都說出理由，再揭曉答案","content":"<div class='g-highlight'>① 先讀空格前後　② 說出考點　③ 排除不合的選項　④ 選答案　⑤ 最後檢查句意</div><div class='g-ex-box'><div class='g-ex'><b>詞性題：</b>空格要哪種詞？</div><div class='g-ex'><b>動詞題：</b>主詞、時間與主被動是什麼？</div><div class='g-ex'><b>搭配題：</b>前後字是否形成固定組合？</div><div class='g-ex'><b>語意題：</b>句子需要正面、負面，還是特定商務意思？</div></div>","ask":[["做題時，答案前至少要說出哪一件事？","說出考點或關鍵線索，不能只猜選項字母。"]]},{"type":"grammar","title":"Lesson 1 總整理","subtitle":"Part 5 入門的核心不是翻譯，而是結構","content":"<div class='g-formula'>句型 → 詞性 → 動詞形式／時態 → 固定搭配 → 句意</div><table class='g-table'><tr><th>今天帶走的系統</th><th>一句話提醒</th></tr><tr><td class='cell-em'>五大句型</td><td>看動詞後面還缺什麼</td></tr><tr><td class='cell-em'>及物／不及物</td><td>名詞能否直接接在動詞後</td></tr><tr><td class='cell-em'>時間線索</td><td>tomorrow、yesterday、now 先鎖定時態</td></tr><tr><td class='cell-em'>固定搭配</td><td>片語整組記，不逐字猜</td></tr></table><div class='g-note'>回家優先複習 discuss / arrive / attend / contact / listen / answer 的接法。</div>","ask":[["今天最重要的解題順序是什麼？","先結構，再詞性與時態／搭配，最後才看意思。"]]}];
const QUESTIONS=[
  {
    num: 101,
    type: "片語動詞",
    star: true,
    sentence: "Our company plans to ______ more employees during the busy holiday season.",

function toggleZh(){zhVisible=!zhVisible;document.querySelectorAll('.zh-target').forEach(function(e){e.classList.toggle('zh-hidden',!zhVisible)});const b=document.getElementById('zh-btn');b.textContent=zhVisible?'中文 ON':'中文 OFF';b.classList.toggle('on',zhVisible)}
function render(){const s=SLIDES[current];revealed=false;askIndex=0;askAnswer=false;document.getElementById('progress-text').textContent=(current+1)+' / '+TOTAL;document.getElementById('progress-bar').style.width=Math.round((current+1)/TOTAL*100)+'%';document.getElementById('prev-btn').disabled=current===0;document.getElementById('next-btn').disabled=current===TOTAL-1;document.getElementById('slide-type').textContent=s.type==='grammar'?'文法教學':'PART 5 練習題';show('ask-btn',s.type==='grammar'&&s.ask&&s.ask.length);show('reveal-btn',s.type==='question');const el=document.getElementById('slide-content');if(s.type==='grammar'){el.innerHTML='<div class="gram-label">Lesson 01 · Part 5 基礎系統</div><div class="gram-title">'+s.title+'</div><div class="gram-sub">'+s.subtitle+'</div>'+s.content+(s.ask&&s.ask.length?'<div id="ask-panel" class="hidden"><div class="ask-progress" id="ask-progress"></div><div class="ask-q" id="ask-q"></div><div class="ask-a" id="ask-a"></div></div>':'');document.getElementById('ask-btn').textContent='❓ 問學生'}else{const opts=s.options.map(function(o,i){return '<div class="q-opt" id="opt-'+i+'"><span class="q-opt-label">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'}).join('');el.innerHTML='<div class="q-header"><span class="q-num">'+s.num+'</span><span class="q-type">'+s.qtype+'</span>'+(s.star?'<span class="q-star">⭐ 重點題</span>':'')+'</div><div class="q-sentence">'+s.sentence.replace(/_{2,}/g,'<span class="blank">______</span>')+'</div><div class="q-zh zh-target '+(zhVisible?'':'zh-hidden')+'">'+s.zh+'</div><div class="q-opts">'+opts+'</div><div class="answer-box" id="answer-box"><strong>答案 '+String.fromCharCode(65+s.answer)+'：'+s.options[s.answer]+'</strong><span class="answer-detail">'+s.logic+'<br><b>重點：</b>'+s.keyPoint+'</span></div>'}document.getElementById('reveal-btn').textContent='揭曉答案 ▼'}
function reveal(){const s=SLIDES[current];revealed=!revealed;s.options.forEach(function(_,i){const e=document.getElementById('opt-'+i);e.classList.toggle('correct',revealed&&i===s.answer);e.classList.toggle('dim',revealed&&i!==s.answer)});document.getElementById('answer-box').classList.toggle('show',revealed);document.getElementById('reveal-btn').textContent=revealed?'隱藏答案 ▲':'揭曉答案 ▼'}
function askAction(){const s=SLIDES[current],panel=document.getElementById('ask-panel'),btn=document.getElementById('ask-btn');if(!panel||!s.ask.length)return;panel.classList.remove('hidden');if(askIndex>=s.ask.length){panel.classList.add('hidden');askIndex=0;askAnswer=false;btn.textContent='❓ 問學生';return}const pair=s.ask[askIndex],a=document.getElementById('ask-a');document.getElementById('ask-progress').textContent='問題 '+(askIndex+1)+' / '+s.ask.length;document.getElementById('ask-q').textContent=pair[0];a.textContent=pair[1];if(!askAnswer){a.classList.remove('show');askAnswer=true;btn.textContent='顯示回答'}else{a.classList.add('show');askAnswer=false;askIndex++;btn.textContent=askIndex<s.ask.length?'下一個問題 →':'收起問題'}}
function navigate(dir){current=Math.max(0,Math.min(TOTAL-1,current+dir));render();document.getElementById('slide-area').scrollTop=0}
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();navigate(1)}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();navigate(-1)}else if(e.key===' '||e.key==='Enter'){e.preventDefault();if(SLIDES[current].type==='question')reveal();else if(SLIDES[current].ask&&SLIDES[current].ask.length)askAction()}});render();
</script></body></html>
