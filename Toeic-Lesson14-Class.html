<script>const slides=[{"type":"overview","title":"Lesson 14｜閱讀 143–158","subtitle":"Mode A · Part 6–7 · 16 題","content":"<div class=\"hero-grid\"><div class=\"hero-card\"><b>4</b><span>題 Part 6</span></div><div class=\"hero-card\"><b>12</b><span>題 Part 7</span></div><div class=\"hero-card\"><b>6</b><span>組完整文章</span></div></div><div class=\"g-formula\">先辨認文體，再定位人物、時間、目的與證據。</div>"},{"type":"overview","title":"閱讀時先畫四格","subtitle":"文章、人物、時間、證據","content":"<div class=\"step-grid\"><div class=\"step\"><b>1</b><span>認出文體及讀者</span></div><div class=\"step\"><b>2</b><span>圈出問題的限制</span></div><div class=\"step\"><b>3</b><span>回文章定位句子</span></div><div class=\"step\"><b>4</b><span>逐項排除人名、時間與範圍錯置</span></div></div>"},{"type":"passage","title":"Recommendation for George Sweeney","subtitle":"Questions 143–146","content":"<div class=\"slide-article\" lang=\"en\">Dear Mr. Bob Flinders,\n\nGeorge Sweeney has requested that I write a letter of ---143--- based on our professional association over the past three years. I’ve found Mr. Sweeney to be ---144--- and trustworthy ---145--- energetic in carrying out his duties. I believe he will be an asset to any organization, ---146---. I will be happy to provide any further information.\n\nSincerely,\nMary Dignen</div><div class=\"q-zh zh-target\">Mary Dignen 應 George Sweeney 請求，根據三年共事經驗寫信給 Bob Flinders 推薦他。信中稱 George 聰明、值得信任且做事有活力，認為他對任何組織都是資產，願意毫無保留地推薦並提供進一步資料。</div>"},{"type":"question","num":143,"title":"George Sweeney 推薦信","sentence":"George Sweeney has requested that I write a letter of ---143--- based on our professional association over the past three years.","options":["recommending","recommended","recommendation","recommend"],"answer":2,"zh":"George Sweeney 請我依據過去三年的專業合作關係寫一封 ____ 信。","rule":"a letter of recommendation 是固定名詞搭配；of 後需名詞。","explanation":"recommendation 同時滿足詞性和文體用途。","vocab":["recommendation (n. 推薦；letter of recommendation；She wrote a letter of recommendation.)","association (n. 合作／關聯；professional association；They hav stworthy employee；He is trustworthy.)"],"article":"<div class=\"slide-article\" lang=\"en\">Dear Mr. Bob Flinders,\n\nGeorge Sweeney has requested that I write a letter of ---143--- based on our professional association over the past three years. I’ve found Mr. Sweeney to be ---144--- and trustworthy ---145--- energetic in carrying out his duties. I believe he will be an asset to any organization, ---146---. I will be happy to provide any further information.\n\nSincerely,\nMary Dignen</div>","star":true},{"type":"question","num":146,"title":"George Sweeney 推薦信","sentence":"I believe he will be an asset to any organization, ---146---. I will be happy to provide any further information.","options":["so the work can withstand the test of time","so please come back within two hours","so I would recommend him without reservations","so he will with you shortly"],"answer":2,"zh":"我相信他對任何組織都是資產，____；若需更多資訊，我也樂意提供。","rule":"整句插入須承接 asset 的正面評價，主詞 I 的推薦與結尾提供資料相連。","explanation":"C 的 so 表結果，推薦立場與上下文一致。","vocab":["asset (n. 有價值的人；asset to a team；He is an asset to the team.)","reservation (n. 保留；without reservations；I recommend her without reservations.)"],"article":"<div class=\"slide-article\" lang=\"en\">Dear Mr. Bob Flinders,\n\nGeorge Sweeney has requested that I write a letter of ---143--- based on our professional association over the past three years. I’ve found Mr. Sweeney to be ---144--- and trustworthy ---145--- energetic in carrying out his duties. I believe he will be an asset to any organization, ---146---. I will be happy to provide any further information.\n\nSincerely,\nMary Dignen</div>","star":true},{"type":"passage","title":"Quick Moving Agent","subtitle":"Questions 147–148","content":"<div class=\"slide-article\" lang=\"en\">Quick Moving Agent\n\nQuick Moving Agent is a full-service transportation and moving company. Our professional moving staff can handle everything from packing goods, local and long-distance moves to large scale commercial moves. Whether Free: (800) 7262-3984\nhttp://www.quickmoving.com\ninfo@quickmoving.com</div>","star":false},{"type":"passage","title":"Short Story Competition Inquiry","subtitle":"Questions 149–150","content":"<div class=\"slide-article\" lang=\"en\">April 4\n\nJerry (10:42 a.m.): Hi. I saw your ad on the internet the other day, and I’m sending this message to request more information about the short story competition please.\nEvent Organizer (10:43 a.m.): Certainly. Well, you can write about any topic you like, as long as you make the story interesting and it has to have a surprise-ending.\nJerry (10:44 a.m.): I see. So when is the closing date for the competition? I hope I’m not too late.\nEvent Organizer (10:45 a.m.): You’ve still got plenty of time. You need to submit your entry by the end of October.\nJerry (10:46 a.m.): All right, that’s good. When I’ve finished my story, I email it to you, right?\nEvent Organizer (10:47 a.m.): Exactly. Just send your story to entry@compass.com. Thank you.</div><div class=\"q-zh zh-target\">4 月 4 日 Jerry 傳訊詢問短篇小說比賽。主辦人說可自由選題，但故事要有趣且有意外結局；投稿截止為十月底，完成後寄到指定信箱。</div>"},{"type":"question","num":149,"title":"Jerry 詢問短篇小說比賽","sentence":"What does Jerry plan to do?","options":["Arrange a meeting","Participate in a competition","Apply for a job","Become a storyteller"],"answer":1,"zh":"Jerry 打算做什麼？","rule":"對話開頭 request information about the short story competition，後面問提交作品。","explanation":"B 由詢問比賽規則與投稿方式共同支持。","vocab":["participate (v. 參與；participate in a competition；He will participate in a competition.)","entry (n. 參賽作品；submit an entry；She submitted an entry.)"],"article":"<div class=\"slide-article\" lang=\"en\">April 4\n\nJerry (10:42 a.m.): Hi. I saw your ad on the internet the other day, and I’m sending this message to request more information about the short story competition please.\nEvent Organizer (10:43 a.m.): Certainly. Well, you can write about any topic you like, as long as you make the story interesting and it has to have a surprise-ending.\nJerry (10:44 a.m.): I see. So when is the closing date for the competition? I hope I’m not too late.\nEvent Organizer (10:45 a.m.): You’ve still got plenty of time. You need to submit your entry by the end of October.\nJerry (10:46 a.m.): All right, that’s good. When I’ve finished my story, I email it to you, right?\nEvent Organizer (10:47 a.m.): Exactly. Just send your story to entry@compass.com. Thank you.</div>","star":false},{"type":"question","num":150,"title":"Jerry 詢問短篇小說比賽","sentence":"When will Jerry need to finish writing his story?","options":["In December","In November","In October","In January"],"answer":2,"zh":"Jerry 最遲要在何時完成故事？","rule":"主辦人說 submit your entry by the end of October；完成必須不晚於投稿。","explanation":"C 與十月底截稿一致；對話日期 April 4 不是截稿日期。","vocab":["closing date (n. 截止日；closing date for entries；The closing date is in October.)","submit (v. 提交；submit your story；Submit your story by October.)"],"article":"<div class=\"slide-article\" lang=\"en\">April 4\n\nJerry (10:42 a.m.): Hi. I saw your ad on the internet the other day, and I’m sending this message to request more information about the short story competition please.\nEvent Organizer (10:43 a.m.): Certainly. Well, you can write about any topic you like, as long as you make the story interesting and it has to have a surprise-ending.\nJerry (10:44 a.m.): I see. So when is the closing date for the competition? I hope I’m not too late.\nEvent Organizer (10:45 a.m.): You’ve still got plenty of time. You need to submit your entry by the end of October.\nJerry (10:46 a.m.): All right, that’s good. When I’ve finished my story, I email it to you, right?\nEvent Organizer (10:47 a.m.): Exactly. Just send your story to entry@compass.com. Thank you.</div>","star":true},{"type":"passage","title":"The Value MBA Online Workshop","subtitle":"Questions 151–153","content":"<div class=\"slide-article\" lang=\"en\">The Value MBA is an online leadership and management workshop. In 2018, students from more than 50 orkshop.)","leader (n. 領導者；business leaders；Business leaders joined the program.)"],"article":"<div class=\"slide-article\" lang=\"en\">The Value MBA is an online leadership and management workshop. In 2018, students from more than 50 countries worldwide participated. Each session of the workshop is led by a cadre of coaches, who engage with students in individual and group work. During the workshop, each student publishes the results of the 10 assigned projects on the public Value-MBA site. The program is entirely based online, with students participating from their home or workplace.\n\nThe tuition for the program is $2,000. Attending students include managers and leaders at large organizations, as well as entrepreneurs and freelancers. Represented brands include Microsoft, Google, Summit Bank, and more. Admission is by application only. For more information or to apply, please visit: http://www.value-mba.com</div>","star":false},{"type":"passage","title":"Jessie Garfield New CEO of Online Tech","subtitle":"Questions 154–156","content":"<div class=\"slide-article\" lang=\"en\">Jessie Garfield New CEO of Online Tech\nReported by Mark Goodwin\n\nOnline Tech, the Singapore startup developing products and services to realize the industrial internet, announced yesterday that it has hired Jessie Garfield as its new CEO. Garfield was previously CEO and co-founder of M-Media, a Singapore-based company designing audio chipsets and software.\n\n“I am excited to be joining Online Tech. This is probably the most exciting company globally in the wireless space,” commented Jessie Garfield.\n\nTed Bush, Founder and CTO, said: “Garfield’s track record in building international operations is exactly what we now need. I’m delighted to welcome her on board and look forward to us working together to build Online Tech into a huge company.”</div><div class=\"q-zh zh-target\">新加坡新創 Online Tech 宣布聘 Jessie Garfield 為新任執行長。她曾是 M-Media 的執行長與共同創辦人。新公司的創辦人暨技術長 Ted Bush 看重她建立國際營運的經驗。</div>"},{ ly what we now need. I’m delighted to welcome her on board and look forward to us working together to build Online Tech into a huge company.”</div>","star":false},{"type":"passage","title":"River Green Clean-up Volunteers","subtitle":"Questions 157–158","content":"<div class=\"slide-article\" lang=\"en\">Volunteers urged to support River Green clean-up in New Town at weekend\n\nScores of volunteers are lining up to give the River Green in New Town a clean-up. Every year for the past five years, a tidy-up campaign has been organized along the riverside, and unsightly items in the water have been retrieved. This year’s effort is scheduled for Saturday, March 13th, from 10 a.m. until 2 p.m.\n\nIn previous clean-ups, large items have been pulled out of the water, including bikes and shopping trolleys, and rubbish have been collected on the banks and towpaths. Andrea Waterman, who has been involved in the scheme for many years, said: “There will be three locations for volunteers to go to—Teaneck Riverside, outside the Madison corner, and the path outside The Riverside Bridge—and all are welcome. City council officers will give out gloves, pickers and plastic bags.”</div><div class=\"q-zh zh-target\">New Town 的 River Green 河岸本週末舉行清理活動，已連續辦理五年；志工可於 3 月 13 日 10 時至 14 時到三個指定地點參與。市府人員會發手套、夾取工具與塑膠袋。</div>"},{"type":"question","num":157,"title":"River Green 週末河岸清理","sentence":"What is the purpose of this announcement?","options":["To announce a new movie festival to the public","To introduce new volunteers to the company","To encourage volunteers to join an organization","To invite volunteers for a tidy-up campaign"],"answer":3,"zh":"這篇公告的目的是什麼？","rule":"標題 Volunteers urged to support...clean-up，內文 all are welcome 與時間、地點相互支持。","explanation":"D 概括整篇的招募與活動。","vocab":["volunteer (n. 志工；invite volunteers；We invite volunteers to join.)","tidy-up (n. 清理；tidy-up campaign；Join the tidy-up campaign.)"],"article":"<div class=\"slide-article\" lang=\"en\">Volunteers urged to support River Green clean-up in New Town at weekend\n\nScores of volunteers are lining up to give the River Green in New Town a clean-up. Every year for the past five years, a tidy-up campaign has been organized along the riverside, and unsightly items in the water have been retrieved. This year’s effort is scheduled for Saturday, March 13th, from 10 a.m. until 2 p.m.\n\nIn previous clean-ups, large items have been pulled out of the water, including bikes and shopping trolleys, and rubbish have been collected on the banks and towpaths. Andrea Waterman, who has been involved in the scheme for many years, said: “There will be three locations for volunteers to go to—Teaneck Riverside, outside the Madison corner, and the path outside The Riverside Bridge—and all are welcome. City council officers will give out gloves, pickers and plastic bags.”</div>","star":false},{"type":"question","num":158,"title":"River Green 週末河岸清理","sentence":"What will city council officers NOT give out to volunteers?","options":["Gloves","Pickers","Snacks","Plastic bags"],"answer":2,"zh":"市府人員不會（依文中資訊）發給志工哪一項？","rule":"最後一句只列 gloves, pickers and plastic bags，沒有 snacks。","explanation":"C 未在發放清單內；這是文本未提及，不代表現實活動絕不提供。","vocab":["glove (n. 手套；give out gloves；Officers give out gloves.)","picker (n. 夾取工具；give out pickers；Volunteers use pickers.)"],"article":"<div class=\"slide-article\" lang=\"en\">Volunteers urged to support River Green clean-up in New Town at weekend\n\nScores of volunteers are lining up to give the River Green in New Town a clean-up. Every year for the past five years, a tidy-up campaign has been organized along the riverside, and unsightly items in the water have been retrieved. This year’s effort is scheduled for Saturday, March 13th, from 10 a.m. until 2 p.m.\n\nIn previous clean-ups, large items have been pulled out of the water, including bikes and shopping trolleys, and rubbish have been collected on the banks and towpaths. Andrea Waterman, who has been involved in the scheme for many ye function render(){let s=slides[current];revealed=false;document.getElementById('progress-text').textContent=(current+1)+' / '+TOTAL;document.getElementById('progress-bar').style.width=Math.round((current+1)/TOTAL*100)+'%';document.getElementById('prev-btn').disabled=current===0;document.getElementById('next-btn').disabled=current===TOTAL-1;document.getElementById('slide-jump').value=String(current);document.getElementById('slide-type-label').textContent=s.type==='question'?'閱讀練習題':s.type==='passage'?'文章先導':s.type==='summary'?'LESSON SUMMARY':'LESSON OVERVIEW';document.getElementById('reveal-btn').classList.toggle('hidden',s.type!=='question');let el=document.getElementById('slide-content');
if(s.type!=='question'){el.innerHTML=(s.type==='passage'?'':'<div class="slide-label">Lesson 14 · Mode A</div>')+'<div class="slide-title'+(s.type==='passage'?' passage-title':'')+'">'+esc(s.title)+'</div><div class="slide-sub">'+esc(s.subtitle)+'</div>'+s.content}
else{let opts=s.options.map((o,i)=>'<div class="q-opt" id="opt-'+i+'"><span class="q-opt-lbl">'+String.fromCharCode(65+i)+'</span>'+esc(o)+'</div>').join('');let vocab=s.vocab.map(v=>'<div class="vocab-row">'+esc(v)+'</div>').join('');el.innerHTML='<div class="q-header"><span class="q-num">Q'+s.num+'</span>'+(s.star?'<span class="q-star">⭐ 重點題</span>':'')+'</div><div class="q-sentence" lang="en">'+esc(s.sentence)+'</div><div class="q-zh zh-target">'+esc(s.zh)+'</div><details class="article-toggle"><summary>查看文章</summary>'+s.article+'</details><div class="q-opts">'+opts+'</div><div class="key-reveal" id="key-reveal"><div class="answer-line">答案 '+String.fromCharCode(65+s.answer)+'：'+esc(s.options[s.answer])+'</div><div class="explain-line">'+esc(s.explanation)+'</div>'+(vocab?'<details class="vocab-toggle"><summary>關鍵單字</summary>'+vocab+'</details>':'')+'</div>'}applyZh();document.getElementById('reveal-btn').textContent='揭曉答案 ▼';document.getElementById('slide-area').scrollTop=0}
function reveal(){let s=slides[current];if(s.type!=='question')return;revealed=!revealed;s.options.forEach((_,i)=>{let el=document.getElementById('opt-'+i);el.classList.toggle('correct',revealed&&i===s.answer);el.classList.toggle('dimmed',revealed&&i!==s.answer)});document.getElementById('key-reveal').classList.toggle('show',revealed);document.getElementById('reveal-btn').textContent=revealed?'隱藏答案 ▲':'揭曉答案 ▼'}
function navigate(dir){current=Math.max(0,Math.min(TOTAL-1,current+dir));render()}function jumpTo(value){current=Number(value);render()}
let jump=document.getElementById('slide-jump');slides.forEach((s,i)=>{let opt=document.createElement('option');opt.value=i;opt.textContent=s.type==='question'?'Q'+s.num:s.type==='passage'?s.subtitle:s.type==='summary'?'總結':'導入 '+(i+1);jump.appendChild(opt)});
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();navigate(1)}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();navigate(-1)}else if(e.key===' '||e.key==='Enter'){e.preventDefault();reveal()}else if(e.key.toLowerCase()==='z')toggleZh()});render();
</script>

const lesson14Translations={
"Recommendation for George Sweeney":`<div class="article-translation zh-target"><div class="article-translation-title">完整中文翻譯</div><p>親愛的 Bob Flinders 先生：</p><p>George Sweeney 請我根據過去三年與他的專業往來，為他寫一封＿＿＿。我認為 Sweeney 先生＿＿＿、值得信賴，＿＿＿在履行職責時充滿活力。我相信他會成為任何組織的重要人才，＿＿＿。若您需要任何進一步的資訊，我很樂意提供。</p><p>謹上，Mary Dignen</p></div>`,
"Quick Moving Agent":`<div class="article-translation zh-target"><div class="article-translation-title">完整中文翻譯</div><p>Quick Moving Agent 是一家提供全方位運輸與搬家服務的公司。我們的專業搬家人員能處理各種需求，從物品包裝、市區與長途搬家，到大型商業搬遷都包含在內。無論您是在城鎮另一端搬家，還是跨越全國搬遷，我們都能提供符合您的需求與預算的搬家方案。</p><p>Quick Moving Agent 很自豪能成為全美第一的搬家公司。我們的顧客已逐漸信賴我們，仰賴我們提供最專業、最可靠的在地搬家服務。憑藉高度合格的員工，我們能持續提供符合您期望的服務水準。我們專精於住宅、商業及工業搬遷，服務範圍包含市區與長途搬家。立即聯絡我們，取得免費搬家報價！</p></div>`,
"Short Story Competition Inquiry":`<div class="article-translation zh-target"><div class="article-translation-title">完整中文翻譯</div><p>Jerry：您好。我前幾天在網路上看到你們的廣告，因此傳訊息想詢問更多關於短篇小說比賽的資訊。</p><p>主辦人：當然可以。你可以寫任何喜歡的主題，只要故事有趣，而且有令人意外的結局即可。</p><p>Jerry：我了解了。那麼比賽的截止日期是什麼時候？希望我還沒有太遲。</p><p>主辦人：你還有很充裕的時間。你必須在十月底以前提交參賽作品。</p><p>Jerry：好的，那太好了。等我完成故事後，就用電子郵件寄給你們，對嗎？</p><p>主辦人：沒錯。只要把故事寄到 entry@compass.com 即可，謝謝。</p></div>`,
"The Value MBA Online Workshop":`<div class="article-translation zh-target"><div class="article-translation-title">完整中文翻譯</div><p>Value MBA 是一項線上領導與管理工作坊。2018 年，來自全球五十多個國家的學生參與了這項課程。工作坊的每一堂課都由一組核心教練帶領；這些教練會與學生進行個別及團體活動。工作坊期間，每位學生都會在公開的 Value MBA 網站上發布十項指定專案的成果。整個課程完全在線上進行，學生可從家中或工作場所參與。</p><p>這項課程的學費為 2,000 美元。參與者包括大型組織的經理與領導者，以及創業家和自由工作者。參與者所代表的品牌包括 Microsoft、Google、Summit Bank 等。本課程僅接受申請入學。如需更多資訊或申請，請造訪網站。</p></div>`,
"Jessie Garfield New CEO of Online Tech":`<div class="article-translation zh-target"><div class="article-translation-title">完整中文翻譯</div><p>致力於開發工業網路產品與服務的新加坡新創公司 Online Tech 昨日宣布，已聘請 Jessie Garfield 擔任新任執行長。Garfield 過去曾擔任 M-Media 的執行長及共同創辦人；M-Media 是一家設於新加坡、設計多種音訊晶片組與軟體的公司。</p><p>Jessie Garfield 表示：「我很高興能加入 Online Tech。這可能是全球無線通訊領域最令人振奮的公司。」</p><p>創辦人兼技術長 Ted Bush 表示：「Garfield 建立國際營運的過往成績，正是我們目前所需要的。我很高興歡迎她加入，也期待我們共同合作，將 Online Tech 發展成一家大型企業。」</p></div>`,
"River Green Clean-up Volunteers":`<div class="article-translation zh-target"><div class="article-translation-title">完整中文翻譯</div><p>許多志工正踴躍準備參與 New Town 的 River Green 清理工作。過去五年來，每年都會沿河岸舉辦清理活動，並撈出水中不美觀的廢棄物。今年的活動預定於 3 月 13 日星期六上午 10 點至下午 2 點舉行。</p><p>過去的清理活動曾從水中拖出腳踏車和購物推車等大型物品，也清除了河岸與拖船道上的垃圾。參與這項計畫多年的 Andrea Waterman 表示，志工可前往三個集合地點。歡迎所有人參加；市議會工作人員將發放手套、夾取器和塑膠袋。</p></div>`

 }
 lesson14Enhanced.push(s);
 if(s.type==='question'&&lesson14After[s.num])lesson14Enhanced.push(...lesson14After[s.num]);
});
lesson14Enhanced.push({type:'summary',title:'Lesson 14 Wrap-up',subtitle:'Questions 143–158 · Answer Check',content:'<div class="wrap-grid">'+['143 C','144 B','145 A','146 C','147 B','148 B','149 B','150 C','151 A','152 D','153 C','154 B','155 B','156 A','157 D','158 C'].map(x=>{const [n,a]=x.split(' ');return '<div class="wrap-chip"><b>Q'+n+'</b><span>'+a+'</span></div>'}).join('')+'</div><div class="wrap-note">本課帶走的語言：推薦用語、服務介紹、截止日期、線上課程、公司人事公告，以及社區活動招募。答案確認後，請回到各篇的 Language Focus 與 Quick Practice，把原文表達換進新句子裡。</div>'});
slides.splice(0,slides.length,...lesson14Enhanced);
const lesson14Total=slides.length;
let lesson14PracticeStep=0;
render=function(){
 let s=slides[current];revealed=false;lesson14PracticeStep=0;
 document.getElementById('progress-text').textContent=(current+1)+' / '+lesson14Total;
 document.getElementById('progress-bar').style.width=Math.round((current+1)/lesson14Total*100)+'%';
 document.getElementById('prev-btn').disabled=current===0;document.getElementById('next-btn').disabled=current===lesson14Total-1;
 document.getElementById('slide-jump').value=String(current);
 const labels={question:'QUESTION',passage:'READING PASSAGE',focus:'LANGUAGE FOCUS',practice:'QUICK PRACTICE',summary:'LESSON SUMMARY',overview:'LESSON OVERVIEW'};
 document.getElementById('slide-type-label').textContent=labels[s.type]||'LESSON 14';
 document.getElementById('reveal-btn').classList.toggle('hidden',!['question','practice'].includes(s.type));
 let el=document.getElementById('slide-content');
 if(s.type==='question'){
  const opts=s.options.map((o,i)=>'<div class="q-opt" id="opt-'+i+'"><span class="q-opt-lbl">'+String.fromCharCode(65+i)+'</span>'+esc(o)+'</div>').join('');
  el.innerHTML='<div class="q-header"><span class="q-num">Q'+s.num+'</span>'+(s.star?'<span class="q-star">⭐ 重點題</span>':'')+'</div><div class="q-sentence" lang="en">'+esc(s.sentence)+'</div><div class="q-zh zh-target">'+esc(s.zh)+'</div><details class="article-toggle"><summary>查看文章</summary>'+s.article+'</details><div class="q-opts">'+opts+'</div><div class="key-reveal" id="key-reveal"><div class="answer-line">答案 '+String.fromCharCode(65+s.answer)+'：'+esc(s.options[s.answer])+'</div><div class="explain-line">'+esc(s.explanation)+'</div></div>';
 }else if(s.type==='practice'){
  el.innerHTML='<div class="slide-label">Lesson 14 · Practice</div><div class="slide-title">'+esc(s.title)+'</div><div class="slide-sub">'+esc(s.subtitle)+'</div><div class="practice-list">'+s.items.map((it,i)=>'<div class="practice-item"><span class="practice-no">'+(i+1)+'</span><div class="practice-main"><div class="practice-prompt">'+esc(it[0]).replaceAll('___','<span class="practice-blank">_____</span>')+'</div><div class="practice-zh zh-target">'+esc(it[3])+'</div></div><div class="practice-answer" id="practice-answer-'+i+'">'+esc(it[1])+'<span class="practice-note">'+esc(it[2])+'</span></div></div>').join('')+'</div>';
 }else{
  el.innerHTML=(s.type==='passage'?'':'<div class="slide-label">Lesson 14 · Mode A</div>')+'<div class="slide-title'+(s.type==='passage'?' passage-title':'')+'">'+esc(s.title)+'</div><div class="slide-sub">'+esc(s.subtitle)+'</div>'+s.content;
 }
 applyZh();
 const rb=document.getElementById('reveal-btn');
 rb.textContent=s.type==='practice'?'逐題揭曉（0 / '+s.items.length+'）':'揭曉答案 ▼';
 document.getElementById('slide-area').scrollTop=0;
};
reveal=function(){
 const s=slides[current];
 if(s.type==='practice'){
  if(lesson14PracticeStep<s.items.length){document.getElementById('practice-answer-'+lesson14PracticeStep).classList.add('show');lesson14PracticeStep++;document.getElementById('reveal-btn').textContent=lesson14PracticeStep<s.items.length?'逐題揭曉（'+lesson14PracticeStep+' / '+s.items.length+'）':'全部已揭曉｜按一下收回'}
  else{document.querySelectorAll('.practice-answer').forEach(x=>x.classList.remove('show'));lesson14PracticeStep=0;document.getElementById('reveal-btn').textContent='逐題揭曉（0 / '+s.items.length+'）'}
  return;
 }
 if(s.type!=='question')return;
 revealed=!revealed;s.options.forEach((_,i)=>{const node=document.getElementById('opt-'+i);node.classList.toggle('correct',revealed&&i===s.answer);node.classList.toggle('dimmed',revealed&&i!==s.answer)});document.getElementById('key-reveal').classList.toggle('show',revealed);document.getElementById('reveal-btn').textContent=revealed?'隱藏答案 ▲':'揭曉答案 ▼';
};
navigate=function(dir){current=Math.max(0,Math.min(lesson14Total-1,current+dir));render()};
jumpTo=function(value){current=Number(value);render()};
jump.innerHTML='';
slides.forEach((s,i)=>{const opt=document.createElement('option');opt.value=i;opt.textContent=s.type==='question'?'Q'+s.num:s.type==='passage'?s.subtitle:s.type==='focus'?'Language Focus · '+s.subtitle.split(' · ')[0]:s.type==='practice'?'Quick Practice · '+s.subtitle.split(' · ')[0]:s.type==='summary'?'Lesson 14 Wrap-up':'導入 '+(i+1);jump.appendChild(opt)});
current=0;render();
</script></body></html>
