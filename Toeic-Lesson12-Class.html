<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--navy:#0F172A;--amber:#F59E0B;--green:#059669;--sky:#0EA5E9;--purple:#7C3AED;--red:#DC2626;--gray:#94A3B8}html,body{height:100%;overflow:hidden}body{font-family:"Noto Sans TC","Inter",sans-serif;background:var(--navy);color:#fff;display:flex;flex-direction:column}

#bottombar{height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(255,255,255,.03);border-top:1px solid rgba(255,255,255,.07)}.nav-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:"Noto Sans TC",sans-serif;transition:.15s}.nav-btn:hover{background:rgba(255,255,255,.14)}.nav-btn:disabled{opacity:.25;cursor:default}.center-btns{display:flex;align-items:center;gap:10px;flex-direction:column}#slide-type-label{font-size:11px;color:rgba(255,255,255,.3);font-family:"JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:1px}.action-row{display:flex;gap:8px}.action-btn{border:none;border-radius:10px;padding:9px 22px;font-size:14px;font-weight:800;cursor:pointer;font-family:"Noto Sans TC",sans-serif;transition:.15s}.action-btn.hidden{display:none}#reveal-btn{background:var(--amber);color:var(--navy)}.zh-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.45);border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:"Noto Sans TC",sans-serif}.zh-btn.on{background:rgba(14,165,233,.15);border-color:rgba(14,165,233,.4);color:#38BDF8}.zh-hidden{display:none!important}
.slide-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--amber);margin-bottom:8px}.slide-title{font-size:30px;font-weight:900;font-family:Inter,"Noto Sans TC",sans-serif;margin-bottom:5px}.slide-sub{font-size:15px;color:rgba(255,255,255,.45);margin-bottom:22px}.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0}.hero-card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:26px;text-align:center}.hero-card b{display:block;color:var(--amber);font-size:28px;font-family:Inter,sans-serif}.hero-card span{font-size:13px;color:rgba(255,255,255,.55)}.g-formula{font-family:"JetBrains Mono","Noto Sans TC",monospace;background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.2);border-radius:8px;padding:14px 17px;font-size:14px;color:#38BDF8;margin-bottom:14px}.g-note{background:rgba(124,58,237,.1);border-left:3px solid var(--purple);border-radius:0 8px 8px 0;padding:13px 17px;font-size:14px;color:rgba(255,255,255,.8)}.g-question{font-size:18px;font-weight:700;background:rgba(245,158,11,.12);border-left:3px solid var(--amber);border-radius:0 10px 10px 0;padding:14px 18px;margin-top:18px}.step-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.step{display:grid;grid-template-columns:42px 1fr;gap:3px 12px;align-items:center;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:18px}.step b{grid-row:1/3;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--amber);color:var(--navy);font:800 16px Inter}.step span{font-size:17px;font-weight:800}.step small{color:rgba(255,255,255,.45)}
.q-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.q-num{font:800 13px Inter;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:6px}.q-type-tag{font-size:12px;font-weight:700;background:rgba(14,165,233,.15);color:#38BDF8;padding:4px 12px;border-radius:6px}.q-star{font-size:12px;font-weight:700;background:rgba(245,158,11,.15);color:var(--amber);padding:4px 10px;border-radius:6px}.q-sentence{font-size:17px;font-weight:500;line-height:1.85;background:rgba(255,255,255,.05);border-left:3px solid rgba(255,255,255,.2);border-radius:0 10px 10px 0;padding:14px 18px;margin-bottom:5px}.q-sentence u{text-decoration:none;background:rgba(245,158,11,.18);color:var(--amber);font-weight:700;padding:0 6px;border-radius:4px}.q-zh{font-size:13px;color:rgba(255,255,255,.4);margin:7px 2px 14px}.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.q-opt{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 15px;font-size:14px;transition:.2s}.q-opt-lbl{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font:700 12px Inter;flex-shrink:0}.q-opt.correct{background:rgba(5,150,105,.16);border-color:var(--green)}.q-opt.correct .q-opt-lbl{background:var(--green)}.q-opt.dimmed{opacity:.28}.key-reveal{display:none;background:rgba(245,158,11,.07);border-left:3px solid var(--amber);border-radius:0 10px 10px 0;padding:13px 17px;margin-top:12px}.key-reveal.show{display:block}.answer-line{font-size:15px;color:#FBBF24;font-weight:800;margin-bottom:7px}.rule-line{font-size:14px;color:#38BDF8;font-weight:700;margin-bottom:5px}.explain-line{font-size:13px;color:rgba(255,255,255,.78);line-height:1.65}.source-note{font-size:12px;color:#FCA5A5;margin-top:6px}.vocab-row{display:grid;grid-template-columns:140px 180px 1fr;gap:10px;border-top:1px dashed rgba(255,255,255,.1);padding-top:7px;margin-top:7px;font-size:12px}.vocab-word{font-family:"JetBrains Mono",monospace;color:#34D399;font-weight:700}.vocab-meaning{color:rgba(255,255,255,.55)}.vocab-example{color:rgba(255,255,255,.42)}
.table-wrap{max-height:545px;overflow:auto;border:1px solid rgba(255,255,255,.1);border-radius:12px}.summary-table{width:100%;border-collapse:collapse;font-size:13px}.summary-table th,.summary-table td{padding:8px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07)}.summary-table th{position:sticky;top:0;background:#1E293B;color:var(--amber);font-size:11px;letter-spacing:.5px}.summary-table td:nth-child(1),.summary-table td:nth-child(2){font-family:"JetBrains Mono"}.summary-table td:nth-child(2){color:#34D399;font-weight:800}
@media(max-width:700px){#topbar{padding:0 14px}.top-title{font-size:11px}.pbwrap{display:none}#slide-area{padding:18px 14px 10px}#bottombar{height:68px;padding:0 10px}.nav-btn{padding:9px 11px;font-size:12px}.action-btn{padding:9px 12px}.slide-title{font-size:24px}.hero-grid,.step-grid,.q-opts{grid-template-columns:1fr}.hero-card{padding:13px}.q-sentence{font-size:15px}.vocab-row{grid-template-columns:1fr}.vocab-meaning,.vocab-example{margin-top:-5px}.slide-sub{margin-bottom:14px}}

<script>
const slides=[{"type":"overview","title":"Lesson 12｜Part 5 101–121","subtitle":"Mode A · 多益試題 · 21 題","content":"<div class=\"hero-grid\"><div class=\"hero-card\"><b>21</b><span>題依原題號</span></div><div class=\"hero-card\"><b>8 步</b><span>固定解題流程</span></div><div class=\"hero-card\"><b>Part 5</b><span>詞性 × 句型 × 搭配</span></div></div><div class=\"g-formula\">先結構、再搭配、最後語意。</div>"},{"type":"overview","title":"每題固定四步","subtitle":"先找證據，再選答案","content":"\n    <div class=\"step-grid\"><div class=\"step\"><b>1</b><span>看空格前後</span><small>冠詞、介系詞、助動詞、比較級</small></div><div class=\"step\"><b>2</b><span>判斷需要什麼</span><small>詞性、時態、連接功能</small></div><div class=\"step\"><b>3</b><span>核對固定搭配</span><small>片語與動詞受詞關係</small></div><div class=\"step\"><b>4</b><span>代回整句</span><small>時間、語意與邏輯都合理</small></div></div>\n    <div class=\"g-question\">互動：作答前先說出「我看到的線索」；揭曉後再用一句話說明排除理由。</div>"},{"type":"question","num":101,"qtype":"as well as・平行結構","star":true,"sentence":"Effective goal setting involves creating a comprehensive plan <u>______</u> deciding what to accomplish next.","zh":"有效的目標設定包括制訂一份全面的計畫，以及決定下一步要完成什麼。","options":["as well as","but also","as","too"],"answer":0,"rule":"A as well as B；creating 與 deciding 兩個 V-ing 片語平行。","explanation":"as well as 能直接連接兩個形式與功能相同的 V-ing 片語。","vocab":[{"word":"goal setting","meaning":"n. 目標設定","example":"Effective goal setting improves performance."},{"word":"comprehensive","meaning":"adj. 全面的","example":"We need a comprehensive plan."},{"word":"accomplish","meaning":"v. 完成；達成","example":"The team accomplished its goal."}],"note":""},{"type":"question","num":102,"qtype":"no choice but to","star":true,"sentence":"Due to the bad weather condition, Nina had no choice <u>______</u> to give up her attempt to climb the mountain.","zh":"由於天候狀況不佳，Nina 除了放棄登山的嘗試之外別無選擇。","options":["and","however","also","but"],"answer":3,"rule":"have no choice but to V＝只能做某事。","explanation":"but 與 no choice、to give up 共同形成固定句型。","vocab":[{"word":"due to","meaning":"prep. 由於","example":"The delay was due to rain."},{"word":"attempt","meaning":"n. 嘗試","example":"They made an attempt to reduce costs."},{"word":"climb","meaning":"v. 攀登","example":"They plan to climb the mountain."}],"note":""},{"type":"question","num":103,"qtype":"for + V-ing","star":false,"sentence":"What do you have in mind for <u>______</u> George’s promotion?","zh":"對於慶祝 George 升遷這件事，你有什麼想法？","options":["celebrating","celebration","celebrated","celebrates"],"answer":0,"rule":"介系詞 for 後接 V-ing；celebrate 直接接受詞。","explanation":"celebrating 是動名詞，可放在 for 後並直接帶 George’s promotion。","vocab":[{"word":"celebrate","meaning":"v. 慶祝","example":"The team celebrated her promotion."},{"word":"promotion","meaning":"n. 升遷；促銷","example":"She received a promotion."},{"word":"mind","meaning":"n. 想法","example":"Do you have a venue in mind?"}],"note":""},{"type":"question","num":104,"qtype":"whose + 名詞","star":true,"sentence":"As a regional healthcare provider <u>______</u> patients include low-income and uninsured residents, Springfield Hospital must control expenses.","zh":"Springfield Hospital 是一家區域性醫療服務機構，其病患包括低收入及未投保醫療保險的居民，因此必須控制支出。","options":["who","which","whom","whose"],"answer":3,"rule":"所有格關係代名詞 whose + 名詞。","explanation":"whose patients 等於 the provider’s patients，結構與語意完整。","vocab":[{"word":"regional","meaning":"adj. 區域性的","example":"The firm opened a regional office."},{"word":"provider","meaning":"n. 服務提供者","example":"Contact your service provider."},{"word":"uninsured","meaning":"adj. 未投保的","example":"The clinic helps uninsured residents."}],"note":""},{"type":"question","num":105,"qtype":"an obvious truth","star":false,"sentence":"It is an obvious <u>______</u> that when employees are doing something they enjoy, they do it better.","zh":"這是一個顯而易見的事實：員工從事自己喜歡的工作時，會做得更好。","options":["truthful","truth","true","truly"],"answer":1,"rule":"冠詞 an + 形容詞 obvious + 名詞 truth。","explanation":"truth 是名詞，可受 obvious 修飾並由 that 子句說明內容。","vocab":[{"word":"obvious","meaning":"adj. 明顯的","example":"There is an obvious difference."},{"word":"truth","meaning":"n. 事實；真相","example":"Please tell the truth."},{"word":"enjoy","meaning":"v. 喜歡","example":"She enjoys working here."}],"note":""},{"type":"question","num":106,"qtype":"hold someone up","star":true,"sentence":"The huge traffic jam on the 3rd Ave. <u>______</u> us up for almost one hour.","zh":"第三大道上的嚴重塞車耽擱了我們將近一個小時。","options":["held","delayed","postponed","made"],"answer":0,"rule":"hold + 人 + up＝耽擱某人。","explanation":"held 與 us up 組成過去式片語，表示耽擱。","vocab":[{"word":"traffic jam","meaning":"n. 塞車","example":"We were stuck in a traffic jam."},{"word":"hold up","meaning":"phr.v. 耽擱","example":"The inspection held us up."},{"word":"postpone","meaning":"v. 延期","example":"They postponed the meeting."}],"note":""},{"type":"question","num":107,"qtype":"wish + had p.p.","star":true,"sentence":"Mary wished she <u>______</u> Jack’s suggestions about preparing for the job interview.","zh":"Mary 希望自己當時有聽從 Jack 對準備求職面試所提出的建議。","options":["have been following","had followed","will follow","be following"],"answer":1,"rule":"wish + had p.p. 表示對過去未發生之事的遺憾。","explanation":"had followed 符合對過去未發生行為表示遺憾的結構。","vocab":[{"word":"suggestion","meaning":"n. 建議","example":"We followed her suggestion."},{"word":"prepare","meaning":"v. 準備","example":"She prepared for the interview."},{"word":"interview","meaning":"n./v. 面試","example":"He has a job interview."}],"note":""},{"type":"question","num":108,"qtype":"but・轉折","star":false,"sentence":"Mr. Harrison planned to fly to New York last week for a conference, <u>______</u> the flight was cancelled 24 hours before he traveled.","zh":"Harrison 先生上週原本計畫搭機前往紐約參加會議，但是班機在他出發前二十四小時被取消了。","options":["therefore","hence","as long as","but"],"answer":3,"rule":"前後為預期與實際相反的轉折，使用 but。","explanation":"but 正確連接預期計畫與相反的實際狀況。","vocab":[{"word":"conference","meaning":"n. 會議","example":"She attended a conference."},{"word":"cancel","meaning":"v. 取消","example":"The airline canceled the flight."},{"word":"travel","meaning":"v. 旅行","example":"He travels for work."}],"note":""},{"type":"question","num":109,"qtype":"aside from V-ing","star":true,"sentence":"<u>______</u> from teaching at Roman College, Dr. Marco also consults for different organizations.","zh":"除了在 Roman College 任教之外，Marco 博士也為不同組織擔任顧問。","options":["Additionally","Aside","Not only","As well"],"answer":1,"rule":"aside from + N/V-ing＝除了……之外。","explanation":"Aside 與 from 組成固定片語，結構及添加語意皆正確。","vocab":[{"word":"aside","meaning":"adv. 在一旁","example":"Aside from cost, the plan is good."},{"word":"consult","meaning":"v. 擔任顧問；諮詢","example":"He consults for several firms."},{"word":"organization","meaning":"n. 組織","example":"She works for a nonprofit organization."}],"note":""},{"type":"question","num":110,"qtype":"after・時間順序","star":false,"sentence":"The damage to the road was caused by flooding <u>______</u> a heavy storm.","zh":"道路的損壞是由一場暴風雨過後的淹水所造成的。","options":["when","prior to","before","after"],"answer":3,"rule":"依事件順序選 after：storm → flooding → damage。","explanation":"after 正確標示暴風雨在先、淹水在後。","vocab":[{"word":"damage","meaning":"n. 損害","example":"The storm caused road damage."},{"word":"flooding","meaning":"n. 淹水","example":"Heavy rain caused flooding."},{"word":"prior to","meaning":"prep. 在……之前","example":"Please arrive prior to noon."}],"note":""},{"type":"question","num":111,"qtype":"purpose is to V","star":false,"sentence":"The purpose of this one-week intensive workshop is <u>______</u> negotiation skills.","zh":"這場為期一週的密集工作坊旨在探討談判技巧。","options":["to exploring","explore","to explored","to explore"],"answer":3,"rule":"The purpose is to + 原形動詞。","explanation":"to explore 是完整不定詞，可說明工作坊目的。","vocab":[{"word":"purpose","meaning":"n. 目的","example":"What is the purpose of the meeting?"},{"word":"intensive","meaning":"adj. 密集的","example":"They received intensive training."},{"word":"negotiation","meaning":"n. 談判","example":"Managers need negotiation skills."}],"note":""},{"type":"question","num":112,"qtype":"encourage 人 to V","star":true,"sentence":"My boss <u>______</u> us to share ideas with the team to create an environment of teamwork.","zh":"我的老闆鼓勵我們與團隊分享想法，以營造團隊合作的環境。","options":["encourages","accomplishes","recognizes","interviews"],"answer":0,"rule":"encourage + 人 + to V。","explanation":"encourages 在結構與「主管鼓勵員工」的語意上都成立。","vocab":[{"word":"encourage","meaning":"v. 鼓勵","example":"We encourage staff to apply."},{"word":"accomplish","meaning":"v. 完成","example":"The team accomplished its goal."},{"word":"teamwork","meaning":"n. 團隊合作","example":"The activity promotes teamwork."}],"note":""},{"type":"question","num":113,"qtype":"run out of","star":true,"sentence":"Have you noticed that some people never seem to <u>______</u> new ideas, plans, or things to say?","zh":"你是否注意到，有些人似乎永遠不會用盡新點子、新計畫或想說的事情？","options":["put up with","wait for","run out of","take on"],"answer":2,"rule":"run out of + 名詞＝用完、耗盡。","explanation":"never run out of ideas 自然表達創意源源不絕。","vocab":[{"word":"notice","meaning":"v. 注意到","example":"I noticed that sales increased."},{"word":"seem","meaning":"v. 似乎","example":"The plan seems to work."},{"word":"idea","meaning":"n. 想法","example":"She came up with an idea."}],"note":""},{"type":"question","num":114,"qtype":"make use of","star":false,"sentence":"Careers that <u>______</u> high idea flow include advertising, sales, fiction writing, and the hospitality industry.","zh":"會大量運用創意流動的職業包括廣告、銷售、小說寫作及餐旅業。","options":["apply for","come up with","make use of","get used to"],"answer":2,"rule":"make use of＝利用；檢查主詞 careers 與受詞 idea flow。","explanation":"職業「運用」大量創意的語意與搭配最自然。","vocab":[{"word":"career","meaning":"n. 職業；職涯","example":"She pursued a career in sales."},{"word":"fiction","meaning":"n. 小說；虛構作品","example":"She teaches fiction writing."},{"word":"hospitality","meaning":"n. 餐旅接待業","example":"Tourism supports hospitality."}],"note":""},{"type":"question","num":115,"qtype":"challenge traditional thinking","star":false,"sentence":"Paul always comes out with original ideas and <u>______</u> the traditional way of thinking about things.","zh":"Paul 總是提出原創想法，並挑戰看待事物的傳統思考方式。","options":["challenges","welcomes","practices","communicates"],"answer":0,"rule":"challenge the traditional way；original 與 traditional 形成對照。","explanation":"challenges 與原創想法的語境一致，且自然搭配 traditional way。","vocab":[{"word":"original","meaning":"adj. 原創的","example":"She proposed an original idea."},{"word":"challenge","meaning":"v./n. 挑戰","example":"The report challenges assumptions."},{"word":"traditional","meaning":"adj. 傳統的","example":"They changed the traditional method."}],"note":""},{"type":"question","num":116,"qtype":"promptly・動詞後副詞","star":true,"sentence":"After the business trip, Susan made sure she claimed her expenses <u>______</u>.","zh":"出差結束後，Susan 確保自己迅速申報了費用。","options":["economically","promptly","attentively","surprisingly"],"answer":1,"rule":"副詞修飾動詞 claimed，表示迅速申報費用；economically 是被 expenses 的金錢字面意思誤導的陷阱。","explanation":"promptly 最符合出差後盡快申報費用的商務情境。","vocab":[{"word":"business trip","meaning":"n. 出差","example":"She returned from a business trip."},{"word":"claim","meaning":"v. 申報；索取","example":"She claimed her travel expenses."},{"word":"promptly","meaning":"adv. 迅速地","example":"Please respond promptly."}],"note":""},{"type":"question","num":117,"qtype":"manageable tasks","star":true,"sentence":"Our marketing director is effective at turning big ideas into <u>______</u> tasks that can be achieved.","zh":"我們的行銷總監很擅長將宏大的構想轉化為可以完成的任務。","options":["managing","manageable","manager","management"],"answer":1,"rule":"形容詞 manageable 修飾 tasks；turn A into B。","explanation":"manageable 是形容詞，表示任務可被處理與完成。","vocab":[{"word":"director","meaning":"n. 主管","example":"She is the marketing director."},{"word":"manageable","meaning":"adj. 可處理的","example":"Divide the work into manageable tasks."},{"word":"achieve","meaning":"v. 達成","example":"We achieved our goal."}],"note":""},{"type":"question","num":118,"qtype":"perform–produce–fill","star":true,"sentence":"The whole point of working is to perform a function, <u>______</u> a specific result, or fill a particular role.","zh":"工作的整體意義在於履行功能、產生特定成果，或扮演特定角色。","options":["produced","producing","product","produce"],"answer":3,"rule":"平行結構：to perform, produce, or fill。","explanation":"produce 與 perform、fill 形式平行並共用 to。","vocab":[{"word":"perform","meaning":"v. 執行；發揮","example":"The device performs a function."},{"word":"produce","meaning":"v. 產生","example":"The campaign produced results."},{"word":"role","meaning":"n. 角色","example":"She fills an important role."}],"note":""},{"type":"question","num":119,"qtype":"promote harmony","star":false,"sentence":"Mr. Chen is always supportive of other colleagues’ efforts and tries to promote <u>______</u> and reduce conflict.","zh":"Chen 先生總是支持其他同事的努力，並試圖促進和諧、減少衝突。","options":["conference","harmony","security","awareness"],"answer":1,"rule":"promote harmony 與 reduce conflict 形成反義對照。","explanation":"harmony 與 conflict 形成清楚反義，且 promote harmony 是自然搭配。","vocab":[{"word":"supportive","meaning":"adj. 支持的","example":"Managers are supportive of staff."},{"word":"harmony","meaning":"n. 和諧","example":"The teams work in harmony."},{"word":"conflict","meaning":"n./v. 衝突","example":"Clear rules reduce conflict."}],"note":""},{"type":"question","num":120,"qtype":"attract customers","star":true,"sentence":"Service firms can increase market share three ways: <u>______</u> new customers, retain existing customers, and reduce customer attrition.","zh":"服務業公司可以透過三種方式提高市場占有率：吸引新顧客、留住現有顧客，以及降低顧客流失率。","options":["promote","motivate","attract","encourage"],"answer":2,"rule":"attract new customers；與 retain、reduce 平行。","explanation":"attract new customers 是固定商務搭配，且與後兩項策略一致。","vocab":[{"word":"market share","meaning":"n. 市占率","example":"The firm increased market share."},{"word":"retain","meaning":"v. 留住","example":"Good service retains customers."},{"word":"attrition","meaning":"n. 流失","example":"The plan reduced customer attrition."}],"note":""},{"type":"question","num":121,"qtype":"enable 人 to V","star":true,"sentence":"Good communication skills will enable team members <u>______</u> together and achieve the team’s shared goals.","zh":"良好的溝通技巧能使團隊成員共同合作，並達成團隊的共同目標。","options":["to works","to work","working","worked"],"answer":1,"rule":"enable + 人 + to V；work 與 achieve 平行。","explanation":"to work 完成 enable someone to V 並維持平行。","vocab":[{"word":"communication","meaning":"n. 溝通","example":"Communication improves teamwork."},{"word":"enable","meaning":"v. 使能夠","example":"The tool enables remote work."},{"word":"achieve","meaning":"v. 達成","example":"We achieved our goals."}],"note":""},{"type":"summary","title":"答案速查｜101–110","subtitle":"依原題號排列","content":"<div class=\"table-wrap\"><table class=\"summary-table\"><tr><th>題號</th><th>答案</th><th>證據焦點</th></tr><tr><td>101</td><td>A</td><td>A as well as B；creating 與 deciding 兩個 V-ing 片語平行。</td></tr><tr><td>102</td><td>D</td><td>have no choice but to V＝只能做某事。</td></tr><tr><td>103</td><td>A</td><td>介系詞 for 後接 V-ing；celebrate 直接接受詞。</td></tr><tr><td>104</td><td>D</td><td>所有格關係代名詞 whose + 名詞。</td></tr><tr><td>105</td><td>B</td><td>冠詞 an + 形容詞 obvious + 名詞 truth。</td></tr><tr><td>106</td><td>A</td><td>hold + 人 + up＝耽擱某人。</td></tr><tr><td>107</td><td>B</td><td>wish + had p.p. 表示對過去未發生之事的遺憾。</td></tr><tr><td>108</td><td>D</td><td>前後為預期與實際相反的轉折，使用 but。</td></tr><tr><td>109</td><td>B</td><td>aside from + N/V-ing＝除了……之外。</td></tr><tr><td>110</td><td>D</td><td>依事件順序選 after：storm → flooding → damage。</td></tr></table></div>"},{"type":"summary","title":"答案速查｜111–121","subtitle":"依原題號排列","content":"<div class=\"table-wrap\"><table class=\"summary-table\"><tr><th>題號</th><th>答案</th><th>證據焦點</th></tr><tr><td>111</td><td>D</td><td>The purpose is to + 原形動詞。</td></tr><tr><td>112</td><td>A</td><td>encourage + 人 + to V。</td></tr><tr><td>113</td><td>C</td><td>run out of + 名詞＝用完、耗盡。</td></tr><tr><td>114</td><td>C</td><td>make use of＝利用；檢查主詞 careers 與受詞 idea flow。</td></tr><tr><td>115</td><td>A</td><td>challenge the traditional way；original 與 traditional 形成對照。</td></tr><tr><td>116</td><td>B</td><td>副詞修飾動詞 claimed，表示迅速申報費用；economically 是被 expenses 的金錢字面意思誤導的陷阱。</td></tr><tr><td>117</td><td>B</td><td>形容詞 manageable 修飾 tasks；turn A into B。</td></tr><tr><td>118</td><td>D</td><td>平行結構：to perform, produce, or fill。</td></tr><tr><td>119</td><td>B</td><td>promote harmony 與 reduce conflict 形成反義對照。</td></tr><tr><td>120</td><td>C</td><td>attract new customers；與 retain、reduce 平行。</td></tr><tr><td>121</td><td>B</td><td>enable + 人 + to V；work 與 achieve 平行。</td></tr></table></div>"}];
let current=0,revealed=false,zhVisible=false;const TOTAL=slides.length;
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleZh(){zhVisible=!zhVisible;applyZh();const b=document.getElementById('zh-btn');b.textContent=zhVisible?'中文 ON':'中文 OFF';b.classList.toggle('on',zhVisible)}
function applyZh(){document.querySelectorAll('.zh-target').forEach(el=>el.classList.toggle('zh-hidden',!zhVisible))}
function render(){const s=slides[current];revealed=false;document.getElementById('progress-text').textContent=(current+1)+' / '+TOTAL;document.getElementById('progress-bar').style.width=Math.round((current+1)/TOTAL*100)+'%';document.getElementById('prev-btn').disabled=current===0;document.getElementById('next-btn').disabled=current===TOTAL-1;document.getElementById('slide-type-label').textContent=s.type==='question'?'PART 5 練習題':s.type==='summary'?'LESSON SUMMARY':'LESSON OVERVIEW';document.getElementById('reveal-btn').classList.toggle('hidden',s.type!=='question');const el=document.getElementById('slide-content');
if(s.type!=='question'){el.innerHTML='<div class="slide-label">Lesson 12 · Mode A</div><div class="slide-title">'+s.title+'</div><div class="slide-sub">'+s.subtitle+'</div>'+s.content}else{const opts=s.options.map((o,i)=>'<div class="q-opt" id="opt-'+i+'"><span class="q-opt-lbl">'+String.fromCharCode(65+i)+'</span>'+esc(o)+'</div>').join('');const vocab=s.vocab.map(v=>'<div class="vocab-row"><span class="vocab-word">'+esc(v.word)+'</span><span class="vocab-meaning">'+esc(v.meaning)+'</span><span class="vocab-example">'+esc(v.example)+'</span></div>').join('');el.innerHTML='<div class="q-header"><span class="q-num">Q'+s.num+'</span>'+(s.star?'<span class="q-star">⭐ 重點題</span>':'')+'</div><div class="q-sentence">'+s.sentence+'</div><div class="q-zh zh-target">'+esc(s.zh)+'</div><div class="q-opts">'+opts+'</div><div class="key-reveal" id="key-reveal"><div class="answer-line">答案 '+String.fromCharCode(65+s.answer)+'：'+esc(s.options[s.answer])+'</div><div class="rule-line">核心規則｜'+esc(s.rule)+'</div><div class="explain-line">'+esc(s.explanation)+'</div>'+(s.note?'<div class="source-note">※ '+esc(s.note)+'</div>':'')+vocab+'</div>'}applyZh();resetRevealBtn();document.getElementById('slide-area').scrollTop=0}
function resetRevealBtn(){const b=document.getElementById('reveal-btn');b.textContent='揭曉答案 ▼';b.style.background='';b.style.color=''}
function reveal(){const s=slides[current];if(s.type!=='question')return;const b=document.getElementById('reveal-btn');revealed=!revealed;s.options.forEach((_,i)=>{const e=document.getElementById('opt-'+i);e.classList.toggle('correct',revealed&&i===s.answer);e.classList.toggle('dimmed',revealed&&i!==s.answer)});document.getElementById('key-reveal').classList.toggle('show',revealed);if(revealed){b.textContent='隱藏答案 ▲';b.style.background='rgba(5,150,105,.25)';b.style.color='#34D399'}else resetRevealBtn()}
function navigate(dir){current=Math.max(0,Math.min(TOTAL-1,current+dir));render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();navigate(1)}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();navigate(-1)}else if(e.key===' '||e.key==='Enter'){e.preventDefault();reveal()}else if(e.key.toLowerCase()==='z')toggleZh()});render();
</script></body></html>
