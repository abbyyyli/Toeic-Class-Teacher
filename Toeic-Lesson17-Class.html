n-top:7px;font-size:12px}.vocab-word{font-family:"JetBrains Mono",monospace;color:#34D399;font-weight:700}.vocab-meaning{color:rgba(255,255,255,.55)}.vocab-example{color:rgba(255,255,255,.42)}

<script>const slides=[{"type": "overview", "title": "Lesson 17｜主動詞一致", "subtitle": "Mode B · 文法課本 · Chapter 8", "content": "<div class='hero-grid'><div class='hero-card'><b>10<\/b><span>個文法小節<\/span><\/div><div class='hero-card'><b>20<\/b><span>題課本題<\/span><\/div><div class='hero-card'><b>30<\/b><span>題新增混合題<\/span><\/div><\/div><div class='g-formula'>先找真正主詞 → 判斷單複數規則 → 再看時態與語態<\/div><div class='g-note'>按左右方向鍵換頁；按 Z 顯示／隱藏中文；空白鍵揭曉／收回答案。Quick Practice 每按一次揭曉一題。<\/div>"}, {"type": "overview", "title": "三套規則", "subtitle": "今天每一題都屬於其中一套", "content": "<div class='step-grid'><div class='step'><b>1<\/b><span>主詞決定<\/span><small>刪掉修飾語，看核心主詞<\/small><\/div><div class='step'><b>2<\/b><span>靠近原則<\/span><small>or / nor / not only…but also / There is<\/small><\/div><div class='step'><b>3<\/b><span>看 of 後面<\/span><small>most / half / percent / the rest of<\/small><\/div><div class='step'><b>!<\/b><span>不需要一致<\/span><small>助動詞、過去式、suggest that + 原形<\/small><\/div><\/div>"}, {"type": "overview", "title": "Preview Test", "subtitle": "先測再教 · 3 題", "content": "<div class='g-note'>先不講規則，憑直覺作答。做完再進入小節 1。<\/div>"}, {"type": "question", "num": "Preview 1", "label": "Preview 1", "sentence": "Teaching and learning _______ two very different things.", "options": ["are", "is", "been", "have"], "answer": 0, "zh": "教學和學習是兩件完全不同的事。", "zhq": "教學和學習 ____ 兩件完全不同的事。", "rule": "A and B → 複數", "explanation": "主詞是 Teaching and learning 兩件事，and 連接 → 複數", "vocab": [], "star": false}, {"type": "question", "num": "Preview 2", "label": "Preview 2", "sentence": "Children less than 10 years old _______ emotional needs.", "options": ["have been", "had had", "have", "has"], "answer": 2, "zh": "十歲以下的小孩有情感上的需求。", "zhq": "十歲以下的小孩 ____ 情感上的需求。", "rule": "複數主詞＋一般現在式", "explanation": "主詞 Children 是複數；描述一般事實用現在式", "vocab": [], "star": false}, {"type": "question", "num": "Preview 3", "label": "Preview 3", "sentence": "One of the common diseases affecting senior people _______ heart attack.", "options": ["with", "are", "be", "is"], "answer": 3, "zh": "影響老年人的常見疾病之一是心臟病發作。", "zhq": "影響老年人的常見疾病之一 ____ 心臟病發作。", "rule": "One of + 複數 → 單數", "explanation": "主詞是 One；of the common diseases 和 affecting senior people 都是修飾語", "vocab": [], "star": false}, {"type": "grammar", "sec": 1, "title": "哪些動詞需要一致？", "subtitle": "小節 1 · 只有四個位置要看主詞單複數", "content": "<table class='g-table'><tr><th>需要一致的位置<\/th><th>單數主詞<\/th><th>複數主詞<\/th><\/tr><tr><td>現在簡單式一般動詞<\/td><td><span class='cell-em'>works / goes / studies<\/span><\/td><td><span class='cell-em'>work / go / study<\/span><\/td><\/tr><tr><td>be 動詞（現在／過去）<\/td><td><span class='cell-em'>is / was<\/span><\/td><td><span class='cell-em'>are / were<\/span><\/td><\/tr><tr><td>have（完成式、當動詞）<\/td><td><span class='cell-em'>has<\/span><\/td><td><span class='cell-em'>have<\/span><\/td><\/tr><tr><td>助動詞 do<\/td><td><span class='cell-em'>does / doesn’t<\/span><\/td><td><span class='cell-em'>do / don’t<\/span><\/td><\/tr><\/table><table class='g-table'><tr><th>不需要一致<\/th><th>例子<\/th><\/tr><tr><td>過去式（be 除外）<\/td><td>He <b>worked<\/b> / They <b>worked<\/b><\/td><\/tr><tr><td>情態助動詞 + 原形<\/td><td>He <b>can go<\/b> / They <b>can go<\/b><\/td><\/tr><tr><td>will / had<\/td><td>He <b>will go<\/b> / They <b>had left<\/b><\/td><\/tr><\/table><div class='g-note'>you 就算只指一個人，也用 are / were。不說 you was。<\/div>"}, {"type": "grammar", "sec": 1, "title": "第三人稱單數 -s 的拼字", "subtitle": "小節 1 · 現在式＋單數主詞 → 動詞加 -s / -es / -ies", "content": "<table class='g-table'><tr><th>字尾<\/th><th>規則<\/th><th>例子<\/th><\/tr><tr><td>一般<\/td><td>加 -s<\/td><td>work → works<\/td><\/tr><tr><td>-s, -sh, -ch, -x, -o<\/td><td>加 -es<\/td><td>finish → finishes, go → goes<\/td><\/tr><tr><td>子音 + y<\/td><td>去 y 加 -ies<\/td><td>study → studies, apply → applies<\/td><\/tr><tr><td>母音 + y<\/td><td>加 -s<\/td><td>pay → pays<\/td><\/tr><tr><td>不規則<\/td><td>特別記<\/td><td>have → has, do → does<\/td><\/tr><\/table><div class='g-ex-box'><div class='g-ex'>The meeting <b>begins<\/b> at 9 sharp.<span class='zh2 zh-target'>會議九點整開始。<\/span><\/div><div class='g-ex'>The manager <b>doesn’t<\/b> approve overtime on weekends.<span class='zh2 zh-target'>經理不核准週末加班。<\/span><\/div><div class='g-ex'>The CEO <b>will announce<\/b> the results tomorrow.<span class='zh2 zh-target'>執行長明天會公布結果。（will 不需一致）<\/span><\/div><\/div>"}, {"type": "question", "num": "p.134 題目①", "label": "p.134 題目①", "sentence": "Studying in the U.S. _______ one of my long-term goals.", "options": ["will", "are", "is", "has"], "answer": 2, "zh": "去美國留學是我的長期目標之一。", "zhq": "去美國留學 ____ 我的長期目標之一。", "rule": "動名詞主詞 → 單數", "explanation": "Studying in the U.S. 是一件事 → 單數", "vocab": [], "star": false}, {"type": "practice", "title": "Quick Practice 1｜一致的基本系統", "subtitle": "小節 1 · 括號內動詞改成正確形式", "items": [["The new printer ___ (print) 40 pages per minute.", "prints", "一般事實用現在式，printer 是單數", "新印表機每分鐘可以印 40 頁。"], ["Our customers ___ (not / like) long waiting times.", "don't like", "複數主詞配 don't；不能用 doesn't", "我們的顧客不喜歡等很久。"], ["The receptionist ___ (finish) work at six every day.", "finishes", "-sh 結尾要加 -es", "接待員每天六點下班。"], ["The interns ___ (attend) a training session last Monday.", "attended", "過去式不分單複數；時間線索是 last Monday", "實習生上週一參加了培訓課程。"], ["The department ___ (have) three new employees this year.", "has", "have 當動詞時也要一致", "這個部門今年有三位新員工。"]]}, {"type": "grammar", "sec": 2, "title": "三步找主詞法", "subtitle": "小節 2 · 動詞只跟「核心主詞」一致", "content": "<div class='g-formula'>① 找第一個沒被介系詞帶著的名詞　② 括掉修飾語　③ 看核心主詞<\/div><table class='g-table'><tr><th>修飾語<\/th><th>例子（括號內刪掉）<\/th><th>動詞<\/th><\/tr><tr><td>介系詞片語<\/td><td>The list (of approved suppliers)<\/td><td><span class='cell-em'>is<\/span><\/td><\/tr><tr><td>分詞片語<\/td><td>The documents (attached to this e-mail)<\/td><td><span class='cell-em'>are<\/span><\/td><\/tr><tr><td>關係子句<\/td><td>The employee (who trained the interns)<\/td><td><span class='cell-em'>is<\/span><\/td><\/tr><tr><td>同位語<\/td><td>Taipei 101, (one of the world’s famous skyscrapers),<\/td><td><span class='cell-em'>is<\/span><\/td><\/tr><\/table><div class='g-highlight'>TOEIC 常故意把一個單複數相反的名詞放在空格正前方：The reports from the regional office ___ → are<\/div>"}, {"type": "grammar", "sec": 2, "title": "插入語：與「前者」一致", "subtitle": "小節 2 · 課本要點六｜A + 插入語 + B → 看 A", "content": "<table class='g-table'><tr><th>片語<\/th><th>中文<\/th><th>例句<\/th><\/tr><tr><td><span class='cell-em'>A with B<\/span><\/td><td>A 連同 B<\/td><td>Mr. Jones with his secretary <b>is<\/b> going.<\/td><\/tr><tr><td><span class='cell-em'>A, together with B,<\/span><\/td><td>A 連同 B<\/td><td>Ms. Smith, together with her staff, <b>is<\/b> flying to Chicago.<\/td><\/tr><tr><td><span class='cell-em'>A, along with B,<\/span><\/td><td>A 和 B<\/td><td>Jack, along with his two brothers, <b>is<\/b> going.<\/td><\/tr><tr><td><span class='cell-em'>A, accompanied by B,<\/span><\/td><td>A 由 B 陪同<\/td><td>The CEO, accompanied by his assistant, <b>is<\/b> here.<\/td><\/tr><tr><td><span class='cell-em'>A, including B,<\/span><\/td><td>A 包括 B<\/td><td>The house, including the basement, <b>is<\/b> damaged.<\/td><\/tr><tr><td><span class='cell-em'>A as well as B<\/span><\/td><td>A 以及 B<\/td><td>My boss as well as other specialists <b>is<\/b> joining us.<\/td><\/tr><tr><td><span class='cell-em'>A besides B<\/span><\/td><td>除了 B 還有 A<\/td><td>The teacher besides other children <b>is<\/b> singing.<\/td><\/tr><\/table><div class='g-note'>看到被逗號夾起來的片語，先把它括掉。<\/div>"}, {"type": "grammar", "sec": 2, "title": "A and B ≠ A with B", "subtitle": "小節 2 · 只有 and 會讓主詞變複數", "content": "<table class='g-table'><tr><th>句子<\/th><th>主詞<\/th><th>動詞<\/th><\/tr><tr><td>The manager <b>and<\/b> his assistant ___ here.<\/td><td>manager + assistant<\/td><td><span class='cell-em'>are<\/span><\/td><\/tr><tr><td>The manager <b>with<\/b> his assistant ___ here.<\/td><td>manager<\/td><td><span class='cell-em'>is<\/span><\/td><\/tr><tr><td>The manager, <b>as well as<\/b> his assistant, ___ here.<\/td><td>manager<\/td><td><span class='cell-em'>is<\/span><\/td><\/tr><\/table><div class='g-ex-box'><div class='g-ex'>My parents, accompanied by my brother, <b>are<\/b> traveling to Japan.<span class='zh2 zh-target'>我爸媽在我哥哥陪同下要去日本旅遊。（A 是複數 → are）<\/span><\/div><div class='g-ex'>The price of these laptops <b>is<\/b> too high.<span class='zh2 zh-target'>這些筆電的價格太高了。<\/span><\/div><\/div>"}, {"type": "question", "num": "p.142 題目①", "label": "p.142 題目①", "sentence": "All sales managers, including the assistant, _______ supposed to attend the review meeting.", "options": ["is", "are", "will", "have"], "answer": 1, "zh": "所有業務經理（包括助理）都應該參加審查會議。", "zhq": "所有業務經理（包括助理）都 ____ 參加審查會議。", "rule": "A, including B, → 看 A", "explanation": "核心主詞 All sales managers → 複數", "vocab": [], "star": false}, {"type": "question", "num": "CH8 總複習 Q2", "label": "CH8 總複習 Q2", "sentence": "Mr. Williams as well as his partners _______ to be blamed for the mistake.", "options": ["has been", "is", "are", "were"], "answer": 1, "zh": "威廉斯先生和他的夥伴都應為此錯誤受到譴責。", "zhq": "威廉斯先生和他的夥伴都 ____ 為此錯誤受到譴責。", "rule": "A as well as B → 看 A", "explanation": "主詞是 Mr. Williams；be to + V 表「應該」", "vocab": [], "star": false}, {"type": "practice", "title": "Quick Practice 2｜找真正的主詞", "subtitle": "小節 2 · 括號內動詞改成正確形式", "items": [["The quality of the products ___ improved a lot this year.", "has", "主詞是 quality，不是 products", "產品的品質今年大幅提升。"], ["The keys to the storage room ___ kept at the front desk.", "are", "主詞是 keys；to the storage room 是修飾語", "儲藏室的鑰匙放在櫃台。"], ["The CEO, together with two vice presidents, ___ visiting our branch.", "is", "together with 是插入語，看 CEO", "執行長將與兩位副總一起參訪我們的分公司。"], ["The applicants who passed the first interview ___ invited to a second one last week.", "were", "關係子句 who passed… 要刪掉，主詞是 applicants", "通過第一次面試的應徵者上週受邀參加第二次面試。"], ["A box of old files ___ been left in the meeting room.", "has", "主詞是 box；of old files 是修飾語", "一箱舊文件被留在會議室裡。"]]}, {"type": "grammar", "sec": 3, "title": "單一事件主詞 → 單數", "subtitle": "小節 3 · 課本要點二｜主詞是「一件事」", "content": "<table class='g-table'><tr><th>主詞形式<\/th><th>例句<\/th><\/tr><tr><td>To + V<\/td><td><b>To see is<\/b> to believe.<\/td><\/tr><tr><td>V-ing<\/td><td><b>Dealing<\/b> with difficult customers <b>is<\/b> tiring.<\/td><\/tr><tr><td>that 子句<\/td><td><b>That the picnic was cancelled disappoints<\/b> the kids.<\/td><\/tr><tr><td>whether 子句<\/td><td><b>Whether Linda will be promoted is<\/b> undecided.<\/td><\/tr><tr><td>how / why 子句<\/td><td><b>How other people judge you is<\/b> not important.<\/td><\/tr><tr><td>what 子句<\/td><td><b>What we need is<\/b> more time.<\/td><\/tr><\/table><div class='g-note'>動名詞後面接複數名詞也不影響：<b>Mastering<\/b> two foreign languages <b>is<\/b> difficult.<\/div>"}, {"type": "grammar", "sec": 3, "title": "易混淆：V-ing 是主詞還是形容詞？", "subtitle": "小節 3 · 兩件事用 and → 複數", "content": "<table class='g-table'><tr><th>句子<\/th><th>主詞<\/th><th>動詞<\/th><\/tr><tr><td><b>Training<\/b> new staff ___ time.<\/td><td>Training（這件事）<\/td><td><span class='cell-em'>takes<\/span><\/td><\/tr><tr><td>Training <b>sessions<\/b> ___ held every Monday.<\/td><td>sessions<\/td><td><span class='cell-em'>are<\/span><\/td><\/tr><tr><td><b>Hiking and swimming<\/b> ___ my hobbies.<\/td><td>兩件事<\/td><td><span class='cell-em'>are<\/span><\/td><\/tr><\/table><div class='g-ex-box'><div class='g-ex'>Smoking <b>is<\/b> not allowed in this area.<span class='zh2 zh-target'>此區禁止吸菸。<\/span><\/div><div class='g-ex'>Updating the software regularly <b>helps<\/b> prevent problems.<span class='zh2 zh-target'>定期更新軟體有助於避免問題。<\/span><\/div><\/div>"}, {"type": "question", "num": "p.135 題目①", "label": "p.135 題目①", "sentence": "The importance of computer skills in high-tech occupations _______ obvious.", "options": ["had", "have been", "are", "is"], "answer": 3, "zh": "電腦技能對高科技工作的重要性是顯而易見的。", "zhq": "電腦技能對高科技工作的重要性 ____ 顯而易見的。", "rule": "介系詞片語不影響主詞", "explanation": "核心主詞是 importance", "vocab": [], "star": false}, {"type": "question", "num": "p.135 題目②", "label": "p.135 題目②", "sentence": "Smoking _______ not allowed in this area.", "options": ["been", "should", "being", "is"], "answer": 3, "zh": "此區禁止吸菸。", "zhq": "此區 ____ 吸菸。", "rule": "動名詞主詞＋被動", "explanation": "Smoking 是一件事 → 單數；is not allowed 是被動", "vocab": [], "star": false}, {"type": "practice", "title": "Quick Practice 3｜單一事件主詞", "subtitle": "小節 3 · 括號內動詞改成正確形式", "items": [["Hiring experienced engineers ___ (be) our top priority this year.", "is", "主詞是 Hiring 這件事", "聘請有經驗的工程師是我們今年的首要任務。"], ["To finish all these reports by Friday ___ (seem) impossible.", "seems", "To V 當主詞 → 單數", "要在週五前完成這些報告似乎不可能。"], ["What the clients asked for ___ (be) a lower price.", "was", "what 子句 → 單數；asked 提示過去", "客戶要求的是更低的價格。"], ["Training sessions for new staff ___ (be) held every Monday.", "are", "這裡 training 是修飾語，主詞是 sessions", "新員工訓練課程每週一舉行。"], ["Whether the store will open on Sunday ___ (depend) on the weather.", "depends", "whether 子句 → 單數", "商店週日是否營業取決於天氣。"]]}, {"type": "grammar", "sec": 4, "title": "each / every / one of → 單數", "subtitle": "小節 4 · 課本要點三", "content": "<table class='g-table'><tr><th>結構<\/th><th>例句<\/th><\/tr><tr><td><span class='cell-em'>One of + 複數<\/span><\/td><td><b>One of<\/b> my friends <b>works<\/b> in Tokyo.<\/td><\/tr><tr><td><span class='cell-em'>Each of + 複數<\/span><\/td><td><b>Each of<\/b> the employees <b>has<\/b> a laptop.<\/td><\/tr><tr><td><span class='cell-em'>Every + 單數<\/span><\/td><td><b>Every<\/b> boy and girl <b>needs<\/b> to participate.<\/td><\/tr><tr><td><span class='cell-em'>No + 單數<\/span><\/td><td><b>No<\/b> manager <b>was<\/b> present.<\/td><\/tr><tr><td><span class='cell-em'>everyone / nobody / everything<\/span><\/td><td><b>Everyone<\/b> in the two departments <b>has<\/b> the memo.<\/td><\/tr><\/table><div class='g-wrong-right'><span class='gw'>The teams each has a leader.<\/span><span class='gr'>The teams each have a leader.（主詞是 teams，each 只是副詞）<\/span><\/div>"}, {"type": "grammar", "sec": 4, "title": "the number of vs a number of", "subtitle": "小節 4 · TOEIC 高頻｜課本只教前半", "content": "<table class='g-table'><tr><th>結構<\/th><th>意思<\/th><th>動詞<\/th><th>例句<\/th><\/tr><tr><td><span class='cell-em'>The number of + 複數<\/span><\/td><td>……的數量（一個數字）<\/td><td><span class='cell-em'>單數<\/span><\/td><td>The number of attendees <b>is<\/b> about 3,000.<\/td><\/tr><tr><td><span class='cell-em'>A number of + 複數<\/span><\/td><td>許多……（＝many）<\/td><td><span class='cell-em'>複數<\/span><\/td><td>A number of attendees <b>are<\/b> from overseas.<\/td><\/tr><\/table><div class='g-highlight'>口訣：The number 是「數字」→ 單數；A number 是「很多」→ 複數。<\/div>"}, {"type": "grammar", "sec": 4, "title": "看起來複數，其實是單數", "subtitle": "小節 4 · 一個總量／字尾 -s 的單數名詞", "content": "<table class='g-table'><tr><th>類別<\/th><th>例句<\/th><\/tr><tr><td>時間<\/td><td>Seven hours of sleep <b>is<\/b> enough.<\/td><\/tr><tr><td>金錢<\/td><td>Twenty dollars <b>is<\/b> a reasonable price.<\/td><\/tr><tr><td>重量／距離<\/td><td>Five miles <b>is<\/b> too far to walk.<\/td><\/tr><tr><td>新聞<\/td><td>The news <b>is<\/b> really shocking.<\/td><\/tr><tr><td>國名／組織<\/td><td>The United States <b>has<\/b> over 330 million people.<\/td><\/tr><tr><td>學科 -ics<\/td><td>Physics / Economics / Statistics <b>is<\/b>…<\/td><\/tr><tr><td>單複同形<\/td><td>The company headquarters <b>is<\/b> in Singapore.<\/td><\/tr><\/table><div class='g-note'>statistics 指「統計數字」時是複數：The statistics <b>show<\/b> a rise in sales.<\/div>"}, {"type": "question", "num": "p.137 題目①", "label": "p.137 題目①", "sentence": "One of my brothers _______ working as an engineer in a software company.", "options": ["were", "be", "are", "is"], "answer": 3, "zh": "我一個弟弟目前在軟體公司當工程師。", "zhq": "我一個弟弟目前 ____ 在軟體公司當工程師。", "rule": "One of + 複數 → 單數＋進行式", "explanation": "主詞 One → 單數；is working 是現在進行式", "vocab": [], "star": false}, {"type": "question", "num": "p.137 題目②", "label": "p.137 題目②", "sentence": "One of the best job-searching strategies _______ networking.", "options": ["be", "are", "were", "is"], "answer": 3, "zh": "靠人脈介紹是找工作最好的策略之一。", "zhq": "靠人脈介紹 ____ 找工作最好的策略之一。", "rule": "One of the + 最高級 + 複數 → 單數", "explanation": "主詞 One", "vocab": [], "star": false}, {"type": "question", "num": "p.139 題目①", "label": "p.139 題目①", "sentence": "Arkansas _______ a really beautiful state in the U.S.", "options": ["have", "were", "is", "being"], "answer": 2, "zh": "阿肯色州是美國一個很漂亮的州。", "zhq": "阿肯色州 ____ 美國一個很漂亮的州。", "rule": "字尾 -s 的州名 → 單數", "explanation": "Arkansas 是一個州 → 單數", "vocab": [], "star": false}, {"type": "practice", "title": "Quick Practice 4｜單數主詞家族", "subtitle": "小節 4 · 括號內動詞改成正確形式", "items": [["Each of the branch managers ___ (be) responsible for hiring.", "is", "Each of + 複數名詞 → 單數", "每位分店經理都負責招聘。"], ["A number of passengers ___ (be) delayed by the storm yesterday.", "were", "A number of＝many → 複數", "昨天許多乘客因為暴風雨延誤了。"], ["Everyone in the sales team ___ (want) a bonus.", "wants", "everyone 永遠單數", "業務團隊的每個人都想要獎金。"], ["Three thousand dollars ___ (be) too much for a used car like this.", "is", "金額看成一筆 → 單數", "這種二手車要三千美元太貴了。"], ["Economics ___ (be) the most popular course at our college.", "is", "-ics 學科 → 單數", "經濟學是我們學院最熱門的課。"]]}, {"type": "grammar", "sec": 5, "title": "A and B → 複數（與例外）", "subtitle": "小節 5 · 課本要點四", "content": "<table class='g-table'><tr><th>句子<\/th><th>動詞<\/th><th>原因<\/th><\/tr><tr><td>The CEO and his secretary ___ attending.<\/td><td><span class='cell-em'>are<\/span><\/td><td>兩個人<\/td><\/tr><tr><td><b>The<\/b> CEO and founder ___ giving a speech.<\/td><td><span class='cell-em'>is<\/span><\/td><td>只有一個 the → 同一人<\/td><\/tr><tr><td>Bread and butter ___ my usual breakfast.<\/td><td><span class='cell-em'>is<\/span><\/td><td>固定搭配，看成一樣東西<\/td><\/tr><tr><td><b>Every<\/b> boy and girl ___ a seat.<\/td><td><span class='cell-em'>needs<\/span><\/td><td>every 讓整體變單數<\/td><\/tr><\/table><div class='g-ex-box'><div class='g-ex'>Many of my friends <b>work<\/b> in Tokyo.<span class='zh2 zh-target'>我很多朋友在東京工作。<\/span><\/div><div class='g-ex'>All team members <b>need<\/b> to join the discussion.<span class='zh2 zh-target'>所有同仁都要參與討論。<\/span><\/div><\/div>"}, {"type": "grammar", "sec": 5, "title": "集合名詞與恆為複數的名詞", "subtitle": "小節 5 · TOEIC 以美式為主", "content": "<table class='g-table'><tr><th>類別<\/th><th>例字<\/th><th>動詞<\/th><\/tr><tr><td>一定複數<\/td><td>people, police, personnel, cattle<\/td><td><span class='cell-em'>are<\/span><\/td><\/tr><tr><td>一定複數<\/td><td>goods, earnings, savings, belongings, clothes<\/td><td><span class='cell-em'>are<\/span><\/td><\/tr><tr><td>the + adj.<\/td><td>the elderly, the rich, the unemployed<\/td><td><span class='cell-em'>are<\/span><\/td><\/tr><tr><td>整體視為單數（美式）<\/td><td>team, staff, committee, company, family<\/td><td><span class='cell-em'>is ＋ its<\/span><\/td><\/tr><tr><td>不可數 → 單數<\/td><td>information, equipment, furniture, advice<\/td><td><span class='cell-em'>is<\/span><\/td><\/tr><\/table><div class='g-note'>課本把 family、audience、class 教成複數，是英式用法。TOEIC 看到 committee、company，優先選單數＋its。<\/div>"}, {"type": "question", "num": "p.139 題目②", "label": "p.139 題目②", "sentence": "At the airport, most hotels _______ shuttle service.", "options": ["offered", "offering", "offers", "offer"], "answer": 3, "zh": "多數飯店都在機場設有接駁服務。", "zhq": "多數飯店都在機場 ____ 接駁服務。", "rule": "複數主詞＋一般現在式", "explanation": "most hotels 是複數", "vocab": [], "star": false}, {"type": "practice", "title": "Quick Practice 5｜複數主詞家族", "subtitle": "小節 5 · 括號內動詞改成正確形式", "items": [["The manager and the accountant ___ (be) meeting the client today.", "are", "兩個 the → 兩個人", "經理和會計今天要和客戶開會。"], ["The police ___ (be) looking for the missing car.", "are", "police 永遠複數", "警方正在尋找失蹤的車。"], ["The new equipment ___ (arrive) yesterday.", "arrived", "過去式不需一致；equipment 不可數", "新設備昨天送到了。"], ["The elderly ___ (need) easy access to public transportation.", "need", "the + adj. → 一群人 → 複數", "老年人需要方便的大眾運輸。"], ["Our company's earnings ___ (rise) steadily over the past three years.", "have risen", "earnings 恆為複數；over the past three years → 現在完成式", "我們公司的收益在過去三年穩定成長。"]]}, {"type": "overview", "title": "休息 10 分鐘", "subtitle": "Break", "content": "<div class='g-note'>下半場：There is/are、靠近原則、部分詞、關係子句、混合解題。<\/div>"}, {"type": "grammar", "sec": 6, "title": "There is / are：往後找主詞", "subtitle": "小節 6 · 課本要點四擴充", "content": "<table class='g-table'><tr><th>句子<\/th><th>真正主詞<\/th><th>動詞<\/th><\/tr><tr><td>There ___ a manager in the room.<\/td><td>a manager<\/td><td><span class='cell-em'>is<\/span><\/td><\/tr><tr><td>There ___ ten managers in the room.<\/td><td>ten managers<\/td><td><span class='cell-em'>are<\/span><\/td><\/tr><tr><td>There ___ a boy and a girl in the class.<\/td><td>a boy（靠近）<\/td><td><span class='cell-em'>is<\/span><\/td><\/tr><tr><td>There ___ two nurses and a doctor here.<\/td><td>two nurses（靠近）<\/td><td><span class='cell-em'>are<\/span><\/td><\/tr><\/table><div class='g-note'>兩個以上主詞時，課本依「靠近原則」：跟最靠近動詞的那個一致。<\/div>"}, {"type": "grammar", "sec": 6, "title": "其他倒裝：商務書信高頻", "subtitle": "小節 6 · 動詞在前，主詞在後", "content": "<table class='g-table'><tr><th>句型<\/th><th>例句<\/th><\/tr><tr><td><span class='cell-em'>Attached is / are<\/span><\/td><td><b>Attached are<\/b> the documents you requested.<\/td><\/tr><tr><td><span class='cell-em'>Enclosed is / are<\/span><\/td><td><b>Enclosed are<\/b> two tickets for the show.<\/td><\/tr><tr><td><span class='cell-em'>Here is / are<\/span><\/td><td><b>Here are<\/b> the brochures you asked for.<\/td><\/tr><tr><td><span class='cell-em'>Among + 複數 + is<\/span><\/td><td><b>Among<\/b> the speakers <b>is<\/b> a famous economist.<\/td><\/tr><\/table><div class='g-highlight'>Among the speakers is… 最容易錯：真正主詞是後面的 a famous economist。<\/div><div class='g-ex-box'><div class='g-ex'>There <b>have been<\/b> many changes since 2020.<span class='zh2 zh-target'>自 2020 年以來有很多改變。<\/span><\/div><\/div>"}, {"type": "practice", "title": "Quick Practice 6｜There is/are 與倒裝句", "subtitle": "小節 6 · 括號內動詞改成正確形式", "items": [["There ___ (be) a lot of traffic on the highway this morning.", "was", "traffic 不可數 → 單數；this morning 已過", "今天早上高速公路車很多。"], ["Attached ___ (be) the invoices for March and April.", "are", "真正主詞是 invoices", "附上三月和四月的發票。"], ["There ___ (be) several changes to the schedule since last week.", "have been", "since → 現在完成；changes 複數", "自上週以來，時程有好幾處改變。"], ["Among the guests ___ (be) the mayor of the city.", "is", "真正主詞是 the mayor", "賓客中包括市長。"], ["Here ___ (be) the key to your hotel room.", "is", "真正主詞是 the key", "這是您飯店房間的鑰匙。"]]}, {"type": "grammar", "sec": 7, "title": "靠近原則：跟最近的主詞一致", "subtitle": "小節 7 · 課本要點五", "content": "<table class='g-table'><tr><th>連接詞<\/th><th>跟誰一致<\/th><th>例句<\/th><\/tr><tr><td><span class='cell-em'>A or B<\/span><\/td><td>B<\/td><td>One or two days <b>are<\/b> enough.<\/td><\/tr><tr><td><span class='cell-em'>either A or B<\/span><\/td><td>B<\/td><td>Either Mr. Jones or his members <b>are<\/b> helping.<\/td><\/tr><tr><td><span class='cell-em'>neither A nor B<\/span><\/td><td>B<\/td><td>Neither Mr. Jones nor his secretary <b>is<\/b> going.<\/td><\/tr><tr><td><span class='cell-em'>not only A but also B<\/span><\/td><td>B<\/td><td>Not only I but also my assistant <b>is<\/b> going.<\/td><\/tr><tr><td><span class='cell-em'>not A but B<\/span><\/td><td>B<\/td><td>Not my colleagues but I <b>am<\/b> to blame.<\/td><\/tr><\/table><div class='g-note'>疑問句動詞在前，跟最靠近的 A 一致：<b>Are<\/b> you or he to blame?<\/div>"}, {"type": "grammar", "sec": 7, "title": "最容易搞混的一組", "subtitle": "小節 7 · 誰是重點，就跟誰一致", "content": "<table class='g-table'><tr><th>結構<\/th><th>規則<\/th><th>例句<\/th><\/tr><tr><td><span class='cell-em'>both A and B<\/span><\/td><td>永遠複數<\/td><td>Both the manager and his assistant <b>are<\/b> away.<\/td><\/tr><tr><td><span class='cell-em'>A as well as B<\/span><\/td><td>看 A<\/td><td>The manager as well as his assistants <b>is<\/b> away.<\/td><\/tr><tr><td><span class='cell-em'>not only A but also B<\/span><\/td><td>看 B<\/td><td>Not only the manager but also his assistants <b>are<\/b> away.<\/td><\/tr><tr><td><span class='cell-em'>either of + 複數<\/span><\/td><td>單數<\/td><td>Either of the rooms <b>is<\/b> available.<\/td><\/tr><\/table><div class='g-highlight'>as well as 看前面；not only…but also 看後面。<\/div>"}, {"type": "question", "num": "p.140 題目①", "label": "p.140 題目①", "sentence": "Not only my parents but also one of my friends, Jerry, _______ joining the dinner gathering.", "options": ["is", "are", "will", "have"], "answer": 0, "zh": "不只我父母，連我一個朋友 Jerry 也會參加晚餐聚會。", "zhq": "不只我父母，連我一個朋友 Jerry 也 ____ 參加晚餐聚會。", "rule": "not only A but also B → 看 B", "explanation": "靠近動詞的 B 是 one of my friends → 單數", "vocab": [], "star": false}, {"type": "question", "num": "CH8 總複習 Q3", "label": "CH8 總複習 Q3", "sentence": "Neither the promotion plan nor the advertising campaigns involved in this marketing project _______ practical.", "options": ["has been", "is", "are", "was"], "answer": 2, "zh": "這個行銷專案所涉及的促銷計畫和廣告活動都不實際。", "zhq": "這個行銷專案所涉及的促銷計畫和廣告活動都 ____ 不實際。", "rule": "neither A nor B → 看 B", "explanation": "靠近動詞的主詞 campaigns → 複數", "vocab": [], "star": false}, {"type": "practice", "title": "Quick Practice 7｜靠近原則", "subtitle": "小節 7 · 括號內動詞改成正確形式", "items": [["Either the CEO or the vice presidents ___ (make) the final decision.", "make", "靠近 vice presidents → 複數", "最後的決定由執行長或副總們做。"], ["Neither the students nor the teacher ___ (know) the answer.", "knows", "靠近 teacher → 單數", "學生和老師都不知道答案。"], ["Not only the hotel rooms but also the lobby ___ (be) renovated last year.", "was", "靠近 lobby → 單數；last year → 過去", "不只飯店房間，大廳去年也整修過了。"], ["Both the director and the producer ___ (attend) the film festival every year.", "attend", "both A and B → 永遠複數", "導演和製片每年都會參加影展。"], ["___ (be) the manager or the assistants coming to the meeting?", "Is", "疑問句，動詞靠近 the manager → 單數", "來開會的是經理還是助理們？"]]}, {"type": "grammar", "sec": 8, "title": "部分詞：看 of 後面的名詞", "subtitle": "小節 8 · 課本要點七", "content": "<div class='g-formula'>most / half / part / some / all / a lot / lots / plenty / 分數 / percent / the rest + of + N → 看 N<\/div><table class='g-table'><tr><th>部分詞<\/th><th>+ 複數 → 複數<\/th><th>+ 單數／不可數 → 單數<\/th><\/tr><tr><td><span class='cell-em'>Most of<\/span><\/td><td>Most of our reps <b>are<\/b> articulate.<\/td><td>Most of my time <b>is<\/b> spent…<\/td><\/tr><tr><td><span class='cell-em'>Half of<\/span><\/td><td>Half of the cherries <b>were<\/b> given…<\/td><td>Half of the watermelon <b>was<\/b> given…<\/td><\/tr><tr><td><span class='cell-em'>A lot of / Lots of<\/span><\/td><td>A lot of cars <b>are<\/b> on display.<\/td><td>A lot of information <b>is<\/b> online.<\/td><\/tr><tr><td><span class='cell-em'>分數 / percent<\/span><\/td><td>30 percent of adults <b>are<\/b>…<\/td><td>Two-thirds of the land <b>is<\/b>…<\/td><\/tr><tr><td><span class='cell-em'>The rest of<\/span><\/td><td>The rest of us <b>are<\/b> staying.<\/td><td>The rest of my income <b>is<\/b> donated.<\/td><\/tr><\/table>"}, {"type": "grammar", "sec": 8, "title": "固定單數 vs 看 of 後面", "subtitle": "小節 8 · 最常考的對照", "content": "<table class='g-table'><tr><th>句子<\/th><th>動詞<\/th><th>原因<\/th><\/tr><tr><td><b>Each of<\/b> the employees ___…<\/td><td><span class='cell-em'>has<\/span><\/td><td>each 永遠單數<\/td><\/tr><tr><td><b>One of<\/b> the employees ___…<\/td><td><span class='cell-em'>is<\/span><\/td><td>one 永遠單數<\/td><\/tr><tr><td><b>The number of<\/b> employees ___…<\/td><td><span class='cell-em'>is<\/span><\/td><td>一個數字<\/td><\/tr><tr><td><b>Most of<\/b> the employees ___…<\/td><td><span class='cell-em'>have<\/span><\/td><td>看 employees<\/td><\/tr><tr><td><b>Some of<\/b> the money ___…<\/td><td><span class='cell-em'>has<\/span><\/td><td>看 money<\/td><\/tr><tr><td><b>More than one<\/b> employee ___…<\/td><td><span class='cell-em'>has<\/span><\/td><td>固定用單數<\/td><\/tr><\/table><div class='g-ex-box'><div class='g-ex'>Nearly half of the products <b>were exported<\/b>.<span class='zh2 zh-target'>將近一半的產品被出口。（複數＋被動）<\/span><\/div><div class='g-ex'>Lots of customer information <b>is stored<\/b> in our database.<span class='zh2 zh-target'>很多客戶資料存在資料庫裡。（不可數＋被動）<\/span><\/div><\/div>"}, {"type": "question", "num": "p.144 題目①", "label": "p.144 題目①", "sentence": "Nearly two-thirds of the land in Taipei _______ unsuitable for farming.", "options": ["is", "are", "were", "being"], "answer": 0, "zh": "台北將近三分之二的土地不適合耕種。", "zhq": "台北將近三分之二的土地 ____ 不適合耕種。", "rule": "部分詞 + 不可數名詞 → 單數", "explanation": "two-thirds of + land（不可數）→ 單數", "vocab": [], "star": false}, {"type": "question", "num": "p.144 題目②", "label": "p.144 題目②", "sentence": "Most of our managers _______ received comprehensive sales training.", "options": ["have", "have been", "are being", "had been"], "answer": 0, "zh": "我們多數經理人都已經接受過完整的業務訓練。", "zhq": "我們多數經理人都 ____ 接受過完整的業務訓練。", "rule": "Most of + 複數＋現在完成主動", "explanation": "managers 複數；have received 是主動，後面有受詞 training", "vocab": [], "star": false}, {"type": "question", "num": "p.144 題目③", "label": "p.144 題目③", "sentence": "Lots of customer information _______ stored in our database.", "options": ["is", "are", "have", "should"], "answer": 0, "zh": "很多客戶資料都存放在我們的資料庫中。", "zhq": "很多客戶資料都 ____ 存放在我們的資料庫中。", "rule": "Lots of + 不可數＋被動", "explanation": "information 不可數 → 單數；is stored 被動", "vocab": [], "star": false}, {"type": "question", "num": "CH8 總複習 Q1", "label": "CH8 總複習 Q1", "sentence": "Nearly half of the industrial products of the United States _______ to other countries.", "options": ["were exported", "was exported", "exported", "has exported"], "answer": 0, "zh": "美國幾乎一半的工業產品都出口到其他國家。", "zhq": "美國幾乎一半的工業產品都 ____ 到其他國家。", "rule": "部分詞＋被動＋過去式", "explanation": "half of products → 複數；產品是被出口的 → 被動", "vocab": [], "star": false}, {"type": "question", "num": "CH8 總複習 Q4", "label": "CH8 總複習 Q4", "sentence": "The sources of the information _______ listed in the back of the pamphlet.", "options": ["are", "isn't", "has been", "is"], "answer": 0, "zh": "資料來源列在手冊背面。", "zhq": "資料來源 ____ 在手冊背面。", "rule": "介系詞片語＋被動", "explanation": "主詞 sources 複數；are listed 被動", "vocab": [], "star": false}, {"type": "practice", "title": "Quick Practice 8｜部分詞", "subtitle": "小節 8 · 括號內動詞改成正確形式", "items": [["Most of the furniture in the office ___ (be) old.", "is", "furniture 不可數 → 單數", "辦公室裡大部分家具都很舊。"], ["About 40 percent of the employees ___ (work) from home.", "work", "employe NW21", "label": "NW21", "sentence": "Not only the customers but also the store manager _______ about the new return policy.", "options": ["complain", "is complaining", "are complaining", "have complained"], "answer": 1, "zh": "不只顧客，連店長都在抱怨新的退貨政策。", "zhq": "不只顧客，連店長都 ____ 新的退貨政策。", "rule": "not only A but also B → 看 B＋進行式", "explanation": "單數", "vocab": [], "star": false}, {"type": "question", "num": "NW22", "label": "NW22", "sentence": "The committee submitted _______ final report to the board last Friday.", "options": ["their", "its", "it", "them"], "answer": 1, "zh": "委員會上週五向董事會提交了最終報告。", "zhq": "委員會上週五向董事會提交了 ____ 最終報告。", "rule": "代名詞一致：committee → its", "explanation": "committee 作為一個整體 → its", "vocab": [], "star": false}, {"type": "question", "num": "NW23", "label": "NW23", "sentence": "Every manager and supervisor _______ to attend the safety training.", "options": ["need", "needs", "needing", "are needed"], "answer": 1, "zh": "每位經理和主管都需要參加安全訓練。", "zhq": "每位經理和主管都 ____ 參加安全訓練。", "rule": "every A and B → 單數", "explanation": "every 修飾 A and B → 單數", "vocab": [], "star": false}, {"type": "question", "num": "NW24", "label": "NW24", "sentence": "Reading customer reviews carefully _______ us improve our products.", "options": ["help", "helps", "helping", "have helped"], "answer": 1, "zh": "仔細閱讀顧客評論，幫助我們改善產品。", "zhq": "仔細閱讀顧客評論，____ 我們改善產品。", "rule": "動名詞主詞 → 單數", "explanation": "Reading… 是一件事 → 單數", "vocab": [], "star": false}, {"type": "question", "num": "NW25", "label": "NW25", "sentence": "Half of the budget _______ already been spent on advertising.", "options": ["has", "have", "is", "are"], "answer": 0, "zh": "一半的預算已經花在廣告上了。", "zhq": "一半的預算 ____ 花在廣告上了。", "rule": "Half of + 單數 → 單數＋現在完成被動", "explanation": "budget 單數；already → 現在完成", "vocab": [], "star": false}, {"type": "question", "num": "NW26", "label": "NW26", "sentence": "The goods _______ shipped to Singapore yesterday.", "options": ["was", "were", "is", "has been"], "answer": 1, "zh": "貨物昨天已運往新加坡。", "zhq": "貨物昨天 ____ 運往新加坡。", "rule": "goods → 複數＋過去被動", "explanation": "複數過去被動", "vocab": [], "star": false}, {"type": "question", "num": "NW27", "label": "NW27", "sentence": "The rest of the applicants _______ contacted by e-mail next week.", "options": ["is", "was", "will be", "has been"], "answer": 2, "zh": "其餘應徵者下週會以電子郵件聯繫。", "zhq": "其餘應徵者下週 ____ 以電子郵件聯繫。", "rule": "the rest of＋未來式（不需一致）", "explanation": "next week → 未來；will 不需一致", "vocab": [], "star": false}, {"type": "question", "num": "NW28", "label": "NW28", "sentence": "Here _______ the brochures you requested for the trade show.", "options": ["is", "are", "has", "was"], "answer": 1, "zh": "這是您為商展索取的宣傳手冊。", "zhq": "____ 您為商展索取的宣傳手冊。", "rule": "Here are 倒裝", "explanation": "複數", "vocab": [], "star": false}, {"type": "question", "num": "NW29", "label": "NW29", "sentence": "The results of the customer survey _______ that most users prefer the older design.", "options": ["show", "shows", "showing", "is shown"], "answer": 0, "zh": "顧客調查結果顯示，大多數使用者偏好舊設計。", "zhq": "顧客調查結果 ____，大多數使用者偏好舊設計。", "rule": "介系詞片語＋that 子句", "explanation": "主詞 results 複數", "vocab": [], "star": false}, {"type": "question", "num": "NW30", "label": "NW30", "sentence": "Economics _______ one of the most popular majors at the university.", "options": ["is", "are", "have", "being"], "answer": 0, "zh": "經濟學是這所大學最熱門的主修之一。", "zhq": "經濟學 ____ 這所大學最熱門的主修之一。", "rule": "-ics 學科 → 單數", "explanation": "學科名稱 → 單數", "vocab": [], "star": false}, {"type": "practice", "title": "改錯練習 1–5", "subtitle": "方括號內的字有錯，請改正並說出規則", "items": [["The price of these new laptops [are] too high.", "is", "主詞是 price（小節 2）", "這些新筆電的價格太高了。"], ["Everyone in the two departments [have] received the memo.", "has", "everyone 永遠單數（小節 4）", "兩個部門的每個人都收到備忘錄了。"], ["The CEO, together with his assistants, [are] flying to Tokyo.", "is", "together with 看 A（小節 2）", "執行長和他的助理們將飛往東京。"], ["There [is] many reasons to choose our service.", "are", "There 後的真正主詞 reasons（小節 6）", "選擇我們的服務有很多理由。"], ["Each of the applicants [have] to submit two references.", "has", "Each of → 單數（小節 4）", "每位應徵者都要提交兩封推薦信。"]]}, {"type": "practice", "title": "改錯練習 6–10", "subtitle": "方括號內的字有錯，請改正並說出規則", "items": [["The number of complaints [have] dropped this month.", "has", "The number of → 單數（小節 4）", "本月客訴數量下降了。"], ["A number of customers [has] asked for a refund.", "have", "A number of → 複數（小節 4）", "有許多顧客要求退款。"], ["Neither the manager nor the employees [was] told about the change.", "were", "靠近原則：employees（小節 7）", "經理和員工都沒有被告知這項改變。"], ["The police [is] investigating the accident.", "are", "police 永遠複數（小節 5）", "警方正在調查這起事故。"], ["Most of the information on these websites [are] out of date.", "is", "information 不可數（小節 8）", "這些網站上大部分資訊都過時了。"]]}, {"type": "passage", "title": "Office Renovation", "subtitle": "Part 6 型短文 · 4 空格", "content": "<div class=\"slide-article\" lang=\"en\">To: All Staff\nFrom: Facilities Office\nSubject: Office Renovation\n\nThe renovation of the second and third floors (1) _______ scheduled to begin on Monday, May 6. During this period, each of the affected teams (2) _______ to a temporary workspace on the fifth floor. Neither the cafeteria nor the meeting rooms on the first floor (3) _______ affected. A list of the new desk assignments, along with a floor plan, (4) _______ attached to this e-mail. Please contact the facilities office if you have any questions.<\/div>"}, {"type": "question", "num": "P6-(1)", "label": "Part 6 (1)", "sentence": "The renovation of the second and third floors _______ scheduled to begin on Monday, May 6.", "options": ["is", "are", "have", "being"], "answer": 0, "zh": "二樓和三樓的整修工程預計於 5 月 6 日星期一開始。", "zhq": "二樓和三樓的整修工程 ____ 預計於 5 月 6 日星期一開始。", "rule": "Part 6 短文", "explanation": "主詞 renovation；of the second and third floors 是修飾語", "vocab": [], "star": false, "article": "<div class=\"slide-article\" lang=\"en\">To: All Staff\nFrom: Facilities Office\nSubject: Office Renovation\n\nThe renovation of the second and third floors (1) _______ scheduled to begin on Monday, May 6. During this period, each of the affected teams (2) _______ to a temporary workspace on the fifth floor. Neither the cafeteria nor the meeting rooms on the first floor (3) _______ affected. A list of the new desk assignments, along with a floor plan, (4) _______ attached to this e-mail. Please contact the facilities office if you have any questions.<\/div>"}, {"type": "question", "num": "P6-(2)", "label": "Part 6 (2)", "sentence": "During this period, each of the affected teams _______ to a temporary workspace on the fifth floor.", "options": ["move", "will move", "moving", "are moving"], "answer": 1, "zh": "整修期間，每個受影響的團隊都將搬到五樓的臨時辦公區。", "zhq": "整修期間，每個受影響的團隊都 ____ 到五樓的臨時辦公區。", "rule": "Part 6 短文", "explanation": "each of → 單數；during this period 指未來 → will move（will 不需一致）", "vocab": [], "star": false, "article": "<div class=\"slide-article\" lang=\"en\">To: All Staff\nFrom: Facilities Office\nSubject: Office Renovation\n\nThe renovation of the second and third floors (1) _______ scheduled to begin on Monday, May 6. During this period, each of the affected teams (2) _______ to a temporary workspace on the fifth floor. Neither the cafeteria nor the meeting rooms on the first floor (3) _______ affected. A list of the new desk assignments, along with a floor plan, (4) _______ attached to this e-mail. Please contact the facilities office if you have any questions.<\/div>"}, {"type": "question", "num": "P6-(3)", "label": "Part 6 (3)", "sentence": "Neither the cafeteria nor the meeting rooms on the first floor _______ affected.", "options": ["is", "are", "has", "being"], "answer": 1, "zh": "一樓的員工餐廳和會議室都不會受到影響。", "zhq": "一樓的員工餐廳和會議室都不會 ____ 影響。", "rule": "Part 6 短文", "explanation": "neither…nor → 看 meeting rooms（複數）", "vocab": [], "star": false, "article": "<div class=\"slide-article\" lang=\"en\">To: All Staff\nFrom: Facilities Office\nSubject: Office Renovation\n\nThe renovation of the second and third floors (1) _______ scheduled to begin on Monda
