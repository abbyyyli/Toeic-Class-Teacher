<script>const slides=[{"type": "overview", "title": "Lesson 16｜閱讀 181–200", "subtitle": "Mode A · 多益試題 · 20 題", "content": "<div class=\"hero-grid\"><div class=\"hero-card\"><b>20<\/b><span>題依原題號<\/span><\/div><div class=\"hero-card\"><b>4<\/b><span>組完整文章<\/span><\/div><div class=\"hero-card\"><b>Part 7<\/b><span>先讀文章，再做題<\/span><\/div><\/div><div class=\"g-formula\">作答流程：先判文章類型 → 讀題幹 → 回原文找證據 → 排除干擾選項<\/div><div class=\"g-note\">按左右方向鍵換頁；按 Z 顯示／隱藏中文；空白鍵揭曉／收回答案。題目頁也可以展開「查看完整文章」。<\/div>"}, {"type": "overview", "title": "閱讀時先畫四格", "subtitle": "文章、人物、時間、證據", "content": "<div class=\"step-grid\"><div class=\"step\"><b>1<\/b><span>認出文體及讀者<\/span><\/div><div class=\"step\"><b>2<\/b><span>圈出問題的限制<\/span><\/div><div class=\"step\"><b>3<\/b><span>回文章定位句子<\/span><\/div><div class=\"step\"><b>4<\/b><span>逐項排除人名、時間與範圍錯置<\/span><\/div><\/div>"}, {"type": "passage", "title": "Restaurant Tasty and a Customer Review", "subtitle": "Questions 181–185", "content": "<div class=\"article-name\">Document 1<\/div><div class=\"slide-article\" lang=\"en\">Tasty is a fabulously stylish restaurant. Tasty combines a fascinating location with an elaborate restaurant and hotel concept all in the center of Garden City. The restaurant Tasty is stunningly designed with exposed brickwork, low arched ceilings and modern furnishings offering a cozy yet spacious feel. There is also a leafy inner courtyard providing a tranquil setting for al fresco dining. The menu at restaurant Tasty is both innovative and interesting combining Asian and European elements to create a totally new culinary experience. Favorites include grilled lobster, beef steak and chicken. The sushi counter is currently proving to be one of the highlights of restaurant Tasty and foodies in Garden City are flocking here. The set menus for business lunches are a steal at just 8 USD from Monday to Friday where 3 courses of amazing cuisine can be enjoyed. The wine list deserves a mention if not for the huge selection of champagnes available.<\/div><div class=\"article-name\">Document 2<\/div><div class=\"slide-article\" lang=\"en\">Restaurant Tasty Review: “Good food, not very friendly staff”\n\nReviewed on August 3rd, 2019, by Paul Fidelity\n\nWhen we arrived, we waited at the entrance, 10 minutes maybe. It wasn’t obvious if we could just sit or whether we had to be seated. A waitress just about acknowledged us and indicated we could sit anywhere. Our order was taken fairly promptly and we didn’t have to wait long for our drinks or food. We ordered three starters and the food was really good and the flavors were excellent. What let the place down was the service. The staff just didn’t come across in a very friendly way - for example, no one came to check if the food was ok. I don’t think we would return.\n\nVisited July 2019\nValue: Good\nAtmosphere: Excellent\nService: Fair\nFood: Excellent<\/div><div class=\"q-zh zh-target\">餐廳介紹強調市中心時尚環境、舒適中庭、多元料理與週一至五 8 美元三道菜商務午餐；Paul 的評論則稱食物優秀，但員工不夠友善，到門口約等十分鐘，因此不想再訪。<\/div>"}, {"type": "question", "num": 181, "title": "Restaurant Tasty：介紹與顧客評價", "sentence": "What does the first article suggest about the restaurant?", "options": ["It serves traditional Chinese food.", "It is poorly decorated.", "It really is a trendy restaurant.", "It is located in a rural area."], "answer": 2, "zh": "第一篇文章暗示這家餐廳有什麼特點？", "rule": "整篇特徵概括", "explanation": "stylish、stunningly designed、modern furnishings 都在說時髦，C 的 trendy 是同義改寫。", "vocab": ["stylish（adj. 時尚的；stylish restaurant；Tasty is a stylish restaurant.）"], "article": "<div class=\"article-name\">Document 1<\/div><div class=\"slide-article\" lang=\"en\">Tasty is a fabulously stylish restaurant. Tasty combines a fascinating location with an elaborate restaurant and hotel concept all in the center of Garden City. The restaurant Tasty is stunningly designed with exposed brickwork, low arched ceilings and modern furnishings offering a cozy yet spacious feel. There is also a leafy inner courtyard providing a tranquil setting for al nt 2<\/div><div class=\"slide-article\" lang=\"en\">Restaurant Tasty Review: “Good food, not very friendly staff”\n\nReviewed on August 3rd, 2019, by Paul Fidelity\n\nWhen we arrived, we waited at the entrance, 10 minutes maybe. It wasn’t obvious if we could just sit or whether we had to be seated. A waitress just about acknowledged us and indicated we could sit anywhere. Our order was taken fairly promptly and we didn’t have to wait long for our drinks or food. We ordered three starters and the food was really good and the flavors were excellent. What let the place down was the service. The staff just didn’t come across in a very friendly way - for example, no one came to check if the food was ok. I don’t think we would return.\n\nVisited July 2019\nValue: Good\nAtmosphere: Excellent\nService: Fair\nFood: Excellent<\/div>", "star": true}, {"type": "question", "num": 185, "title": "Restaurant Tasty：介紹與顧客評價", "sentence": "How long did Paul Fidelity wait to be seated?", "options": ["More than twenty minutes", "Around ten minutes", "Only a minute", "One hour"], "answer": 1, "zh": "Paul Fidelity 等了多久才入座？", "rule": "時間定位", "explanation": "評論第一句 we waited at the entrance, 10 minutes maybe＝大約十分鐘。", "vocab": ["maybe（adv. 大約；ten minutes maybe；We waited ten minutes, maybe.）"], "article": "<div class=\"article-name\">Document 1<\/div><div class=\"slide-article\" lang=\"en\">Tasty is a fabulously stylish restaurant. Tasty combines a fascinating location with an elaborate restaurant and hotel concept all in the center of Garden City. The restaurant Tasty is stunningly designed with exposed brickwork, low arched ceilings and modern furnishings offering a cozy yet spacious feel. There is also a leafy inner courtyard providing a tranquil setting for al fresco dining. The menu at restaurant Tasty is both innovative and interesting combining Asian and European elements to create a totally new culinary experience. Favorites include grilled lobster, beef steak and chicken. The sushi counter is currently proving to be one of the highlights of restaurant Tasty and foodies in Garden City are flocking here. The set menus for business lunches are a steal at just 8 USD from Monday to Friday where 3 courses of amazing cuisine can be enjoyed. The wine list deserves a mention if not for the huge selection of champagnes available.<\/div><div class=\"article-name\">Document 2<\/div><div class=\"slide-article\" lang=\"en\">Restaurant Tasty Review: “Good food, not very friendly staff”\n\nReviewed on August 3rd, 2019, by Paul Fidelity\n\nWhen we arrived, we waited at the entrance, 10 minutes maybe. It wasn’t obvious if we could just sit or whether we had to be seated. A waitress just about acknowledged us and indicated we could sit anywhere. Our order was taken fairly promptly and we didn’t have to wait long for our drinks or food. We ordered three starters and the food was really good and the flavors were excellent. What let the place down was the service. The staff just didn’t come across in a very friendly way - for example, no one came to check if the food was ok. I don’t think we would return.\n\nVisited July 2019\nValue: Good\nAtmosphere: Excellent\nService: Fair\nFood: Excellent<\/div>", "star": false}, {"type": "focus", "title": "Language Focus｜Restaurant Review", "subtitle": "Questions 181–185 · Vocabulary, Collocations & Patterns", "content": "<div class=\"focus-grid\"><div class=\"focus-card\"><div class=\"focus-word\">stylish<span class=\"focus-pos\">adjective<\/span><\/div><div class=\"focus-zh\">時尚的<\/div><div class=\"focus-collocation\">a stylish restaurant<\/div><div class=\"focus-example\">The new café is small but stylish.<\/div><\/div><div class=\"focus-card\"><div class=\"focus-word\">tranquil<span class=\"focus-pos\">adjective<\/span><\/div><div class=\"focus-zh\">寧靜的<\/div><div class=\"focus-collocation\">a tranquil setting<\/div><div class=\"focus-example\">The lake offers a tranquil setting.<\/div><\/div><div class=\"focus-card\"><div class=\"focus-word\">a steal<span class=\"focus-pos\">noun<\/span><\/div><div class=\"focus-zh\">物超所值的東西<\/div><div class=\"focus-collocation\">a steal at 8 USD<\/div><div class=\"focus-example\">This lunch set is a steal at 8 USD.<\/div><\/div><div class=\"focus-card\"><div class=\"focus-word\">acknowledge<span class=\"focus-pos\">verb<\/span><\/div><div class=\"focus-zh\">招呼；注意到<\/div><div class=\"focus-collocation\">acknowledge a customer<\/div><div class=\"focus-example\">The clerk acknowledged us with a smile.<\/div><\/div><div class=\"focus-card\"><div class=\"focus-word\">let ... down<span class=\"focus-pos\">phrasal verb<\/span><\/div><div class=\"focus-zh\">讓……失望／扣分<\/div><div class=\"focus-collocation\">let the place down<\/div><div class=\"focus-example\">The slow service let the place down.<\/div><\/div><div class=\"focus-card\"><div class=\"focus-word\">come across<span class=\"focus-pos\">phrasal verb<\/span><\/div><div class=\"focus-zh\">給人……的印象<\/div><div class=\"focus-collocation\">come across as friendly<\/div><div class=\"focus-example\">He came across as very polite.<\/div><\/div><\/div><div class=\"pattern-strip\"><div class=\"pattern-item\"><div class=\"pattern-formula\">What let ... down was + N.<\/div><div class=\"pattern-note\">讓……扣分的是……<\/div><div class=\"pattern-example\">What let the hotel down was the noise.<\/div><\/div><div class=\"pattern-item\"><div class=\"pattern-formula\">a steal at just + price<\/div><div class=\"pattern-note\">只要……元，很划算<\/div><div class=\"pattern-example\">The tickets are a steal at just $5.<\/div><\/div><\/div>"}, {"type": "practice", "title": "Quick Practice｜Restaurant Language", "subtitle": "Questions 181–185 · Complete each new sentence", "items": [["The hotel lobby is ___ designed with glass walls and modern furniture.", "stunningly", "be stunningly designed", "這間飯店大廳設計得令人驚豔，有玻璃牆和現代家具。"], ["At only five dollars, this sandwich is a ___.", "steal", "a steal at + 價格", "只要五美元，這個三明治真是超划算。"], ["What let the trip ___ was the bad weather.", "down", "let ... down", "讓這趟旅行扣分的是惡劣的天氣。"], ["The new manager came ___ as friendly and helpful.", "across", "come across as + adj.", "新經理給人友善又樂於助人的印象。"]]}, {"type": "passage", "title": "York Tech’s 20th Anniversary Campaign", "subtitle": "Questions 186–190", "content": "<div class=\"article-name\">Document 1<\/div><div class=\"slide-article\" lang=\"en\">Dear Ms. Hudson,\n\nWe hope that you will join us in celebrating 20 years of York Tech\n\nTake an exciting trip through 20 years of York Tech History and discover interesting facts about the company, technologies, and products.\n\nWe want to sincerely express our thanks to customers like you for the successful working relationships we have enjoyed over the past 20 years. We would like to emphasize our thanks by making donations to the charitable organization Help Children’s Villages. We hope that you will take part in our anniversary campaign and leave a greeting for York Tech. When we receive your greeting through www.york-tech-20.com, we will donate an amount of USD$20 to the charity.\n\nWe look forward to a continuous good working relationship with you.\n\nSincerely,\nJack Ng\nYork Tech.<\/div><div class=\"article-name\">Document 2<\/div><div class=\"slide-article\" lang=\"en\">Your greeting may contain a maximum of 50 characters. Name and Company are not mandatory fields, but of course we would especially enjoy seeing personal messages. After sending your entry, you will receive an e-mail with a verification link. When you click the link, your entry is posted and our donation is initiated.\n\nNote: Each guest may only participate once, but please feel free to let your colleagues know about this. Thank you very much!\n\nName: Nina Hudson\nCompany: Five-Star Network Inc.\nE-mail: ns@five-star.com\nCell phone: 837-4784-5837\nGreeting: Congratulations to you on this auspicious occasion!<\/div><div class=\"article-name\">Document 3<\/div><div class=\"slide-article\" lang=\"en\">York Tech. Celebrates 20th Year Anniversary\n\nYork City, New York – (Business World) – York Tech has reached an exciting milestone as the company celebrates 20 years of delivering innovative technology solutions to enterprise clients.\n\nJerry Bells, York Tech CEO, reflected on the company’s 20th anniversary by saying, “This has been the most exciting 20 years of my life. We started out with a philosophy of listening to our clients, delivering quality products and providing attentive customer service. I believe because of that – York Tech remains viable, strong and growing. A big thank you to the hundreds of valued customers and strategic partners.”\n\nLinda Smith, York Tech CFO, added, “York Tech has weathered troubling market cycles and unimaginable technological influences. Thanks to our leadership team and devoted employees, we’ve been able to grow and thrive. I’m proud to report that our business is solid and that we are looking forward to the next 20 years that lie ahead.”\n\nContact\nEva Kim, 458-838-9999\nevak@york-tech.com\nPR Manager<\/div><div class=\"q-zh zh-target\">York Tech 邀請客戶 Hudson 參加二十週年網站留言活動；每收到一則且經驗證的祝賀，公司捐二十美元給兒童慈善組織。表單顯示 Nina Hudson 的公司與祝賀文字；新聞稿由 CEO、CFO 分別談公司的穩健成長。<\/div>"}, {"type": "question", "num": 186, "title": "York Tech 二十週年：邀請、留言表與新聞", "sentence": "What is true about York Tech?", "options": ["They donate USD$20 to the charity every year.", "They want to recruit Ms. Hudson.", "They are celebrating the 20th anniversary.", "They are a not-for-profit organization."], "answer": 2, "zh": "關於 York Tech，下列何者正確？", "rule": "跨篇活動主題", "explanation": "邀請信 celebrating 20 years、新聞稿 20th Year Anniversary，兩篇都支持 C。", "vocab": ["anniversary（n. 週年；20th anniversary；York Tech celebrates its 20th anniversary.）"], "article": "<div class=\"article-name\">Document 1<\/div><div class=\"slide-article\" lang=\"en\">Dear Ms. Hudson,\n\nWe hope that you will join us in celebrating 20 years of York Tech\n\nTake an exciting trip through 20 years of York Tech History and discov ">Thanks to our staff, we were able to grow.<\/div><\/div><\/div>"}, {"type": "practice", "title": "Quick Practice｜Anniversary Campaign", "subtitle": "Questions 186–190 · Complete each new sentence", "items": [["Our school will celebrate its 50th ___ next month.", "anniversary", "celebrate the 50th anniversary", "我們學校下個月將慶祝五十週年。"], ["___ we receive your form, we will send you a confirmation e-mail.", "When", "When + 現在式, will + V", "我們一收到您的表格，就會寄確認信給您。"], ["Your phone number is not a ___ field, so you can leave it blank.", "mandatory", "a mandatory field", "電話號碼不是必填欄位，所以你可以留白。"], ["The small bakery has continued to grow and ___ for thirty years.", "thrive", "grow and thrive", "這家小麵包店三十年來持續成長、蓬勃發展。"]]}, {"type": "passage", "title": "Enterprise Data Management Solutions Conference", "subtitle": "Questions 191–195", "content": "<div class=\"article-name\">Document 1<\/div><div class=\"slide-article\" lang=\"en\">Most businesses suffer from the headache of accomplishing multiple business processes and enterprise-wide content amid a tight schedule. Enterprises from various industries are looking for effective solutions to streamline and simplify a myriad of complex processes involving all types of users and documents.\n\nThe upcoming conference will introduce how Enterprise Data Management Solutions can unify users, documents and processes to drive business automation. Solutions with demonstrations will also be shared to bring profound insights on resolving issues of day-to-day business processes.\n\nEvent Details\nDate: 3 August 2019\nTime: 1:30 p.m.-4:30 p.m.\nVenue: Central Conference Centre (CCC), Rexford, CA\nFee: Complimentary only with e-mail confirmation\nAgenda: Attached\n\nTo register, please visit event website at http://www.edms.com or call 1-800-go-events.<\/div><div class=\"article-name\">Document 2<\/div><div class=\"slide-article\" lang=\"en\">Enterprise Data Management Solutions Conference\nEvent Agenda\n\nTime | Topic | Speaker\n1:00 p.m. | Registration |\n1:30 p.m. | Welcome speech | Dr. Steven Flinders, Best Data Co.\n1:45 p.m. | Enterprise Data Management for Business Users\nGood Systems – a leading provider in Enterprise Data Management Solutions will introduce how technology can automatically transform any information entering your organization into useful and accessible data. | Ms. Jessie Kim, Good Systems\n2:30 p.m. | Application Demonstration\nLearn how the application helps Accounts Payable and Purchasing Departments streamline their business and invoice processes – from order to payment. | Mr. Jack Chen, Good Systems\n3:10 p.m. | Coffee Break |\n3:30 p.m. | Healthcare Service Case Study | Mr. Mark Wilson, TC Consulting Inc.\n3:50 p.m. | Financial Service Case Study | Ms. Laura Chen, SDI Accounting Firm\n4:20 p.m. | Q&amp;A and Lucky Draw Session |\n\n*Organizer reserves the right to change the conference program without prior notice.<\/div><div class=\"article-name\">Document 3<\/div><div class=\"slide-article\" lang=\"en\">Conference Feedback\n\nWe are thankful for everyone who was a part of Enterprise Data Management Solutions conference. All attendees played a role in making the conference a successful event. Attendees have written in to share their positive experience of the conference. Some comments are listed below.\n\n“I would like to thank you for conducting an informative and successful conference. I participated in discussions and enjoyed all sessions. Thank you for including me.” – Linda Jones\n\n“I attended the Enterprise Data Management Solutions conference and I would like to formally thank you for organizing this conference. I’ve found the solution to suit our company needs. Thank you once again.” – Terry Dickinson\n\n“Thank you for arranging this conference. I enjoyed meeting talented professionals. I especially enjoyed talking to Mr. Mark Wilson. We have decided to adopt the solution that Mr. Wilson recommended.” – J.J. Lin<\/div><div class=\"q-zh zh-target\">會議介紹企業資料管理方案，八月三日下午 1:30–4:3 to formally thank you for organizing this conference. I’ve found the solution to suit our company needs. Thank you once again.” – Terry Dickinson\n\n“Thank you for arranging this conference. I enjoyed meeting talented professionals. I especially enjoyed talking to Mr. Mark Wilson. We have decided to adopt the solution that Mr. Wilson recommended.” – J.J. Lin<\/div>", "star": true}, {"type": "focus", "title": "Language Focus｜Business Conference", "subtitle": "Questions 191–195 · Vocabulary, Collocations & Patterns", "content": "<div class=\"focus-grid\"><div class=\"focus-card\"><div class=\"focus-word\">streamline<span class=\"focus-pos\">verb<\/span><\/div><div class=\"focus-zh\">精簡（流程）<\/div><div class=\"focus-collocation\">streamline a process<\/div><div class=\"focus-example\">The app streamlines the ordering process.<\/div><\/div><div class=\"focus-card\"><div class=\"focus-word\">venue<span class=\"focus-pos\">noun<\/span><\/div><div class=\"focus-zh\">舉辦地點<\/div><div class=\"focus-collocation\">the event venue<\/div><div class=\"focus-example\">The venue is the city conference centre.<\/div><\/div><div class=\"focus-card\"><div class=\"focus-word\">complimentary<span class=\"focus-pos\">adjective<\/span><\/div><div class=\"focus-zh\">免費的<\/div><div class=\"focus-collocation\">complimentary admission<\/div><div class=\"focus-example\">Admission is complimentary for members.<\/div><\/div><div class=\"focus-card\"><div class=\"focus-word\">agenda<span class=\"focus-pos\">noun<\/span><\/div><div class=\"focus-zh\">議程<\/div><div class=\"focus-collocation\">the conference agenda<\/div><div class=\"focus-example\">Please read the agenda before the meeting.<\/div><\/div><div class=\"focus-card\"><div class=\"focus-word\">case study<span class=\"focus-pos\">noun<\/span><\/div><div class=\"focus-zh\">個案研究<\/div><div class=\"focus-collocation\">a healthcare case study<\/div><div class=\"focus-example\">He presented a healthcare case study.<\/div><\/div><div class=\"focu h academic achievement. The friendly and relaxed learning environment she creates contributes to great commitment of both students and teaching staff. We provide various English training courses. So Please visit our website for more information: www.vision-english.com<\/div><div class=\"article-name\">Document 2<\/div><div class=\"slide-article\" lang=\"en\">Drop us a line here\nYour Name (required): Jerry Kim\nYour Email (required): jerry-kim@goodmail.com\nSubject: Your teachers\n\nYour Message: I’m an 18-year-old student from Korea. I’ve been looking for a course in English at a higher level, and would like to learn more details about your learning center. I would like to ask for further information about your teachers, please. Are they friendly to students and do they have patience? I look forward to your answer and thank you.<\/div><div class=\"article-name\">Document 3<\/div><div class=\"slide-article\" lang=\"en\">To: jerry-kim@goodmail.com\nFrom: Troymarks@vision-english.com\nSubject: Re: Your teachers\n\nHello Jerry,\n\nThank you for your message. To answer your question, we are extremely proud of our teachers. All our teachers are highly qualified native English speakers, and they are all friendly and patient. Our teachers promote students’ participation through problem solving, questioning, and discussion activities. All of our teachers are dedicated, lively, enthusiastic and most of all, passionate about teaching. I am sure you will have a pleasant learning experience with our professional teachers. If you have further questions about our courses, please feel free to contact me.\n\nTroy Marks<\/div><div class=\"q-zh zh-target\">Vision 英語中心刊登自我介紹，宣稱營運逾十年、校長與創辦人 Carol Vision 打造友善輕鬆的學習環境。韓國十八歲學生 Jerry Kim 在網站詢問高階英語課程及教師是否友善、有耐心；Troy Marks 以中心信箱回覆教師均具資格、友善、有耐心，並說明教學方法。<\/div>"}, {"type": "question", "num": 196, "title": "Vision English Learning Center：廣告、詢問與回覆", "sentence": "What is the purpose of the first advertisement?", "options": ["To promote a language function reveal(){let s=slides[current];if(s.type!=='question')return;revealed=!revealed;s.options.forEach((_,i)=>{let el=document.getElementById('opt-'+i);el.classList.toggle('correct',revealed&&i===s.answer);el.classList.toggle('dimmed',revealed&&i!==s.answer)});document.getElementById('key-reveal').classList.toggle('show',revealed);document.getElementById('reveal-btn').textContent=revealed?'隱藏答案 ▲':'揭曉答案 ▼'}
function navigate(dir){current=Math.max(0,Math.min(TOTAL-1,current+dir));render()}function jumpTo(value){current=Number(value);render()}
let jump=document.getElementById('slide-jump');slides.forEach((s,i)=>{let opt=document.createElement('option');opt.value=i;opt.textContent=s.type==='question'?'Q'+s.num:s.type==='passage'?s.subtitle:s.type==='summary'?'總結':'導入 '+(i+1);jump.appendChild(opt)});
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();navigate(1)}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();navigate(-1)}else if(e.key===' '||e.key==='Enter'){e.preventDefault();reveal()}else if(e.key.toLowerCase()==='z')toggleZh()});render();

 }
