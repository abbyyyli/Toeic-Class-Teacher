 {
  "type": "article",
  "label": "Part 7 · 186–190（三篇）",
  "theme": "MBA 招生信＋學生詢問信＋課程介紹（Cale Business School）",
  "text": "<div class='art-doc'>Document 1 | MBA Program Promotion</div><p class=\"letter-salutation\">Dear Ms. Walt,</p>\n<p>It's time to transform your career with a one-year International MBA from Cale Business School this Fall semester. Application volume will increase before the June 15th deadline and submitting your application now can help provide you with the best possible opportunity for acceptance.</p>\n<p>A one-year MBA is a serious investment in time and money. In addition, it's a condensed program, so it is certainly more challenging than a traditional MBA. Our students return to the workforce more quickly and recoup their investment in just over two years. International MBA graduates see an average increase in pre-MBA salary of 120%.</p>\n<p>Don't wait to transform your career. Contact us for more information.</p>\n<p class=\"letter-signoff\" style=\"text-align:right;margin-top:18px\">Sincerely,<br>Jerry Swift<br>Consultant</p><div class='art-doc'>Document 2 | Program Inquiry</div><p class=\"letter-salutation\">Dear Mr. Swift,</p>\n<p>Thank you for the one-year International MBA information. I am writing to request more details of your program for September 2019 session. I believe that this one-year program will be a solid step toward the obtainment of my ambition in business. After graduating from City University, I've worked as a marketing specialist at ABC company which allows me to gain a deeper insight of marketing processes. Therefore, I am especially interested in learning more about some marketing elective courses your school offers. I would appreciate it if you could provide more details about courses related to online marketing.</p>\n<p class=\"letter-signoff\" style=\"text-align:right;margin-top:18px\">Sincerely,<br>Linda Walt</p><div class='art-doc'>Document 3 | Course Information</div><p class=\"letter-salutation\">Dear Ms. Walt,</p>\n<p>At Cale Business School, we offer ample marketing electives in addition to the required courses. Some specific marketing electives include:</p>\n<p><b>Digital Marketing</b> — Successful marketing campaigns tend to combine online and offline elements to better reach the target audience. The digital marketing course examines the full range of digital marketing activities. This course will include social media, podcasts, and how the online and offline worlds can be connected. Students will also explore how the growth of technology will lead to new opportunities.</p>\n<p><b>Marketing Research and Analytics</b> — All good marketing campaigns begin with thorough market research and end with effective analysis. Marketing people always wonder whether marketing campaigns have reached the target market. What lessons can be learned for other campaigns? This course will cover how to undertake marketing research and how to use the information gathered to help improve decision-making for marketing.</p>\n<p><b>Customer Acquisition through Online Marketing</b> — In this course, students will learn directly from real-world online marketing professionals and create a digital marketing strategy. The purpose of this course is to allow students to have a better understanding of how to plan for and launch a website from scratch and learn to use mobile advertising and web analytics to attract more customers.</p>\n<p>Should you need further information, please visit our website at www.int-mba.com/course/marketing or call me at 998-382-4778.</p>\n<p class=\"letter-signoff\" style=\"text-align:right;margin-top:18px\">Sincerely,<br>Jerry Swift<br>Consultant</p>",
  "zh": "<strong>第一封｜Cale Business School MBA 課程宣傳信</strong><br>親愛的 Walt 女士：<br>現在正是透過 Cale Business School 今年秋季班一年制國際 MBA 課程，轉變您職涯的最佳時機。申請人數將於 6 月 15 日截止日前逐漸增加，現在就提交申請，能為您爭取最好的錄取機會。<br>一年制 MBA 是一項時間與金錢上的重大投資。此外，這是一個密集課程，因此確實比傳統 MBA 更具挑戰性。我們的學生能更快重返職場，並在短短兩年多內回收投資。國際 MBA 畢業生的薪資相較就讀前平均增加 120%。<br>別再等待，現在就開始轉變您的職涯。歡迎聯繫我們以取得更多資訊。<br>Jerry Swift 敬上　顧問<br><br><strong>第二封｜Linda Walt 的回覆</strong><br>親愛的 Swift 先生：<br>感謝您提供一年制國際 MBA 的相關資訊。我寫這封信是想進一步了解貴校 2019 年 9 月班的課程細節。我相信這個一年制課程將是我實現商業抱負的重要一步。自 City University 畢業後，我一直在 ABC 公司擔任行銷專員，這讓我對行銷流程有更深入的認識。因此，我特別想進一步了解貴校提供的行銷選修課程，尤其希望您能提供更多與線上行銷相關課程的詳細資訊。<br>Linda Walt 敬上<br><br><strong>第三封｜Cale Business School 回覆課程介紹</strong><br>親愛的 Walt 女士：<br>在 Cale Business School，除了必修課程之外，我們還提供豐富的行銷選修課程。以下是幾門具體的行銷選修課：<br><br><em>數位行銷</em>——成功的行銷活動通常會結合線上與線下元素，以更有效地觸及目標受眾。本課程將檢視數位行銷活動的完整範疇，內容包含社群媒體、Podcast，以及如何將線上與線下世界串連起來。學生也將探討科技的成長將如何帶來新的機會。<br><em>行銷研究與分析</em>——所有優秀的行銷活動都始於徹底的市場研究，並以有效的分析作結。行銷人員總是想知道：行銷活動是否確實觸及了目標市場？從其他活動中可以學到什麼經驗？本課程將涵蓋如何進行行銷研究，以及如何運用蒐集到的資訊來協助改善行銷決策。<br><em>透過線上行銷開發顧客</em>——在這門課中，學生將直接向真實世界的線上行銷專業人士學習，並擬定一套數位行銷策略。本課程的目的是讓學生更了解如何從零開始規劃並架設網站，並學會運用行動廣告與網站數據分析來吸引更多顧客。<br><br>如需進一步資訊，歡迎造訪我們的網站 www.int-mba.com/course/marketing，或致電 998-382-4778 與我聯繫。<br>Jerry Swift 敬上　顧問"
 },

const TOTAL = SLIDES.length;
let current=0, revealed=false, zhVisible=false;
let askStep=0;

function applyZh(){document.querySelectorAll('.zh-target').forEach(el=>el.classList.toggle('zh-hidden',!zhVisible))}
function toggleZh(){zhVisible=!zhVisible;applyZh();const b=document.getElementById('zh-btn');b.textContent=zhVisible?'中文 ON':'中文 OFF';b.classList.toggle('on',zhVisible)}

function showBtn(id,show){document.getElementById(id).classList.toggle('hidden',!show)}
function setText(id,t){const el=document.getElementById(id);if(el)el.textContent=t}

function render(){
  const s=SLIDES[current];
  revealed=false; askStep=0;
  document.getElementById('progress-text').textContent=(current+1)+' / '+TOTAL;
  document.getElementById('progress-bar').style.width=Math.round((current+1)/TOTAL*100)+'%';
  document.getElementById('prev-btn').disabled=current===0;
  document.getElementById('next-btn').disabled=current===TOTAL-1;
  const labels={grammar:'文法教學',article:'閱讀文章',question:'練習題'};
  setText('slide-type-label', labels[s.type]||'');
  showBtn('reveal-btn', s.type==='question');
  showBtn('next-item-btn', false);
  showBtn('ask-btn', s.type==='grammar' && s.ask && s.ask.length>0);
  showBtn('zh-btn', s.type==='question'||s.type==='article');
  const el=document.getElementById('slide-content');

  if(s.type==='grammar'){
    const hasAsk=s.ask&&s.ask.length>0;
    el.innerHTML=`
      <div class="gram-label">Lesson 09 · Part 7 閱讀策略</div>
      <div class="gram-title">${s.title}</div>
      <div class="gram-sub">${s.subtitle}</div>
      ${s.content}
      ${hasAsk?`<div id="ask-panel" style="display:none">
        <div class="ask-progress" id="ask-prog"></div>
        <div class="ask-q" id="ask-q"></div>
        <div class="ask-a" id="ask-a"></div>
      </div>`:''}
    `;
    if(hasAsk) document.getElementById('ask-btn').textContent='❓ 問學生 ('+s.ask.length+')';
  }
  else if(s.type==='article'){
    el.innerHTML=`
      <div class="art-label">${s.label}</div>
      <div class="art-title">閱讀文章</div>
      <div class="art-theme">📌 主題：${s.theme}</div>
      <div class="art-text">${s.text}</div>
      <div class="art-zh zh-target">${s.zh}</div>`;
  }
  else{
    const wide = s.options.some(o=>o.length>28);
    const opts=s.options.map((o,i)=>`<div class="q-opt" id="opt-${i}"><span class="q-opt-lbl">${String.fromCharCode(65+i)}</span>${o}</div>`).join('');
    el.innerHTML=`
      <div class="q-header">
        <span class="q-num">${s.num}</span>
        <span class="q-type-tag">${s.qtype}</span>
        ${s.star?'<span class="q-star">⭐ 重點題</span>':''}
        ${s.part6?'<span class="q-p6">Part 6</span>':''}
      </div>
      <div class="q-sentence">${s.sentence}</div>
      <div class="q-zh zh-target">${s.zh}</div>
      <div class="q-opts ${wide?'wide':''}">${opts}</div>
      <div class="key-reveal" id="key-reveal">
        <strong>答案 ${String.fromCharCode(65+s.answer)}：${s.options[s.answer]}</strong>
      </div>`;
  }
  setTimeout(applyZh,0);
  resetRevealBtn();
}

function resetRevealBtn(){
  const b=document.getElementById('reveal-btn');
  b.textContent='揭曉答案 ▼';b.style.background='';b.style.color='';
}

function reveal(){
  const s=SLIDES[current];
  const b=document.getElementById('reveal-btn');
  if(!revealed){
    revealed=true;
    s.options.forEach((_,i)=>{
      const el=document.getElementById('opt-'+i);
      if(i===s.answer) el.classList.add('correct');
      else el.classList.add('dimmed');
    });
    document.getElementById('key-reveal').classList.add('show');
    b.textContent='隱藏答案 ▲';b.style.background='rgba(5,150,105,.25)';b.style.color='#34D399';
  } else {
    revealed=false;
    s.options.forEach((_,i)=>{
      const el=document.getElementById('opt-'+i);
      el.classList.remove('correct','dimmed');
    });
    document.getElementById('key-reveal').classList.remove('show');
    resetRevealBtn();
  }
}

function nextItem(){ /* unused in Lesson 09 */ }

function nextAsk(){
  const s=SLIDES[current];
  const panel=document.getElementById('ask-panel');
  const b=document.getElementById('ask-btn');
  if(!panel) return;
  if(askStep===0) panel.style.display='block';
  if(askStep<s.ask.length){
    const [q,a]=s.ask[askStep];
    document.getElementById('ask-q').textContent=q;
    document.getElementById('ask-a').textContent=a;
    document.getElementById('ask-a').classList.remove('show');
    document.getElementById('ask-prog').textContent='問題 '+(askStep+1)+' / '+s.ask.length;
    const oldStep=askStep;
    b.onclick=function(){
      const aa=document.getElementById('ask-a');
      if(!aa.classList.contains('show')){
        aa.classList.add('show');
        b.onclick=function(){askStep=oldStep+1;nextAsk()};
      }
    };
    askStep++;
  } else {
    panel.style.display='none';
    askStep=0;
    b.textContent='❓ 問學生 ('+s.ask.length+')';
    b.onclick=nextAsk;
  }
}

function navigate(dir){
  current=Math.max(0,Math.min(TOTAL-1,current+dir));
  render();
  document.getElementById('slide-area').scrollTop=0;
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();navigate(1)}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();navigate(-1)}
  else if(e.key===' '||e.key==='Enter'){
    e.preventDefault();
    const s=SLIDES[current];
    if(s.type==='question') reveal();
    else if(s.type==='grammar'&&s.ask&&s.ask.length>0) document.getElementById('ask-btn').click();
  }
});

render();
</script>
